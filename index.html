<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prime Reception AI — 3D Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02060a;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

      background:
        radial-gradient(
          circle at 50% 40%,
          #0a1720 0%,
          #03090e 45%,
          #010305 75%,
          #000000 100%
        );
    }

    #stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 40%,
          rgba(0, 0, 0, 0.55) 100%
        );
    }

    #stage canvas {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      z-index: 10;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      color: #6eeaff;

      font-family:
        Arial,
        sans-serif;

      font-size: 15px;
      letter-spacing: 0.08em;
      text-align: center;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="stage">
    <div id="status">
      Loading Prime Reception AI…
    </div>
  </div>


  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <script type="module">

    import * as THREE from 'three';

    import {
      GLTFLoader
    } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


    const stage =
      document.getElementById('stage');

    const status =
      document.getElementById('status');


    /* =====================================================
       SCENE
    ===================================================== */

    const scene =
      new THREE.Scene();


    /* =====================================================
       CAMERA
    ===================================================== */

    const camera =
      new THREE.PerspectiveCamera(
        32,
        window.innerWidth /
        window.innerHeight,
        0.01,
        1000
      );


    /* =====================================================
       RENDERER
    ===================================================== */

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        2
      )
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
      1.15;

    renderer.setClearColor(
      0x000000,
      0
    );

    stage.appendChild(
      renderer.domElement
    );


    /* =====================================================
       LIGHTING
    ===================================================== */

    const ambient =
      new THREE.HemisphereLight(
        0xdff9ff,
        0x050608,
        1.45
      );

    scene.add(
      ambient
    );


    /*
      Front / face light
    */

    const faceLight =
      new THREE.DirectionalLight(
        0xffffff,
        3.3
      );

    faceLight.position.set(
      1.5,
      3.5,
      5
    );

    scene.add(
      faceLight
    );


    /*
      Cyan technological rim
    */

    const cyanRim =
      new THREE.DirectionalLight(
        0x39ddff,
        4.2
      );

    cyanRim.position.set(
      -4,
      3,
      -3
    );

    scene.add(
      cyanRim
    );


    /*
      Prime gold rim
    */

    const goldRim =
      new THREE.DirectionalLight(
        0xd9a441,
        3
      );

    goldRim.position.set(
      4,
      1.5,
      -2
    );

    scene.add(
      goldRim
    );


    /*
      Soft lower fill
    */

    const lowerFill =
      new THREE.PointLight(
        0x1eaac7,
        14,
        8
      );

    lowerFill.position.set(
      0,
      -1.5,
      2
    );

    scene.add(
      lowerFill
    );


    /* =====================================================
       PRIME MATERIALS
    ===================================================== */


    /*
      Synthetic face / body.

      Still readable as a person,
      but no longer plain white plastic.
    */

    const syntheticSkin =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x8b969d
          ),

        metalness:
          0.42,

        roughness:
          0.34,

        clearcoat:
          0.4,

        clearcoatRoughness:
          0.3

      });


    /*
      Professional graphite uniform
    */

    const uniformMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x0b1116
          ),

        metalness:
          0.78,

        roughness:
          0.24,

        clearcoat:
          0.5,

        clearcoatRoughness:
          0.2

      });


    /*
      Dark metallic hair
    */

    const hairMaterial =
      new THREE.MeshStandardMaterial({

        color:
          new THREE.Color(
            0x10161b
          ),

        metalness:
          0.52,

        roughness:
          0.4

      });


    /*
      Dark eye surrounds / lashes
    */

    const darkDetailMaterial =
      new THREE.MeshStandardMaterial({

        color:
          new THREE.Color(
            0x05080b
          ),

        metalness:
          0.35,

        roughness:
          0.3

      });


    /*
      Cyan AI eyes
    */

    const eyeMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x8cf4ff
          ),

        emissive:
          new THREE.Color(
            0x20cbe8
          ),

        emissiveIntensity:
          1.3,

        metalness:
          0.15,

        roughness:
          0.18,

        clearcoat:
          1.0,

        clearcoatRoughness:
          0.1

      });


    /*
      Teeth
    */

    const teethMaterial =
      new THREE.MeshStandardMaterial({

        color:
          new THREE.Color(
            0xe6ecec
          ),

        roughness:
          0.35,

        metalness:
          0.0

      });


    /*
      Small Prime-gold accent material.
      We can use this more extensively later.
    */

    const goldMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xd4a54c
          ),

        metalness:
          0.9,

        roughness:
          0.2,

        clearcoat:
          0.5

      });


    /* =====================================================
       LOAD CHARACTER
    ===================================================== */

    const loader =
      new GLTFLoader();


    loader.load(

      './PrimeReceptionAI_Test01.glb',


      function (gltf) {

        const model =
          gltf.scene;

        scene.add(
          model
        );


        /* =================================================
           MATERIAL / MESH MAPPING
        ================================================= */


        model.traverse(

          function (object) {

            if (
              !object.isMesh
            ) {
              return;
            }


            const name =
              object.name;


            console.log(
              'MESH:',
              name
            );


            /*
              Hide underwear / censored covering.

              We want the proper clothing meshes
              to define the visible outfit.
            */

            if (
              name.includes(
                'Censored_Torso'
              ) ||
              name.includes(
                'UnderWear'
              )
            ) {

              object.visible =
                false;

              return;
            }


            /*
              Head / face
            */

            if (
              name.includes(
                'Head_52ARKit'
              )
            ) {

              object.material =
                syntheticSkin;

            }


            /*
              Main body / torso
            */

            else if (
              name.includes(
                'Torso'
              )
            ) {

              object.material =
                syntheticSkin;

            }


            /*
              Professional clothing
            */

            else if (
              name.includes(
                'TShirt'
              ) ||
              name.includes(
                'Leggings'
              )
            ) {

              object.visible =
                true;

              object.material =
                uniformMaterial;

            }


            /*
              Hair
            */

            else if (
              name.includes(
                'Hair'
              )
            ) {

              object.material =
                hairMaterial;

            }


            /*
              Actual eyeballs
            */

            else if (
              name.includes(
                'EyeL'
              ) ||
              name.includes(
                'EyeR'
              )
            ) {

              object.material =
                eyeMaterial;

            }


            /*
              Eye shell
            */

            else if (
              name.includes(
                'EyeShell'
              )
            ) {

              object.material =
                eyeMaterial;

            }


            /*
              Eyelashes / eye edges
            */

            else if (
              name.includes(
                'Lashes'
              ) ||
              name.includes(
                'EyeEdge'
              )
            ) {

              object.material =
                darkDetailMaterial;

            }


            /*
              Teeth
            */

            else if (
              name.includes(
                'Teeth'
              )
            ) {

              object.material =
                teethMaterial;

            }


            /*
              Nails — subtle Prime gold
            */

            else if (
              name.includes(
                'Nails'
              )
            ) {

              object.material =
                goldMaterial;

            }

          }

        );


        /* =================================================
           CHARACTER DIMENSIONS
        ================================================= */

        const box =
          new THREE.Box3()
            .setFromObject(
              model
            );


        const size =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        /*
          Center character
        */

        model.position.set(
          -center.x,
          -center.y,
          -center.z
        );


        /* =================================================
           CURRENT CAMERA FRAMING
        ================================================= */

        const verticalFOV =
          THREE.MathUtils.degToRad(
            camera.fov
          );


        const upperBodyHeight =
          size.y * 0.78;


        let distance =
          upperBodyHeight /
          (
            2 *
            Math.tan(
              verticalFOV / 2
            )
          );


        distance *=
          1.05;


        const cameraTargetHeight =
          size.y * 0.17;


        camera.position.set(
          0,
          cameraTargetHeight,
          distance
        );


        camera.lookAt(
          0,
          cameraTargetHeight,
          0
        );


        camera.near =
          Math.max(
            distance / 100,
            0.01
          );


        camera.far =
          distance * 100;


        camera.updateProjectionMatrix();


        /* =================================================
           DEBUG / FUTURE INTERACTION REFERENCES
        ================================================= */


        const importantObjects = {
          head: null,
          eyeL: null,
          eyeR: null,
          neck01: null,
          neck02: null
        };


        model.traverse(

          function (object) {

            const lowerName =
              object.name.toLowerCase();


            if (
              lowerName.includes(
                'head'
              ) &&
              object.isBone
            ) {

              importantObjects.head =
                object;

            }


            if (
              lowerName.includes(
                'neck_01'
              )
            ) {

              importantObjects.neck01 =
                object;

            }


            if (
              lowerName.includes(
                'neck_02'
              )
            ) {

              importantObjects.neck02 =
                object;

            }


            if (
              object.name ===
              'SK_FemBase2_EyeL'
            ) {

              importantObjects.eyeL =
                object;

            }


            if (
              object.name ===
              'SK_FemBase2_EyeR'
            ) {

              importantObjects.eyeR =
                object;

            }

          }

        );


        console.log(
          'PRIME AI REFERENCES:',
          importantObjects
        );


        /*
          Keep available for next stage.
        */

        window.PrimeAI = {

          THREE,

          scene,

          camera,

          renderer,

          model,

          importantObjects

        };


        status.style.display =
          'none';

      },


      /* ===================================================
         LOAD PROGRESS
      =================================================== */

      function (xhr) {

        if (
          xhr.total
        ) {

          const percent =
            Math.round(
              xhr.loaded /
              xhr.total *
              100
            );


          status.textContent =
            'Loading Prime Reception AI… ' +
            percent +
            '%';

        }

        else {

          const mb =
            (
              xhr.loaded /
              1024 /
              1024
            ).toFixed(1);


          status.textContent =
            'Loading Prime Reception AI… ' +
            mb +
            ' MB';

        }

      },


      /* ===================================================
         ERROR
      =================================================== */

      function (error) {

        console.error(
          'GLB ERROR:',
          error
        );


        status.innerHTML =
          'MODEL FAILED TO LOAD<br>' +
          '<small>Check browser console</small>';

      }

    );


    /* =====================================================
       ANIMATION LOOP
    ===================================================== */

    function animate() {

      requestAnimationFrame(
        animate
      );


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }

    );

  </script>

</body>
</html>
