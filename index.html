<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prime Reception AI — Live Hologram</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 38%,
          #0a1b25 0%,
          #041018 30%,
          #01060a 58%,
          #000000 100%
        );
    }

    /*
      Very subtle global scan texture.
    */
    #stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;

      opacity: 0.05;

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 4px,
          rgba(64, 224, 255, 0.17) 5px,
          transparent 6px
        );

      animation:
        globalScan 9s linear infinite;
    }

    @keyframes globalScan {
      from {
        background-position-y: 0px;
      }

      to {
        background-position-y: 180px;
      }
    }

    /*
      Dark cinematic vignette.
    */
    #stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 32%,
          rgba(0, 0, 0, 0.10) 55%,
          rgba(0, 0, 0, 0.72) 100%
        );
    }

    #stage canvas {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      z-index: 20;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      color: #68eaff;

      font-family:
        Arial,
        sans-serif;

      font-size: 14px;
      letter-spacing: 0.11em;

      pointer-events: none;
    }

    /*
      Real Prime Reception AI chest logo.
    */
    #chestLogo {
      position: fixed;
      z-index: 3;

      left: 0;
      top: 0;

      width: 58px;
      height: auto;

      opacity: 0;

      transform:
        translate(-50%, -50%);

      transform-origin:
        center;

      pointer-events: none;

      filter:
        drop-shadow(
          0 0 4px rgba(255, 199, 71, 0.28)
        )
        drop-shadow(
          0 0 7px rgba(57, 224, 255, 0.18)
        );

      transition:
        opacity 0.5s ease;
    }

    @media (max-width: 900px) {
      #chestLogo {
        width: 46px;
      }
    }
  </style>
</head>

<body>

  <div id="stage">

    <div id="status">
      INITIALIZING PRIME RECEPTION AI…
    </div>

    <img
      id="chestLogo"
      src="./prime-reception-logo.png"
      alt=""
    >

  </div>


  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <script type="module">

    import * as THREE from 'three';

    import {
      GLTFLoader
    } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


    /* =====================================================
       DOM
    ===================================================== */

    const stage =
      document.getElementById(
        'stage'
      );

    const status =
      document.getElementById(
        'status'
      );

    const chestLogo =
      document.getElementById(
        'chestLogo'
      );


    /* =====================================================
       SCENE
    ===================================================== */

    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(

        32,

        window.innerWidth /
        window.innerHeight,

        0.01,

        1000

      );


    /* =====================================================
       RENDERER
    ===================================================== */

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true,

        alpha: true

      });


    renderer.setPixelRatio(

      Math.min(
        window.devicePixelRatio || 1,
        2
      )

    );


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      1.08;


    renderer.setClearColor(
      0x000000,
      0
    );


    stage.appendChild(
      renderer.domElement
    );


    /* =====================================================
       LIGHTING
    ===================================================== */

    const ambient =
      new THREE.HemisphereLight(

        0xcff5ff,

        0x010304,

        0.72

      );


    scene.add(
      ambient
    );


    /*
      Face / front illumination.
    */
    const faceLight =
      new THREE.DirectionalLight(

        0xf5fcff,

        2.3

      );


    faceLight.position.set(
      1.5,
      4,
      5.5
    );


    scene.add(
      faceLight
    );


    /*
      Strong left holographic rim.
    */
    const cyanRimLeft =
      new THREE.DirectionalLight(

        0x19ddff,

        5.6

      );


    cyanRimLeft.position.set(
      -4.5,
      3.5,
      -3.5
    );


    scene.add(
      cyanRimLeft
    );


    /*
      Secondary cyan rim.
    */
    const cyanRimRight =
      new THREE.DirectionalLight(

        0x72efff,

        3.1

      );


    cyanRimRight.position.set(
      4,
      3,
      -3
    );


    scene.add(
      cyanRimRight
    );


    /*
      Prime gold accent.
    */
    const goldRim =
      new THREE.DirectionalLight(

        0xd6a643,

        1.25

      );


    goldRim.position.set(
      3.8,
      2.3,
      -2
    );


    scene.add(
      goldRim
    );


    /*
      Strong projection light from below.
    */
    const projectorGlow =
      new THREE.PointLight(

        0x18ddff,

        12,

        9

      );


    projectorGlow.position.set(
      0,
      -1,
      1.4
    );


    scene.add(
      projectorGlow
    );


    const faceGlow =
      new THREE.PointLight(

        0x49e8ff,

        1.3,

        5

      );


    faceGlow.position.set(
      0,
      1.5,
      2.2
    );


    scene.add(
      faceGlow
    );


    /* =====================================================
       HOLOGRAM CHARACTER MATERIALS
    ===================================================== */

    const bodyMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xbcd4da
          ),

        emissive:
          new THREE.Color(
            0x0b6575
          ),

        emissiveIntensity:
          0.28,

        metalness:
          0.16,

        roughness:
          0.34,

        clearcoat:
          0.30,

        clearcoatRoughness:
          0.25,

        sheen:
          0.28,

        sheenColor:
          new THREE.Color(
            0x55e8ff
          ),

        transparent:
          true,

        opacity:
          0.82,

        depthWrite:
          true

      });


    /*
      Face remains the most solid part.
    */
    const faceMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xd8e4e6
          ),

        emissive:
          new THREE.Color(
            0x08424d
          ),

        emissiveIntensity:
          0.15,

        metalness:
          0.05,

        roughness:
          0.40,

        clearcoat:
          0.22,

        clearcoatRoughness:
          0.28,

        transparent:
          true,

        opacity:
          0.94

      });


    /*
      Luminous white/silver upper uniform.
    */
    const shirtMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xd7e5e8
          ),

        emissive:
          new THREE.Color(
            0x087082
          ),

        emissiveIntensity:
          0.27,

        metalness:
          0.20,

        roughness:
          0.29,

        clearcoat:
          0.42,

        clearcoatRoughness:
          0.20,

        sheen:
          0.31,

        sheenColor:
          new THREE.Color(
            0x48e7ff
          ),

        transparent:
          true,

        opacity:
          0.85

      });


    /*
      We will hide the normal leggings completely.
      This material remains only as a fallback.
    */
    const leggingsMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          0xaed7df,

        transparent:
          true,

        opacity:
          0.05

      });


    const hairMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x03070a
          ),

        emissive:
          new THREE.Color(
            0x003542
          ),

        emissiveIntensity:
          0.22,

        metalness:
          0.16,

        roughness:
          0.35,

        clearcoat:
          0.25,

        clearcoatRoughness:
          0.25

      });


    const eyeMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xeaffff
          ),

        emissive:
          new THREE.Color(
            0x21e4ff
          ),

        emissiveIntensity:
          1.25,

        metalness:
          0,

        roughness:
          0.10,

        clearcoat:
          1,

        clearcoatRoughness:
          0.04

      });


    const eyeShellMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          0xcaf9ff,

        emissive:
          0x08768a,

        emissiveIntensity:
          0.45,

        transparent:
          true,

        opacity:
          0.28,

        roughness:
          0.06,

        clearcoat:
          1

      });


    const darkDetailMaterial =
      new THREE.MeshStandardMaterial({

        color:
          0x010203,

        roughness:
          0.46

      });


    const teethMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          0xf4f7f7,

        roughness:
          0.28

      });


    const goldMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          0xd3a649,

        emissive:
          0x2c1b02,

        emissiveIntensity:
          0.14,

        metalness:
          0.75,

        roughness:
          0.25

      });


    function forceCleanMaterial(
      object,
      material
    ) {

      object.material =
        material;

      material.map = null;

      material.normalMap = null;

      material.roughnessMap = null;

      material.metalnessMap = null;

      material.aoMap = null;

      material.emissiveMap = null;

      material.alphaMap = null;

      material.lightMap = null;

      material.displacementMap = null;

      material.vertexColors = false;

      material.needsUpdate = true;

    }


    /* =====================================================
       MODEL REFERENCES
    ===================================================== */

    let model = null;

    let modelSize = null;

    let headBone = null;

    let neck01 = null;

    let neck02 = null;

    let chestBone = null;

    let eyeLObject = null;

    let eyeRObject = null;


    let baseHeadRotation = null;

    let baseNeck01Rotation = null;

    let baseNeck02Rotation = null;

    let baseEyeLRotation = null;

    let baseEyeRRotation = null;


    const blinkMeshes = [];


    /* =====================================================
       POINTER INPUT
    ===================================================== */

    const pointer =
      new THREE.Vector2(
        0,
        0
      );


    const targetPointer =
      new THREE.Vector2(
        0,
        0
      );


    window.addEventListener(

      'pointermove',

      function (
        event
      ) {

        let x =
          (
            event.clientX /
            window.innerWidth
          ) * 2 - 1;


        let y =
          -(
            (
              event.clientY /
              window.innerHeight
            ) * 2 - 1
          );


        const deadZone =
          0.055;


        if (
          Math.abs(x) <
          deadZone
        ) {

          x = 0;

        }


        if (
          Math.abs(y) <
          deadZone
        ) {

          y = 0;

        }


        x =
          Math.sign(x) *
          Math.pow(
            Math.abs(x),
            1.15
          );


        y =
          Math.sign(y) *
          Math.pow(
            Math.abs(y),
            1.15
          );


        targetPointer.set(

          THREE.MathUtils.clamp(
            x,
            -1,
            1
          ),

          THREE.MathUtils.clamp(
            y,
            -1,
            1
          )

        );

      }

    );


    document.documentElement.addEventListener(

      'mouseleave',

      function () {

        targetPointer.set(
          0,
          0
        );

      }

    );


    /* =====================================================
       BACKGROUND PARTICLES
    ===================================================== */

    let particleSystem = null;

    let particlePositions = null;

    const particleSpeeds = [];


    function createParticles(
      size
    ) {

      const count =
        420;


      const geometry =
        new THREE.BufferGeometry();


      particlePositions =
        new Float32Array(
          count * 3
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const i3 =
          i * 3;


        particlePositions[i3] =
          (
            Math.random() -
            0.5
          ) *
          size.x *
          2.5;


        particlePositions[i3 + 1] =
          (
            Math.random() -
            0.42
          ) *
          size.y *
          1.2;


        particlePositions[i3 + 2] =
          (
            Math.random() -
            0.5
          ) *
          Math.max(
            size.z * 5,
            size.x
          );


        particleSpeeds.push(

          0.001 +
          Math.random() *
          0.004

        );

      }


      geometry.setAttribute(

        'position',

        new THREE.BufferAttribute(
          particlePositions,
          3
        )

      );


      const material =
        new THREE.PointsMaterial({

          color:
            0x38dcff,

          size:
            Math.max(
              size.y * 0.0028,
              0.002
            ),

          transparent:
            true,

          opacity:
            0.36,

          depthWrite:
            false,

          blending:
            THREE.AdditiveBlending

        });


      particleSystem =
        new THREE.Points(
          geometry,
          material
        );


      scene.add(
        particleSystem
      );

    }


    function updateParticles(
      size
    ) {

      if (
        !particleSystem ||
        !particlePositions
      ) {

        return;

      }


      for (
        let i = 0;
        i < particleSpeeds.length;
        i++
      ) {

        const yIndex =
          i * 3 + 1;


        particlePositions[yIndex] +=
          particleSpeeds[i];


        if (
          particlePositions[yIndex] >
          size.y * 0.62
        ) {

          particlePositions[yIndex] =
            -size.y * 0.58;

        }

      }


      particleSystem
        .geometry
        .attributes
        .position
        .needsUpdate =
          true;

    }


    /* =====================================================
       HOLOGRAM PROJECTOR SYSTEM
    ===================================================== */

    const holoGroup =
      new THREE.Group();


    scene.add(
      holoGroup
    );


    let waterMaterial = null;

    let energyCurtainMaterial = null;

    let dissolveParticles = null;

    let dissolvePositions = null;

    const dissolveSpeeds = [];


    /*
      Animated water / liquid projection surface.
    */
    function createWaterSurface(
      size,
      ringY
    ) {

      const radius =
        size.x * 0.57;


      const geometry =
        new THREE.CircleGeometry(
          radius,
          128
        );


      waterMaterial =
        new THREE.ShaderMaterial({

          transparent:
            true,

          depthWrite:
            false,

          side:
            THREE.DoubleSide,

          blending:
            THREE.AdditiveBlending,

          uniforms: {

            uTime: {
              value: 0
            }

          },

          vertexShader: `
            varying vec2 vUv;

            void main() {

              vUv = uv;

              gl_Position =
                projectionMatrix *
                modelViewMatrix *
                vec4(position, 1.0);

            }
          `,

          fragmentShader: `
            uniform float uTime;

            varying vec2 vUv;

            void main() {

              vec2 p =
                vUv -
                vec2(0.5);

              float d =
                length(p) *
                2.0;

              float outerMask =
                1.0 -
                smoothstep(
                  0.72,
                  1.0,
                  d
                );

              float ring1 =
                sin(
                  d * 72.0 -
                  uTime * 5.0
                );

              float ring2 =
                sin(
                  d * 116.0 -
                  uTime * 7.5
                );

              float waves =
                max(
                  ring1,
                  ring2 * 0.55
                );

              waves =
                smoothstep(
                  0.55,
                  1.0,
                  waves
                );

              float centerGlow =
                1.0 -
                smoothstep(
                  0.0,
                  0.65,
                  d
                );

              float alpha =
                (
                  waves * 0.48 +
                  centerGlow * 0.22
                ) *
                outerMask;

              vec3 cyan =
                vec3(
                  0.08,
                  0.80,
                  1.0
                );

              gl_FragColor =
                vec4(
                  cyan,
                  alpha
                );

            }
          `

        });


      const water =
        new THREE.Mesh(
          geometry,
          waterMaterial
        );


      water.rotation.x =
        -Math.PI / 2;


      water.position.y =
        ringY;


      holoGroup.add(
        water
      );

    }


    /*
      Bright concentric projector rings.
    */
    function createProjectorRings(
      size,
      ringY
    ) {

      const baseRadius =
        size.x * 0.50;


      const configs = [

        {
          radius: 0.78,
          thickness: 0.010,
          opacity: 0.80
        },

        {
          radius: 0.94,
          thickness: 0.006,
          opacity: 0.48
        },

        {
          radius: 1.10,
          thickness: 0.004,
          opacity: 0.31
        },

        {
          radius: 1.30,
          thickness: 0.003,
          opacity: 0.20
        }

      ];


      for (
        const config
        of configs
      ) {

        const material =
          new THREE.MeshBasicMaterial({

            color:
              0x38e4ff,

            transparent:
              true,

            opacity:
              config.opacity,

            depthWrite:
              false,

            blending:
              THREE.AdditiveBlending

          });


        const ring =
          new THREE.Mesh(

            new THREE.TorusGeometry(

              baseRadius *
              config.radius,

              baseRadius *
              config.thickness,

              12,

              128

            ),

            material

          );


        ring.rotation.x =
          Math.PI / 2;


        ring.position.y =
          ringY;


        ring.userData.baseScale =
          config.radius;


        holoGroup.add(
          ring
        );

      }

    }


    /*
      Semi-transparent energy curtain between
      the waist and water surface.

      This replaces the normal visible legs.
    */
    function createEnergyCurtain(
      size,
      ringY
    ) {

      const height =
        size.y * 0.23;


      const radiusTop =
        size.x * 0.28;


      const radiusBottom =
        size.x * 0.47;


      const geometry =
        new THREE.CylinderGeometry(

          radiusTop,

          radiusBottom,

          height,

          96,

          20,

          true

        );


      energyCurtainMaterial =
        new THREE.ShaderMaterial({

          transparent:
            true,

          depthWrite:
            false,

          side:
            THREE.DoubleSide,

          blending:
            THREE.AdditiveBlending,

          uniforms: {

            uTime: {
              value: 0
            }

          },

          vertexShader: `
            varying vec2 vUv;

            void main() {

              vUv = uv;

              gl_Position =
                projectionMatrix *
                modelViewMatrix *
                vec4(position, 1.0);

            }
          `,

          fragmentShader: `
            uniform float uTime;

            varying vec2 vUv;

            void main() {

              /*
                Stronger near top,
                dissolving toward bottom.
              */
              float verticalFade =
                smoothstep(
                  0.0,
                  0.82,
                  vUv.y
                );

              float digitalBands =
                sin(
                  vUv.y * 145.0 -
                  uTime * 8.0 +
                  sin(vUv.x * 34.0) * 2.0
                );

              digitalBands =
                smoothstep(
                  0.52,
                  1.0,
                  digitalBands
                );

              float columns =
                sin(
                  vUv.x * 95.0 +
                  uTime * 1.6
                );

              columns =
                smoothstep(
                  0.70,
                  1.0,
                  columns
                );

              float alpha =
                verticalFade *
                (
                  0.06 +
                  digitalBands * 0.12 +
                  columns * 0.10
                );

              vec3 cyan =
                vec3(
                  0.08,
                  0.82,
                  1.0
                );

              gl_FragColor =
                vec4(
                  cyan,
                  alpha
                );

            }
          `

        });


      const curtain =
        new THREE.Mesh(
          geometry,
          energyCurtainMaterial
        );


      curtain.position.y =
        ringY +
        height * 0.50;


      holoGroup.add(
        curtain
      );

    }


    /*
      Digital fragments rising from the water
      toward the lower torso.
    */
    function createDissolveParticles(
      size,
      ringY
    ) {

      const count =
        650;


      dissolvePositions =
        new Float32Array(
          count * 3
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const i3 =
          i * 3;


        const angle =
          Math.random() *
          Math.PI *
          2;


        const radius =
          Math.sqrt(
            Math.random()
          ) *
          size.x *
          0.37;


        dissolvePositions[i3] =
          Math.cos(angle) *
          radius;


        dissolvePositions[i3 + 1] =
          ringY +
          Math.random() *
          size.y *
          0.25;


        dissolvePositions[i3 + 2] =
          Math.sin(angle) *
          radius *
          0.48;


        dissolveSpeeds.push(

          0.0015 +
          Math.random() *
          0.006

        );

      }


      const geometry =
        new THREE.BufferGeometry();


      geometry.setAttribute(

        'position',

        new THREE.BufferAttribute(
          dissolvePositions,
          3
        )

      );


      const material =
        new THREE.PointsMaterial({

          color:
            0x4cecff,

          size:
            Math.max(
              size.y * 0.004,
              0.003
            ),

          transparent:
            true,

          opacity:
            0.74,

          depthWrite:
            false,

          blending:
            THREE.AdditiveBlending

        });


      dissolveParticles =
        new THREE.Points(
          geometry,
          material
        );


      holoGroup.add(
        dissolveParticles
      );

    }


    function updateDissolveParticles(
      size,
      ringY
    ) {

      if (
        !dissolveParticles ||
        !dissolvePositions
      ) {

        return;

      }


      const maxY =
        ringY +
        size.y *
        0.25;


      for (
        let i = 0;
        i < dissolveSpeeds.length;
        i++
      ) {

        const i3 =
          i * 3;


        dissolvePositions[
          i3 + 1
        ] +=
          dissolveSpeeds[i];


        /*
          Slight electronic drift.
        */
        dissolvePositions[i3] +=
          Math.sin(
            performance.now() *
            0.001 +
            i
          ) *
          0.00003;


        if (
          dissolvePositions[
            i3 + 1
          ] >
          maxY
        ) {

          dissolvePositions[
            i3 + 1
          ] =
            ringY;

        }

      }


      dissolveParticles
        .geometry
        .attributes
        .position
        .needsUpdate =
          true;

    }


    /* =====================================================
       LOAD GLB
    ===================================================== */

    const loader =
      new GLTFLoader();


    let hologramRingY =
      0;


    loader.load(

      './PrimeReceptionAI_Test01.glb',


      function (
        gltf
      ) {

        model =
          gltf.scene;


        scene.add(
          model
        );


        model.traverse(

          function (
            object
          ) {

            /* =============================================
               MESHES
            ============================================= */

            if (
              object.isMesh
            ) {

              const name =
                object.name;


              /*
                Discover ARKit blink targets.
              */
              if (
                object.morphTargetDictionary &&
                object.morphTargetInfluences
              ) {

                const dictionary =
                  object
                    .morphTargetDictionary;


                if (
                  dictionary.eyeBlinkLeft !==
                    undefined
                  ||
                  dictionary.eyeBlinkRight !==
                    undefined
                ) {

                  blinkMeshes.push(
                    object
                  );

                }

              }


              /*
                Hide purchased censor / underwear layer.
              */
              if (
                name ===
                  'SK_FemBase2_Censored_Torso'
                ||
                name ===
                  'SK_FemBase2_UnderWear'
              ) {

                object.visible =
                  false;

                return;

              }


              /*
                Exposed synthetic body.
              */
              if (
                name ===
                  'Mesh010'
                ||
                name ===
                  'SK_FemBase2_Torso'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  bodyMaterial
                );


                return;

              }


              /*
                Face.
              */
              if (
                name ===
                  'Mesh010_1'
                ||
                name ===
                  'SK_FemBase2_Head_52ArKit'
                ||
                name ===
                  'SK_FemBase2_Head_52ARKit'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  faceMaterial
                );


                return;

              }


              /*
                Upper futuristic garment.
              */
              if (
                name ===
                  'SK_FemBase2_TShirt'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  shirtMaterial
                );


                return;

              }


              /*
                IMPORTANT:

                Hide the normal legs entirely.
                They are replaced by the hologram
                water + dissolve system.
              */
              if (
                name ===
                  'SK_FemBase2_Leggings'
              ) {

                object.visible =
                  false;


                return;

              }


              /*
                Hair.
              */
              if (
                name ===
                  'SK_FemBase2_Hair'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  hairMaterial
                );


                return;

              }


              /*
                Eyes.
              */
              if (
                name ===
                  'SK_FemBase2_EyeL'
              ) {

                eyeLObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_EyeR'
              ) {

                eyeRObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_EyeShell'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeShellMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Lashes'
                ||
                name ===
                  'SK_FemBase2_EyeEdge'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  darkDetailMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Teeth'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  teethMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Nails'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  goldMaterial
                );


                return;

              }

            }


            /* =============================================
               BONES
            ============================================= */

            if (
              object.isBone
            ) {

              const lowerName =
                object
                  .name
                  .toLowerCase();


              if (
                lowerName === 'head'
                ||
                lowerName.endsWith(
                  '_head'
                )
              ) {

                headBone =
                  object;

              }


              if (
                lowerName.includes(
                  'neck_01'
                )
              ) {

                neck01 =
                  object;

              }


              if (
                lowerName.includes(
                  'neck_02'
                )
              ) {

                neck02 =
                  object;

              }


              if (
                !chestBone &&
                (
                  lowerName.includes(
                    'upperchest'
                  )
                  ||
                  lowerName.includes(
                    'upper_chest'
                  )
                  ||
                  lowerName.includes(
                    'chest'
                  )
                  ||
                  lowerName.includes(
                    'spine_03'
                  )
                  ||
                  lowerName.includes(
                    'spine03'
                  )
                  ||
                  lowerName.includes(
                    'spine_3'
                  )
                )
              ) {

                chestBone =
                  object;

              }

            }

          }

        );


        /* =================================================
           SAVE BASE ROTATIONS
        ================================================= */

        if (
          headBone
        ) {

          baseHeadRotation =
            headBone
              .rotation
              .clone();

        }


        if (
          neck01
        ) {

          baseNeck01Rotation =
            neck01
              .rotation
              .clone();

        }


        if (
          neck02
        ) {

          baseNeck02Rotation =
            neck02
              .rotation
              .clone();

        }


        if (
          eyeLObject
        ) {

          baseEyeLRotation =
            eyeLObject
              .rotation
              .clone();

        }


        if (
          eyeRObject
        ) {

          baseEyeRRotation =
            eyeRObject
              .rotation
              .clone();

        }


        /* =================================================
           MODEL SIZE / CENTER
        ================================================= */

        const box =
          new THREE.Box3()
            .setFromObject(
              model
            );


        modelSize =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        model.position.set(

          -center.x,

          -center.y,

          -center.z

        );


        /*
          Projection surface position.

          Around lower torso / upper hip region.
        */
        hologramRingY =
          -modelSize.y *
          0.29;


        /* =================================================
           CAMERA
        ================================================= */

        const verticalFOV =
          THREE.MathUtils.degToRad(
            camera.fov
          );


        /*
          We no longer need to frame the legs,
          so move closer to the upper body.
        */
        const visibleHeight =
          modelSize.y *
          0.62;


        let distance =
          visibleHeight /
          (
            2 *
            Math.tan(
              verticalFOV /
              2
            )
          );


        distance *=
          1.12;


        const targetHeight =
          modelSize.y *
          0.14;


        camera.position.set(

          0,

          targetHeight,

          distance

        );


        camera.lookAt(

          0,

          targetHeight,

          0

        );


        camera.near =
          Math.max(
            distance / 100,
            0.01
          );


        camera.far =
          distance * 100;


        camera.updateProjectionMatrix();


        /* =================================================
           HOLOGRAPHIC EFFECTS
        ================================================= */

        createParticles(
          modelSize
        );


        createWaterSurface(
          modelSize,
          hologramRingY
        );


        createProjectorRings(
          modelSize,
          hologramRingY
        );


        createEnergyCurtain(
          modelSize,
          hologramRingY
        );


        createDissolveParticles(
          modelSize,
          hologramRingY
        );


        status.style.display =
          'none';


        chestLogo.style.opacity =
          '1';


        scheduleNextBlink();

      },


      function (
        xhr
      ) {

        if (
          xhr.total
        ) {

          const percentage =
            Math.round(

              xhr.loaded /
              xhr.total *
              100

            );


          status.textContent =
            'INITIALIZING PRIME RECEPTION AI… ' +
            percentage +
            '%';

        }

      },


      function (
        error
      ) {

        console.error(
          error
        );


        status.textContent =
          'MODEL FAILED TO LOAD';

      }

    );


    /* =====================================================
       BLINK SYSTEM
    ===================================================== */

    function setBlinkAmount(
      amount
    ) {

      const value =
        THREE.MathUtils.clamp(
          amount,
          0,
          1
        );


      for (
        const mesh
        of blinkMeshes
      ) {

        const dictionary =
          mesh
            .morphTargetDictionary;


        const influences =
          mesh
            .morphTargetInfluences;


        if (
          dictionary.eyeBlinkLeft !==
          undefined
        ) {

          influences[
            dictionary.eyeBlinkLeft
          ] =
            value;

        }


        if (
          dictionary.eyeBlinkRight !==
          undefined
        ) {

          influences[
            dictionary.eyeBlinkRight
          ] =
            value;

        }

      }

    }


    let blinkActive =
      false;


    let blinkStart =
      0;


    let blinkDuration =
      0.15;


    let nextBlink =
      Infinity;


    let doubleBlink =
      false;


    let secondBlinkAt =
      Infinity;


    function scheduleNextBlink() {

      nextBlink =
        performance.now() /
        1000 +
        2.3 +
        Math.random() *
        3.7;

    }


    function beginBlink() {

      blinkActive =
        true;


      blinkStart =
        performance.now() /
        1000;


      blinkDuration =
        0.12 +
        Math.random() *
        0.055;


      doubleBlink =
        Math.random() <
        0.12;

    }


    function updateBlink(
      now
    ) {

      if (
        !blinkActive &&
        now >= nextBlink
      ) {

        beginBlink();

      }


      if (
        !blinkActive &&
        doubleBlink &&
        now >= secondBlinkAt
      ) {

        doubleBlink =
          false;


        beginBlink();


        return;

      }


      if (
        !blinkActive
      ) {

        setBlinkAmount(
          0
        );


        return;

      }


      const progress =
        (
          now -
          blinkStart
        ) /
        blinkDuration;


      if (
        progress <= 1
      ) {

        setBlinkAmount(

          Math.sin(
            progress *
            Math.PI
          )

        );

      }

      else {

        setBlinkAmount(
          0
        );


        blinkActive =
          false;


        if (
          doubleBlink
        ) {

          secondBlinkAt =
            now +
            0.15 +
            Math.random() *
            0.08;

        }

        else {

          scheduleNextBlink();

        }

      }

    }


    /* =====================================================
       TRACKING
    ===================================================== */

    const eyeHorizontalMax =
      THREE.MathUtils.degToRad(
        10
      );


    const eyeVerticalMax =
      THREE.MathUtils.degToRad(
        6
      );


    const headHorizontalMax =
      THREE.MathUtils.degToRad(
        4.2
      );


    const headVerticalMax =
      THREE.MathUtils.degToRad(
        2.2
      );


    const neckHorizontalMax =
      THREE.MathUtils.degToRad(
        1.25
      );


    const neckVerticalMax =
      THREE.MathUtils.degToRad(
        0.7
      );


    let eyeHorizontal = 0;

    let eyeVertical = 0;

    let headHorizontal = 0;

    let headVertical = 0;

    let neckHorizontal = 0;

    let neckVertical = 0;


    function damp(
      current,
      target,
      speed,
      delta
    ) {

      return THREE.MathUtils.lerp(

        current,

        target,

        1 -
        Math.exp(
          -speed *
          delta
        )

      );

    }


    /* =====================================================
       CHEST LOGO
    ===================================================== */

    const chestWorldPosition =
      new THREE.Vector3();


    const projectedChest =
      new THREE.Vector3();


    function updateChestLogo() {

      if (
        !model ||
        !modelSize
      ) {

        return;

      }


      if (
        chestBone
      ) {

        chestBone.getWorldPosition(
          chestWorldPosition
        );


        /*
          Move to upper-right chest.

          This is intentionally much higher
          than the previous version.
        */
        chestWorldPosition.x +=
          modelSize.x *
          0.10;


        chestWorldPosition.y +=
          modelSize.y *
          0.115;

      }

      else {

        chestWorldPosition.set(

          modelSize.x *
          0.10,

          modelSize.y *
          0.27,

          0

        );

      }


      projectedChest.copy(
        chestWorldPosition
      );


      projectedChest.project(
        camera
      );


      const screenX =
        (
          projectedChest.x *
          0.5 +
          0.5
        ) *
        window.innerWidth;


      const screenY =
        (
          -projectedChest.y *
          0.5 +
          0.5
        ) *
        window.innerHeight;


      chestLogo.style.left =
        screenX +
        'px';


      chestLogo.style.top =
        screenY +
        'px';


      const width =
        THREE.MathUtils.clamp(

          window.innerHeight *
          0.058,

          42,

          66

        );


      chestLogo.style.width =
        width +
        'px';

    }


    /* =====================================================
       ANIMATION
    ===================================================== */

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(
          clock.getDelta(),
          0.05
        );


      const now =
        performance.now() /
        1000;


      /* =========================================
         POINTER DAMPING
      ========================================= */

      pointer.x =
        damp(

          pointer.x,

          targetPointer.x,

          7,

          delta

        );


      pointer.y =
        damp(

          pointer.y,

          targetPointer.y,

          7,

          delta

        );


      /* =========================================
         EYES
      ========================================= */

      eyeHorizontal =
        damp(

          eyeHorizontal,

          pointer.x *
          eyeHorizontalMax,

          14,

          delta

        );


      eyeVertical =
        damp(

          eyeVertical,

          pointer.y *
          eyeVerticalMax,

          14,

          delta

        );


      /* =========================================
         HEAD
      ========================================= */

      headHorizontal =
        damp(

          headHorizontal,

          pointer.x *
          headHorizontalMax,

          2.7,

          delta

        );


      headVertical =
        damp(

          headVertical,

          pointer.y *
          headVerticalMax,

          2.5,

          delta

        );


      /* =========================================
         NECK
      ========================================= */

      neckHorizontal =
        damp(

          neckHorizontal,

          pointer.x *
          neckHorizontalMax,

          1.65,

          delta

        );


      neckVertical =
        damp(

          neckVertical,

          pointer.y *
          neckVerticalMax,

          1.5,

          delta

        );


      /* =========================================
         APPLY EYES
      ========================================= */

      if (
        eyeLObject &&
        baseEyeLRotation
      ) {

        eyeLObject.rotation.copy(
          baseEyeLRotation
        );


        eyeLObject.rotation.y +=
          eyeHorizontal;


        eyeLObject.rotation.x -=
          eyeVertical;

      }


      if (
        eyeRObject &&
        baseEyeRRotation
      ) {

        eyeRObject.rotation.copy(
          baseEyeRRotation
        );


        eyeRObject.rotation.y +=
          eyeHorizontal;


        eyeRObject.rotation.x -=
          eyeVertical;

      }


      /* =========================================
         APPLY HEAD

         Correct rig axes remain preserved:

         X = left/right
         Z = up/down
      ========================================= */

      if (
        headBone &&
        baseHeadRotation
      ) {

        headBone.rotation.copy(
          baseHeadRotation
        );


        headBone.rotation.x +=
          headHorizontal;


        headBone.rotation.z +=
          headVertical;


        headBone.rotation.y =
          baseHeadRotation.y;

      }


      /* =========================================
         NECK 02
      ========================================= */

      if (
        neck02 &&
        baseNeck02Rotation
      ) {

        neck02.rotation.copy(
          baseNeck02Rotation
        );


        neck02.rotation.x +=
          neckHorizontal;


        neck02.rotation.z +=
          neckVertical;


        neck02.rotation.y =
          baseNeck02Rotation.y;

      }


      /* =========================================
         NECK 01
      ========================================= */

      if (
        neck01 &&
        baseNeck01Rotation
      ) {

        neck01.rotation.copy(
          baseNeck01Rotation
        );


        neck01.rotation.x +=
          neckHorizontal *
          0.30;


        neck01.rotation.z +=
          neckVertical *
          0.22;


        neck01.rotation.y =
          baseNeck01Rotation.y;

      }


      /* =========================================
         BLINK
      ========================================= */

      updateBlink(
        now
      );


      /* =========================================
         HOLOGRAM MATERIAL PULSE
      ========================================= */

      const pulse =
        0.5 +
        Math.sin(
          now *
          1.4
        ) *
        0.5;


      bodyMaterial.emissiveIntensity =
        0.23 +
        pulse *
        0.10;


      shirtMaterial.emissiveIntensity =
        0.22 +
        pulse *
        0.11;


      faceMaterial.emissiveIntensity =
        0.12 +
        pulse *
        0.055;


      eyeMaterial.emissiveIntensity =
        1.10 +
        pulse *
        0.32;


      projectorGlow.intensity =
        10 +
        pulse *
        4;


      faceGlow.intensity =
        1.10 +
        pulse *
        0.35;


      /* =========================================
         WATER
      ========================================= */

      if (
        waterMaterial
      ) {

        waterMaterial
          .uniforms
          .uTime
          .value =
            now;

      }


      /* =========================================
         ENERGY CURTAIN
      ========================================= */

      if (
        energyCurtainMaterial
      ) {

        energyCurtainMaterial
          .uniforms
          .uTime
          .value =
            now;

      }


      /* =========================================
         HOLOGRAM RING PULSE
      ========================================= */

      if (
        holoGroup
      ) {

        const scale =
          1 +
          Math.sin(
            now *
            1.5
          ) *
          0.025;


        holoGroup.scale.x =
          scale;


        holoGroup.scale.z =
          scale;

      }


      /* =========================================
         DISSOLVE
      ========================================= */

      if (
        modelSize
      ) {

        updateDissolveParticles(

          modelSize,

          hologramRingY

        );


        updateParticles(
          modelSize
        );

      }


      if (
        particleSystem
      ) {

        particleSystem.rotation.y +=
          0.00020;

      }


      /* =========================================
         LOGO
      ========================================= */

      updateChestLogo();


      /* =========================================
         RENDER
      ========================================= */

      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );

      }

    );

  </script>

</body>
</html>
