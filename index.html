<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prime Reception AI — 3D Receptionist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background:
        #010305;
    }

    #stage {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 35%,
          #0b2130 0%,
          #06131c 27%,
          #02080d 55%,
          #000000 100%
        );
    }

    /*
      Fine screen atmosphere.
      Much softer than the previous full-screen scan effect.
    */
    #stage::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 4;

      pointer-events: none;

      opacity: 0.045;

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 4px,
          rgba(65, 225, 255, 0.16) 5px,
          transparent 6px
        );

      animation:
        scanMove 10s linear infinite;
    }

    @keyframes scanMove {
      from {
        background-position-y: 0;
      }

      to {
        background-position-y: 180px;
      }
    }

    /*
      Controlled vignette.
    */
    #stage::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 5;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 35%,
          rgba(0, 0, 0, 0.12) 58%,
          rgba(0, 0, 0, 0.72) 100%
        );
    }

    #stage canvas {
      position: relative;

      z-index: 1;

      display: block;

      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;

      z-index: 20;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      color:
        #6eeaff;

      font-family:
        Arial,
        sans-serif;

      font-size:
        14px;

      letter-spacing:
        0.11em;

      text-align:
        center;

      pointer-events:
        none;
    }

    /*
      REAL PRIME RECEPTION AI LOGO

      We project a real 3D chest anchor to screen space.
      This means we do not need to rebuild or re-export
      the GLB just to add branding.
    */
    #chestLogo {
      position: fixed;

      z-index: 3;

      left: 0;
      top: 0;

      width: 76px;
      height: auto;

      opacity: 0;

      pointer-events: none;

      transform:
        translate(-50%, -50%);

      transform-origin:
        center;

      filter:
        drop-shadow(
          0 0 4px rgba(255, 203, 91, 0.20)
        )
        drop-shadow(
          0 0 8px rgba(63, 222, 255, 0.14)
        );

      transition:
        opacity 0.5s ease;
    }

    @media (max-width: 900px) {
      #chestLogo {
        width: 58px;
      }
    }
  </style>
</head>

<body>

  <div id="stage">

    <div id="status">
      INITIALIZING PRIME RECEPTION AI…
    </div>

    <img
      id="chestLogo"
      src="./prime-reception-logo.png"
      alt=""
    >

  </div>


  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <script type="module">

    import * as THREE from 'three';

    import {
      GLTFLoader
    } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


    const stage =
      document.getElementById(
        'stage'
      );


    const status =
      document.getElementById(
        'status'
      );


    const chestLogo =
      document.getElementById(
        'chestLogo'
      );


    /* =====================================================
       SCENE
    ===================================================== */

    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(

        32,

        window.innerWidth /
        window.innerHeight,

        0.01,

        1000

      );


    /* =====================================================
       RENDERER
    ===================================================== */

    const renderer =
      new THREE.WebGLRenderer({

        antialias:
          true,

        alpha:
          true

      });


    renderer.setPixelRatio(

      Math.min(

        window.devicePixelRatio ||
        1,

        2

      )

    );


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      1.08;


    renderer.setClearColor(

      0x000000,

      0

    );


    stage.appendChild(
      renderer.domElement
    );


    /* =====================================================
       LIGHTING
    ===================================================== */


    /*
      Soft overall illumination.
    */

    const ambient =
      new THREE.HemisphereLight(

        0xe6f8ff,

        0x030506,

        0.88

      );


    scene.add(
      ambient
    );


    /*
      Soft frontal key light.

      Slightly warm so the face does not look
      completely blue/gray.
    */

    const faceLight =
      new THREE.DirectionalLight(

        0xfff9f1,

        2.9

      );


    faceLight.position.set(

      1.5,

      4.0,

      5.8

    );


    scene.add(
      faceLight
    );


    /*
      Left cyan edge.
    */

    const cyanRimLeft =
      new THREE.DirectionalLight(

        0x24dfff,

        5.0

      );


    cyanRimLeft.position.set(

      -4.5,

      3.4,

      -3.8

    );


    scene.add(
      cyanRimLeft
    );


    /*
      Right cyan edge.
    */

    const cyanRimRight =
      new THREE.DirectionalLight(

        0x62ecff,

        2.8

      );


    cyanRimRight.position.set(

      4.0,

      3.0,

      -3.2

    );


    scene.add(
      cyanRimRight
    );


    /*
      Prime gold accent.

      Kept subtle so cyan remains dominant.
    */

    const goldRim =
      new THREE.DirectionalLight(

        0xe0b451,

        1.75

      );


    goldRim.position.set(

      4.1,

      2.7,

      -1.8

    );


    scene.add(
      goldRim
    );


    /*
      Lower holographic illumination.
    */

    const lowerGlow =
      new THREE.PointLight(

        0x19d8ff,

        9,

        9

      );


    lowerGlow.position.set(

      0,

      -1.5,

      1.7

    );


    scene.add(
      lowerGlow
    );


    /*
      Soft face-area cyan glow.
    */

    const faceGlow =
      new THREE.PointLight(

        0x4beaff,

        1.3,

        5

      );


    faceGlow.position.set(

      0,

      1.3,

      2.4

    );


    scene.add(
      faceGlow
    );


    /* =====================================================
       PREMIUM SYNTHETIC MATERIALS
    ===================================================== */


    /*
      Synthetic exposed body.

      Silver pearl rather than chrome.
    */

    const bodyMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xc6d3d7
          ),

        emissive:
          new THREE.Color(
            0x062a31
          ),

        emissiveIntensity:
          0.11,

        metalness:
          0.24,

        roughness:
          0.39,

        clearcoat:
          0.34,

        clearcoatRoughness:
          0.27,

        sheen:
          0.17,

        sheenColor:
          new THREE.Color(
            0x67dff0
          )

      });


    /*
      Face is softer and slightly warmer.
    */

    const faceMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xe1e4e1
          ),

        emissive:
          new THREE.Color(
            0x03171b
          ),

        emissiveIntensity:
          0.055,

        metalness:
          0.08,

        roughness:
          0.44,

        clearcoat:
          0.23,

        clearcoatRoughness:
          0.30,

        sheen:
          0.10,

        sheenColor:
          new THREE.Color(
            0x90e4ee
          )

      });


    /*
      FUTURISTIC PEARL-WHITE TOP

      Geometry remains the purchased shirt,
      but the visual treatment now moves toward
      the concept image.
    */

    const shirtMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xdce5e7
          ),

        emissive:
          new THREE.Color(
            0x07333c
          ),

        emissiveIntensity:
          0.16,

        metalness:
          0.29,

        roughness:
          0.31,

        clearcoat:
          0.42,

        clearcoatRoughness:
          0.23,

        sheen:
          0.25,

        sheenColor:
          new THREE.Color(
            0x51e1f5
          )

      });


    /*
      Matching lower suit.
    */

    const leggingsMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xcdd9dc
          ),

        emissive:
          new THREE.Color(
            0x062b33
          ),

        emissiveIntensity:
          0.14,

        metalness:
          0.32,

        roughness:
          0.32,

        clearcoat:
          0.40,

        clearcoatRoughness:
          0.24,

        sheen:
          0.21,

        sheenColor:
          new THREE.Color(
            0x45d9ee
          )

      });


    /*
      Dark premium hair.
    */

    const hairMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x05080b
          ),

        emissive:
          new THREE.Color(
            0x00151c
          ),

        emissiveIntensity:
          0.14,

        metalness:
          0.19,

        roughness:
          0.39,

        clearcoat:
          0.30,

        clearcoatRoughness:
          0.26

      });


    /*
      Cyan AI eyes.
    */

    const eyeMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xe8fdff
          ),

        emissive:
          new THREE.Color(
            0x22dcfa
          ),

        emissiveIntensity:
          0.90,

        metalness:
          0.01,

        roughness:
          0.13,

        clearcoat:
          1,

        clearcoatRoughness:
          0.05

      });


    const eyeShellMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xd5faff
          ),

        emissive:
          new THREE.Color(
            0x075765
          ),

        emissiveIntensity:
          0.24,

        transparent:
          true,

        opacity:
          0.36,

        metalness:
          0,

        roughness:
          0.09,

        clearcoat:
          1

      });


    const darkDetailMaterial =
      new THREE.MeshStandardMaterial({

        color:
          new THREE.Color(
            0x010203
          ),

        metalness:
          0.10,

        roughness:
          0.47

      });


    const teethMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xf5f7f6
          ),

        metalness:
          0,

        roughness:
          0.31,

        clearcoat:
          0.18

      });


    /*
      Genuine Prime gold accent.
    */

    const goldMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xd6aa4b
          ),

        emissive:
          new THREE.Color(
            0x241703
          ),

        emissiveIntensity:
          0.12,

        metalness:
          0.72,

        roughness:
          0.27,

        clearcoat:
          0.38

      });


    function forceCleanMaterial(
      object,
      material
    ) {

      object.material =
        material;


      material.map =
        null;


      material.normalMap =
        null;


      material.roughnessMap =
        null;


      material.metalnessMap =
        null;


      material.aoMap =
        null;


      material.emissiveMap =
        null;


      material.alphaMap =
        null;


      material.lightMap =
        null;


      material.displacementMap =
        null;


      material.vertexColors =
        false;


      material.needsUpdate =
        true;

    }


    /* =====================================================
       CHARACTER REFERENCES
    ===================================================== */

    let model =
      null;


    let modelSize =
      null;


    let headBone =
      null;


    let neck01 =
      null;


    let neck02 =
      null;


    let chestBone =
      null;


    let eyeLObject =
      null;


    let eyeRObject =
      null;


    let baseHeadRotation =
      null;


    let baseNeck01Rotation =
      null;


    let baseNeck02Rotation =
      null;


    let baseEyeLRotation =
      null;


    let baseEyeRRotation =
      null;


    const blinkMeshes =
      [];


    /* =====================================================
       POINTER TRACKING
    ===================================================== */

    const pointer =
      new THREE.Vector2(
        0,
        0
      );


    const targetPointer =
      new THREE.Vector2(
        0,
        0
      );


    window.addEventListener(

      'pointermove',

      function (
        event
      ) {

        let x =
          (
            event.clientX /
            window.innerWidth
          ) * 2 - 1;


        let y =
          -(
            (
              event.clientY /
              window.innerHeight
            ) * 2 - 1
          );


        const deadZone =
          0.055;


        if (
          Math.abs(
            x
          ) <
          deadZone
        ) {

          x =
            0;

        }


        if (
          Math.abs(
            y
          ) <
          deadZone
        ) {

          y =
            0;

        }


        x =
          Math.sign(
            x
          ) *
          Math.pow(
            Math.abs(
              x
            ),
            1.15
          );


        y =
          Math.sign(
            y
          ) *
          Math.pow(
            Math.abs(
              y
            ),
            1.15
          );


        targetPointer.set(

          THREE.MathUtils.clamp(
            x,
            -1,
            1
          ),

          THREE.MathUtils.clamp(
            y,
            -1,
            1
          )

        );

      }

    );


    document.documentElement.addEventListener(

      'mouseleave',

      function () {

        targetPointer.set(
          0,
          0
        );

      }

    );


    /* =====================================================
       PARTICLES
    ===================================================== */

    let particleSystem =
      null;


    let particlePositions =
      null;


    const particleSpeeds =
      [];


    function createParticles(
      size
    ) {

      const count =
        360;


      const geometry =
        new THREE.BufferGeometry();


      particlePositions =
        new Float32Array(
          count * 3
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const i3 =
          i * 3;


        particlePositions[
          i3
        ] =
          (
            Math.random() -
            0.5
          ) *
          size.x *
          2.2;


        particlePositions[
          i3 + 1
        ] =
          (
            Math.random() -
            0.45
          ) *
          size.y *
          1.15;


        particlePositions[
          i3 + 2
        ] =
          (
            Math.random() -
            0.5
          ) *
          Math.max(
            size.z *
            4,
            size.x
          );


        particleSpeeds.push(

          0.0015 +
          Math.random() *
          0.0045

        );

      }


      geometry.setAttribute(

        'position',

        new THREE.BufferAttribute(
          particlePositions,
          3
        )

      );


      const material =
        new THREE.PointsMaterial({

          color:
            0x52eaff,

          size:
            Math.max(
              size.y *
              0.0027,
              0.002
            ),

          transparent:
            true,

          opacity:
            0.34,

          depthWrite:
            false,

          blending:
            THREE.AdditiveBlending

        });


      particleSystem =
        new THREE.Points(
          geometry,
          material
        );


      scene.add(
        particleSystem
      );

    }


    function updateParticles(
      size
    ) {

      if (
        !particleSystem ||
        !particlePositions
      ) {

        return;

      }


      const positions =
        particleSystem
          .geometry
          .attributes
          .position;


      for (
        let i = 0;
        i < particleSpeeds.length;
        i++
      ) {

        const yIndex =
          i * 3 + 1;


        particlePositions[
          yIndex
        ] +=
          particleSpeeds[
            i
          ];


        if (
          particlePositions[
            yIndex
          ] >
          size.y *
          0.60
        ) {

          particlePositions[
            yIndex
          ] =
            -size.y *
            0.58;

        }

      }


      positions.needsUpdate =
        true;

    }


    /* =====================================================
       HOLOGRAPHIC ENERGY PLATFORM
    ===================================================== */

    const holoGroup =
      new THREE.Group();


    scene.add(
      holoGroup
    );


    const ringMaterialA =
      new THREE.MeshBasicMaterial({

        color:
          0x36e5ff,

        transparent:
          true,

        opacity:
          0.42,

        depthWrite:
          false,

        blending:
          THREE.AdditiveBlending

      });


    const ringMaterialB =
      new THREE.MeshBasicMaterial({

        color:
          0x91f3ff,

        transparent:
          true,

        opacity:
          0.20,

        depthWrite:
          false,

        blending:
          THREE.AdditiveBlending

      });


    function createHologramPlatform(
      size
    ) {

      /*
        Position around lower torso / hip region,
        closer to the concept image.
      */

      const y =
        -size.y *
        0.31;


      const radius =
        size.x *
        0.54;


      const ring1 =
        new THREE.Mesh(

          new THREE.TorusGeometry(
            radius,
            radius * 0.010,
            10,
            100
          ),

          ringMaterialA

        );


      ring1.rotation.x =
        Math.PI / 2;


      ring1.position.y =
        y;


      holoGroup.add(
        ring1
      );


      const ring2 =
        new THREE.Mesh(

          new THREE.TorusGeometry(
            radius * 1.16,
            radius * 0.006,
            10,
            100
          ),

          ringMaterialB

        );


      ring2.rotation.x =
        Math.PI / 2;


      ring2.position.y =
        y;


      holoGroup.add(
        ring2
      );


      const ring3 =
        new THREE.Mesh(

          new THREE.TorusGeometry(
            radius * 1.36,
            radius * 0.004,
            10,
            100
          ),

          ringMaterialB

        );


      ring3.rotation.x =
        Math.PI / 2;


      ring3.position.y =
        y;


      holoGroup.add(
        ring3
      );

    }


    /* =====================================================
       LOAD MODEL
    ===================================================== */

    const loader =
      new GLTFLoader();


    loader.load(

      './PrimeReceptionAI_Test01.glb',


      function (
        gltf
      ) {

        model =
          gltf.scene;


        scene.add(
          model
        );


        model.traverse(

          function (
            object
          ) {


            /* =============================================
               MESHES
            ============================================= */

            if (
              object.isMesh
            ) {

              const name =
                object.name;


              /*
                Find ARKit blink shapes.
              */

              if (
                object.morphTargetDictionary &&
                object.morphTargetInfluences
              ) {

                const dictionary =
                  object
                    .morphTargetDictionary;


                if (
                  dictionary.eyeBlinkLeft
                    !== undefined
                  ||
                  dictionary.eyeBlinkRight
                    !== undefined
                ) {

                  blinkMeshes.push(
                    object
                  );

                }

              }


              /*
                Hide the unwanted original censor layers.
              */

              if (
                name ===
                  'SK_FemBase2_Censored_Torso'
                ||
                name ===
                  'SK_FemBase2_UnderWear'
              ) {

                object.visible =
                  false;


                return;

              }


              /*
                Synthetic body.
              */

              if (
                name ===
                  'Mesh010'
                ||
                name ===
                  'SK_FemBase2_Torso'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  bodyMaterial
                );


                return;

              }


              /*
                Face.
              */

              if (
                name ===
                  'Mesh010_1'
                ||
                name ===
                  'SK_FemBase2_Head_52ArKit'
                ||
                name ===
                  'SK_FemBase2_Head_52ARKit'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  faceMaterial
                );


                return;

              }


              /*
                Pearl-white upper suit.
              */

              if (
                name ===
                'SK_FemBase2_TShirt'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  shirtMaterial
                );


                return;

              }


              /*
                Pearl-white lower suit.
              */

              if (
                name ===
                'SK_FemBase2_Leggings'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  leggingsMaterial
                );


                return;

              }


              /*
                Hair.
              */

              if (
                name ===
                'SK_FemBase2_Hair'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  hairMaterial
                );


                return;

              }


              /*
                Eyes.
              */

              if (
                name ===
                'SK_FemBase2_EyeL'
              ) {

                eyeLObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeMaterial
                );


                return;

              }


              if (
                name ===
                'SK_FemBase2_EyeR'
              ) {

                eyeRObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeMaterial
                );


                return;

              }


              if (
                name ===
                'SK_FemBase2_EyeShell'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeShellMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Lashes'
                ||
                name ===
                  'SK_FemBase2_EyeEdge'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  darkDetailMaterial
                );


                return;

              }


              if (
                name ===
                'SK_FemBase2_Teeth'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  teethMaterial
                );


                return;

              }


              if (
                name ===
                'SK_FemBase2_Nails'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  goldMaterial
                );


                return;

              }

            }


            /* =============================================
               BONES
            ============================================= */

            if (
              object.isBone
            ) {

              const lowerName =
                object
                  .name
                  .toLowerCase();


              /*
                Head.
              */

              if (
                lowerName ===
                  'head'
                ||
                lowerName.endsWith(
                  '_head'
                )
              ) {

                headBone =
                  object;

              }


              /*
                Neck.
              */

              if (
                lowerName.includes(
                  'neck_01'
                )
              ) {

                neck01 =
                  object;

              }


              if (
                lowerName.includes(
                  'neck_02'
                )
              ) {

                neck02 =
                  object;

              }


              /*
                Locate the best chest anchor available.

                Different rigs use different names,
                so we check several common conventions.
              */

              if (
                !chestBone &&
                (
                  lowerName.includes(
                    'upperchest'
                  )
                  ||
                  lowerName.includes(
                    'upper_chest'
                  )
                  ||
                  lowerName.includes(
                    'chest'
                  )
                  ||
                  lowerName.includes(
                    'spine_03'
                  )
                  ||
                  lowerName.includes(
                    'spine03'
                  )
                  ||
                  lowerName.includes(
                    'spine_3'
                  )
                )
              ) {

                chestBone =
                  object;

              }

            }

          }

        );


        /* =================================================
           STORE BASE ROTATIONS
        ================================================= */

        if (
          headBone
        ) {

          baseHeadRotation =
            headBone
              .rotation
              .clone();

        }


        if (
          neck01
        ) {

          baseNeck01Rotation =
            neck01
              .rotation
              .clone();

        }


        if (
          neck02
        ) {

          baseNeck02Rotation =
            neck02
              .rotation
              .clone();

        }


        if (
          eyeLObject
        ) {

          baseEyeLRotation =
            eyeLObject
              .rotation
              .clone();

        }


        if (
          eyeRObject
        ) {

          baseEyeRRotation =
            eyeRObject
              .rotation
              .clone();

        }


        /* =================================================
           CENTER MODEL
        ================================================= */

        const box =
          new THREE.Box3()
            .setFromObject(
              model
            );


        modelSize =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        model.position.set(

          -center.x,

          -center.y,

          -center.z

        );


        /* =================================================
           CAMERA
        ================================================= */

        const verticalFOV =
          THREE.MathUtils.degToRad(
            camera.fov
          );


        const upperBodyHeight =
          modelSize.y *
          0.78;


        let distance =
          upperBodyHeight /
          (
            2 *
            Math.tan(
              verticalFOV /
              2
            )
          );


        distance *=
          1.05;


        const targetHeight =
          modelSize.y *
          0.17;


        camera.position.set(

          0,

          targetHeight,

          distance

        );


        camera.lookAt(

          0,

          targetHeight,

          0

        );


        camera.near =
          Math.max(
            distance /
            100,
            0.01
          );


        camera.far =
          distance *
          100;


        camera.updateProjectionMatrix();


        /* =================================================
           EFFECTS
        ================================================= */

        createParticles(
          modelSize
        );


        createHologramPlatform(
          modelSize
        );


        /*
          Reveal logo once the model is ready.
        */

        chestLogo.style.opacity =
          '1';


        status.style.display =
          'none';


        scheduleNextBlink();

      },


      /* ===================================================
         PROGRESS
      =================================================== */

      function (
        xhr
      ) {

        if (
          xhr.total
        ) {

          const percentage =
            Math.round(

              xhr.loaded /
              xhr.total *
              100

            );


          status.textContent =
            'INITIALIZING PRIME RECEPTION AI… ' +
            percentage +
            '%';

        }

      },


      /* ===================================================
         ERROR
      =================================================== */

      function (
        error
      ) {

        console.error(
          error
        );


        status.textContent =
          'MODEL FAILED TO LOAD';

      }

    );


    /* =====================================================
       BLINKING
    ===================================================== */

    function setBlinkAmount(
      amount
    ) {

      const value =
        THREE.MathUtils.clamp(
          amount,
          0,
          1
        );


      for (
        const mesh
        of blinkMeshes
      ) {

        const dictionary =
          mesh
            .morphTargetDictionary;


        const influences =
          mesh
            .morphTargetInfluences;


        if (
          dictionary.eyeBlinkLeft !==
          undefined
        ) {

          influences[
            dictionary.eyeBlinkLeft
          ] =
            value;

        }


        if (
          dictionary.eyeBlinkRight !==
          undefined
        ) {

          influences[
            dictionary.eyeBlinkRight
          ] =
            value;

        }

      }

    }


    let blinkActive =
      false;


    let blinkStart =
      0;


    let blinkDuration =
      0.15;


    let nextBlink =
      Infinity;


    let doubleBlink =
      false;


    let secondBlinkAt =
      Infinity;


    function scheduleNextBlink() {

      nextBlink =
        performance.now() /
        1000 +
        2.3 +
        Math.random() *
        3.7;

    }


    function beginBlink() {

      blinkActive =
        true;


      blinkStart =
        performance.now() /
        1000;


      blinkDuration =
        0.12 +
        Math.random() *
        0.055;


      doubleBlink =
        Math.random() <
        0.12;

    }


    function updateBlink(
      now
    ) {

      if (
        !blinkActive &&
        now >=
        nextBlink
      ) {

        beginBlink();

      }


      if (
        !blinkActive &&
        doubleBlink &&
        now >=
        secondBlinkAt
      ) {

        doubleBlink =
          false;


        beginBlink();


        return;

      }


      if (
        !blinkActive
      ) {

        setBlinkAmount(
          0
        );


        return;

      }


      const progress =
        (
          now -
          blinkStart
        ) /
        blinkDuration;


      if (
        progress <=
        1
      ) {

        setBlinkAmount(

          Math.sin(

            progress *
            Math.PI

          )

        );

      }

      else {

        setBlinkAmount(
          0
        );


        blinkActive =
          false;


        if (
          doubleBlink
        ) {

          secondBlinkAt =
            now +
            0.15 +
            Math.random() *
            0.08;

        }

        else {

          scheduleNextBlink();

        }

      }

    }


    /* =====================================================
       TRACKING
    ===================================================== */

    const eyeHorizontalMax =
      THREE.MathUtils.degToRad(
        10
      );


    const eyeVerticalMax =
      THREE.MathUtils.degToRad(
        6
      );


    const headHorizontalMax =
      THREE.MathUtils.degToRad(
        4.2
      );


    const headVerticalMax =
      THREE.MathUtils.degToRad(
        2.2
      );


    const neckHorizontalMax =
      THREE.MathUtils.degToRad(
        1.25
      );


    const neckVerticalMax =
      THREE.MathUtils.degToRad(
        0.7
      );


    let eyeHorizontal =
      0;


    let eyeVertical =
      0;


    let headHorizontal =
      0;


    let headVertical =
      0;


    let neckHorizontal =
      0;


    let neckVertical =
      0;


    function damp(
      current,
      target,
      speed,
      delta
    ) {

      return THREE.MathUtils.lerp(

        current,

        target,

        1 -
        Math.exp(
          -speed *
          delta
        )

      );

    }


    /* =====================================================
       CHEST LOGO PROJECTION
    ===================================================== */

    const chestWorldPosition =
      new THREE.Vector3();


    const projectedChest =
      new THREE.Vector3();


    function updateChestLogo() {

      if (
        !model ||
        !modelSize
      ) {

        return;

      }


      if (
        chestBone
      ) {

        chestBone.getWorldPosition(
          chestWorldPosition
        );


        /*
          Move from the skeletal chest center
          slightly toward the upper-right chest area
          where a corporate emblem normally sits.

          Since the torso itself stays mostly fixed,
          this gives a stable premium placement.
        */

        chestWorldPosition.x +=
          modelSize.x *
          0.105;


        chestWorldPosition.y +=
          modelSize.y *
          0.010;

      }

      else {

        /*
          Fallback if the rig uses an unexpected
          chest bone name.
        */

        chestWorldPosition.set(

          modelSize.x *
          0.105,

          modelSize.y *
          0.155,

          0

        );

      }


      projectedChest.copy(
        chestWorldPosition
      );


      projectedChest.project(
        camera
      );


      const screenX =
        (
          projectedChest.x *
          0.5 +
          0.5
        ) *
        window.innerWidth;


      const screenY =
        (
          -projectedChest.y *
          0.5 +
          0.5
        ) *
        window.innerHeight;


      chestLogo.style.left =
        screenX +
        'px';


      chestLogo.style.top =
        screenY +
        'px';


      /*
        Scale automatically with viewport/model size.
      */

      const logoWidth =
        THREE.MathUtils.clamp(

          window.innerHeight *
          0.070,

          46,

          82

        );


      chestLogo.style.width =
        logoWidth +
        'px';

    }


    /* =====================================================
       ANIMATION LOOP
    ===================================================== */

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(

          clock.getDelta(),

          0.05

        );


      const now =
        performance.now() /
        1000;


      /* =========================================
         POINTER SMOOTHING
      ========================================= */

      pointer.x =
        damp(

          pointer.x,

          targetPointer.x,

          7,

          delta

        );


      pointer.y =
        damp(

          pointer.y,

          targetPointer.y,

          7,

          delta

        );


      /* =========================================
         EYES
      ========================================= */

      eyeHorizontal =
        damp(

          eyeHorizontal,

          pointer.x *
          eyeHorizontalMax,

          14,

          delta

        );


      eyeVertical =
        damp(

          eyeVertical,

          pointer.y *
          eyeVerticalMax,

          14,

          delta

        );


      /* =========================================
         HEAD
      ========================================= */

      headHorizontal =
        damp(

          headHorizontal,

          pointer.x *
          headHorizontalMax,

          2.7,

          delta

        );


      headVertical =
        damp(

          headVertical,

          pointer.y *
          headVerticalMax,

          2.5,

          delta

        );


      /* =========================================
         NECK
      ========================================= */

      neckHorizontal =
        damp(

          neckHorizontal,

          pointer.x *
          neckHorizontalMax,

          1.65,

          delta

        );


      neckVertical =
        damp(

          neckVertical,

          pointer.y *
          neckVerticalMax,

          1.5,

          delta

        );


      /* =========================================
         APPLY EYE ROTATIONS
      ========================================= */

      if (
        eyeLObject &&
        baseEyeLRotation
      ) {

        eyeLObject.rotation.copy(
          baseEyeLRotation
        );


        eyeLObject.rotation.y +=
          eyeHorizontal;


        eyeLObject.rotation.x -=
          eyeVertical;

      }


      if (
        eyeRObject &&
        baseEyeRRotation
      ) {

        eyeRObject.rotation.copy(
          baseEyeRRotation
        );


        eyeRObject.rotation.y +=
          eyeHorizontal;


        eyeRObject.rotation.x -=
          eyeVertical;

      }


      /* =========================================
         APPLY HEAD ROTATIONS

         IMPORTANT:
         This preserves the corrected axis mapping
         we already confirmed with your model.

         X = left/right
         Z = up/down
      ========================================= */

      if (
        headBone &&
        baseHeadRotation
      ) {

        headBone.rotation.copy(
          baseHeadRotation
        );


        headBone.rotation.x +=
          headHorizontal;


        headBone.rotation.z +=
          headVertical;


        headBone.rotation.y =
          baseHeadRotation.y;

      }


      /* =========================================
         NECK 02
      ========================================= */

      if (
        neck02 &&
        baseNeck02Rotation
      ) {

        neck02.rotation.copy(
          baseNeck02Rotation
        );


        neck02.rotation.x +=
          neckHorizontal;


        neck02.rotation.z +=
          neckVertical;


        neck02.rotation.y =
          baseNeck02Rotation.y;

      }


      /* =========================================
         NECK 01
      ========================================= */

      if (
        neck01 &&
        baseNeck01Rotation
      ) {

        neck01.rotation.copy(
          baseNeck01Rotation
        );


        neck01.rotation.x +=
          neckHorizontal *
          0.30;


        neck01.rotation.z +=
          neckVertical *
          0.22;


        neck01.rotation.y =
          baseNeck01Rotation.y;

      }


      /* =========================================
         BLINK
      ========================================= */

      updateBlink(
        now
      );


      /* =========================================
         SUBTLE ELECTRONIC PULSE
      ========================================= */

      const pulse =
        0.5 +
        Math.sin(
          now *
          1.15
        ) *
        0.5;


      lowerGlow.intensity =
        7.7 +
        pulse *
        1.6;


      faceGlow.intensity =
        1.15 +
        pulse *
        0.25;


      eyeMaterial.emissiveIntensity =
        0.82 +
        pulse *
        0.17;


      bodyMaterial.emissiveIntensity =
        0.09 +
        pulse *
        0.035;


      shirtMaterial.emissiveIntensity =
        0.13 +
        pulse *
        0.045;


      leggingsMaterial.emissiveIntensity =
        0.11 +
        pulse *
        0.040;


      /* =========================================
         PARTICLES
      ========================================= */

      if (
        modelSize
      ) {

        updateParticles(
          modelSize
        );

      }


      if (
        particleSystem
      ) {

        particleSystem.rotation.y +=
          0.00022;

      }


      /* =========================================
         HOLOGRAPHIC PLATFORM
      ========================================= */

      if (
        holoGroup.children.length
      ) {

        holoGroup.rotation.y +=
          0.0011;


        const platformPulse =
          0.92 +
          Math.sin(
            now *
            1.7
          ) *
          0.08;


        holoGroup.scale.set(

          platformPulse,

          1,

          platformPulse

        );

      }


      /* =========================================
         LOGO
      ========================================= */

      updateChestLogo();


      /* =========================================
         RENDER
      ========================================= */

      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );

      }

    );

  </script>

</body>
</html>
