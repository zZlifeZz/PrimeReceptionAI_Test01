<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prime Reception AI — 3D Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02060a;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

      background:
        radial-gradient(
          circle at 50% 38%,
          #0b1820 0%,
          #040a0f 44%,
          #010305 72%,
          #000000 100%
        );
    }

    #stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 42%,
          rgba(0, 0, 0, 0.62) 100%
        );
    }

    #stage canvas {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      z-index: 10;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: #73e8ff;
      font-family: Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-align: center;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="stage">
    <div id="status">
      Loading Prime Reception AI…
    </div>
  </div>


  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <script type="module">

    import * as THREE from 'three';

    import {
      GLTFLoader
    } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


    const stage =
      document.getElementById('stage');

    const status =
      document.getElementById('status');


    /* =====================================================
       SCENE
    ===================================================== */

    const scene =
      new THREE.Scene();


    /* =====================================================
       CAMERA
    ===================================================== */

    const camera =
      new THREE.PerspectiveCamera(
        32,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
      );


    /* =====================================================
       RENDERER
    ===================================================== */

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        2
      )
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
      1.0;

    renderer.setClearColor(
      0x000000,
      0
    );

    stage.appendChild(
      renderer.domElement
    );


    /* =====================================================
       LIGHTING
    ===================================================== */

    const ambient =
      new THREE.HemisphereLight(
        0xdbeff4,
        0x06080a,
        0.95
      );

    scene.add(
      ambient
    );


    const faceLight =
      new THREE.DirectionalLight(
        0xfff8ee,
        2.5
      );

    faceLight.position.set(
      1.3,
      3.8,
      5.5
    );

    scene.add(
      faceLight
    );


    const cyanRim =
      new THREE.DirectionalLight(
        0x2edfff,
        3.6
      );

    cyanRim.position.set(
      -4,
      3,
      -3
    );

    scene.add(
      cyanRim
    );


    const goldRim =
      new THREE.DirectionalLight(
        0xd6a13f,
        2.0
      );

    goldRim.position.set(
      4,
      2,
      -2
    );

    scene.add(
      goldRim
    );


    const lowerFill =
      new THREE.PointLight(
        0x1498b4,
        6,
        8
      );

    lowerFill.position.set(
      0,
      -1.2,
      2.5
    );

    scene.add(
      lowerFill
    );


    /* =====================================================
       MATERIALS
    ===================================================== */

    const bodyMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xb9c4c8),

        metalness:
          0.34,

        roughness:
          0.40,

        clearcoat:
          0.30,

        clearcoatRoughness:
          0.30,

        sheen:
          0.10,

        sheenColor:
          new THREE.Color(0x55d7eb)

      });


    const faceMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xd7dee0),

        metalness:
          0.18,

        roughness:
          0.44,

        clearcoat:
          0.22,

        clearcoatRoughness:
          0.32

      });


    const shirtMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0x07090c),

        metalness:
          0.48,

        roughness:
          0.38,

        clearcoat:
          0.28,

        clearcoatRoughness:
          0.30

      });


    const leggingsMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0x07090c),

        metalness:
          0.44,

        roughness:
          0.40,

        clearcoat:
          0.24,

        clearcoatRoughness:
          0.32

      });


    const hairMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0x06090d),

        metalness:
          0.22,

        roughness:
          0.42,

        clearcoat:
          0.22,

        clearcoatRoughness:
          0.30

      });


    const eyeMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xd9fbff),

        emissive:
          new THREE.Color(0x29dfff),

        emissiveIntensity:
          0.6,

        metalness:
          0.04,

        roughness:
          0.16,

        clearcoat:
          0.9,

        clearcoatRoughness:
          0.08

      });


    const darkDetailMaterial =
      new THREE.MeshStandardMaterial({

        color:
          new THREE.Color(0x020304),

        metalness:
          0.10,

        roughness:
          0.48

      });


    const teethMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xf3f5f5),

        metalness:
          0,

        roughness:
          0.30,

        clearcoat:
          0.18

      });


    const goldMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xc99a3d),

        metalness:
          0.70,

        roughness:
          0.30,

        clearcoat:
          0.30

      });


    function forceCleanMaterial(
      object,
      material
    ) {

      object.material =
        material;

      object.material.map =
        null;

      object.material.normalMap =
        null;

      object.material.roughnessMap =
        null;

      object.material.metalnessMap =
        null;

      object.material.aoMap =
        null;

      object.material.emissiveMap =
        null;

      object.material.alphaMap =
        null;

      object.material.lightMap =
        null;

      object.material.displacementMap =
        null;

      object.material.vertexColors =
        false;

      object.material.needsUpdate =
        true;

    }


    /* =====================================================
       LOAD CHARACTER
    ===================================================== */

    const loader =
      new GLTFLoader();


    let model =
      null;

    let headBone =
      null;

    let neck01 =
      null;

    let neck02 =
      null;

    let originalModelY =
      0;


    loader.load(

      './PrimeReceptionAI_Test01.glb',


      function (gltf) {

        model =
          gltf.scene;

        scene.add(
          model
        );


        model.traverse(

          function (object) {

            if (
              object.isMesh
            ) {

              const name =
                object.name;


              if (
                name === 'SK_FemBase2_Censored_Torso' ||
                name === 'SK_FemBase2_UnderWear'
              ) {

                object.visible =
                  false;

                return;

              }


              if (
                name === 'Mesh010'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  bodyMaterial
                );

                return;

              }


              if (
                name === 'Mesh010_1'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  faceMaterial
                );

                return;

              }


              if (
                name === 'SK_FemBase2_Torso'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  bodyMaterial
                );

                return;

              }


              if (
                name === 'SK_FemBase2_Head_52ArKit' ||
                name === 'SK_FemBase2_Head_52ARKit'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  faceMaterial
                );

                return;

              }


              if (
                name === 'SK_FemBase2_TShirt'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  shirtMaterial
                );

                return;

              }


              if (
                name === 'SK_FemBase2_Leggings'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  leggingsMaterial
                );

                return;

              }


              if (
                name === 'SK_FemBase2_Hair'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  hairMaterial
                );

                return;

              }


              if (
                name === 'SK_FemBase2_EyeL' ||
                name === 'SK_FemBase2_EyeR' ||
                name === 'SK_FemBase2_EyeShell'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  eyeMaterial
                );

                return;

              }


              if (
                name === 'SK_FemBase2_Lashes' ||
                name === 'SK_FemBase2_EyeEdge'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  darkDetailMaterial
                );

                return;

              }


              if (
                name === 'SK_FemBase2_Teeth'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  teethMaterial
                );

                return;

              }


              if (
                name === 'SK_FemBase2_Nails'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  goldMaterial
                );

                return;

              }

            }


            if (
              object.isBone
            ) {

              const lower =
                object.name.toLowerCase();


              if (
                lower.includes('head')
              ) {

                headBone =
                  object;

              }


              if (
                lower.includes('neck_01')
              ) {

                neck01 =
                  object;

              }


              if (
                lower.includes('neck_02')
              ) {

                neck02 =
                  object;

              }

            }

          }

        );


        /* =================================================
           CENTER MODEL
        ================================================= */

        const box =
          new THREE.Box3()
            .setFromObject(
              model
            );


        const size =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        model.position.set(
          -center.x,
          -center.y,
          -center.z
        );


        originalModelY =
          model.position.y;


        /* =================================================
           CAMERA
        ================================================= */

        const verticalFOV =
          THREE.MathUtils.degToRad(
            camera.fov
          );


        const upperBodyHeight =
          size.y * 0.78;


        let distance =
          upperBodyHeight /
          (
            2 *
            Math.tan(
              verticalFOV / 2
            )
          );


        distance *=
          1.05;


        const cameraTargetHeight =
          size.y * 0.17;


        camera.position.set(
          0,
          cameraTargetHeight,
          distance
        );


        camera.lookAt(
          0,
          cameraTargetHeight,
          0
        );


        camera.near =
          Math.max(
            distance / 100,
            0.01
          );


        camera.far =
          distance * 100;


        camera.updateProjectionMatrix();


        /* =================================================
           RESET HEAD / NECK TO NEUTRAL
        ================================================= */

        if (
          headBone
        ) {

          headBone.rotation.x =
            0;

          headBone.rotation.y =
            0;

          headBone.rotation.z =
            0;

        }


        if (
          neck01
        ) {

          neck01.rotation.x =
            0;

          neck01.rotation.y =
            0;

          neck01.rotation.z =
            0;

        }


        if (
          neck02
        ) {

          neck02.rotation.x =
            0;

          neck02.rotation.y =
            0;

          neck02.rotation.z =
            0;

        }


        status.style.display =
          'none';

      },


      function (xhr) {

        if (
          xhr.total
        ) {

          const percent =
            Math.round(
              xhr.loaded /
              xhr.total *
              100
            );


          status.textContent =
            'Loading Prime Reception AI… ' +
            percent +
            '%';

        }

      },


      function (error) {

        console.error(
          'GLB ERROR:',
          error
        );


        status.innerHTML =
          'MODEL FAILED TO LOAD<br>' +
          '<small>Check browser console</small>';

      }

    );


    /* =====================================================
       CONTROLLED IDLE LOOP
    ===================================================== */

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const t =
        clock.getElapsedTime();


      /*
        No vertical movement.
        Character stays anchored.
      */

      if (
        model
      ) {

        model.position.y =
          originalModelY;


        /*
          Almost imperceptible body sway.
        */

        model.rotation.z =
          Math.sin(t * 0.32) * 0.0012;

      }


      /*
        Head remains essentially forward.
        Only extremely subtle horizontal drift.
      */

      if (
        headBone
      ) {

        headBone.rotation.x =
          0;

        headBone.rotation.z =
          0;

        headBone.rotation.y =
          Math.sin(t * 0.25) * 0.006;

      }


      if (
        neck02
      ) {

        neck02.rotation.x =
          0;

        neck02.rotation.z =
          0;

        neck02.rotation.y =
          Math.sin(t * 0.22) * 0.0025;

      }


      if (
        neck01
      ) {

        neck01.rotation.x =
          0;

        neck01.rotation.y =
          0;

        neck01.rotation.z =
          0;

      }


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }

    );

  </script>

</body>
</html>
