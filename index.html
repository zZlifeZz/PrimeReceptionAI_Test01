<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prime Reception AI — Digital Receptionist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 50% 43%,
          #081c27 0%,
          #04121a 29%,
          #02080d 57%,
          #000 100%
        );
    }

    #stage::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 4;

      pointer-events: none;

      opacity: 0.025;

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 5px,
          rgba(40, 212, 255, 0.14) 6px,
          transparent 7px
        );

      animation:
        scanMove 14s linear infinite;
    }

    @keyframes scanMove {
      from {
        background-position-y: 0;
      }

      to {
        background-position-y: 240px;
      }
    }

    #stage::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 5;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 37%,
          rgba(0, 0, 0, 0.08) 61%,
          rgba(0, 0, 0, 0.80) 100%
        );
    }

    #stage canvas {
      position: relative;
      z-index: 1;

      display: block;

      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;

      z-index: 20;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      color:
        #55dfff;

      font-family:
        Arial,
        sans-serif;

      font-size:
        14px;

      letter-spacing:
        0.11em;

      white-space:
        nowrap;

      pointer-events:
        none;
    }


    /* =====================================================
       PRIME PROJECTION EFFECTS
    ===================================================== */

    @media (max-width: 800px) {
      #projectionFx {
        width: 92vw;
        bottom: -48px;
      }

      #holoSweep {
        width: 70vw;
      }
    }

  </style>
</head>

    /* =====================================================
       MATERIAL HELPER
    ===================================================== */

    function forceCleanMaterial(
      object,
      material
    ) {

      object.material =
        material;


      material.map =
        null;


      material.normalMap =
        null;


      material.roughnessMap =
        null;


      material.metalnessMap =
        null;


      material.aoMap =
        null;


      material.emissiveMap =
        null;


      material.alphaMap =
        null;

      material.displacementMap =
        null;


      material.vertexColors =
        false;


      material.needsUpdate =
        true;

    }

    ===================================================== */

    /* =====================================================
       POINTER
    ===================================================== */

    const pointer =
      new THREE.Vector2(
        0,
        0
      );


    const targetPointer =
      new THREE.Vector2(
        0,
        0
      );


    window.addEventListener(

      'pointermove',

      function (
        event
      ) {

        let x =
          (
            event.clientX /
            window.innerWidth
          ) *
          2 -
          1;


        let y =
          -(
            (
              event.clientY /
              window.innerHeight
            ) *
            2 -
            1
          );


        const deadZone =
          0.045;


        if (
          Math.abs(
            x
          ) <
          deadZone
        ) {

          x =
            0;

        }


        if (
          Math.abs(
            y
          ) <
          deadZone
        ) {

          y =
            0;

        }


        x =
          Math.sign(
            x
          ) *
          Math.pow(
            Math.abs(
              x
            ),
            1.08
          );


        y =
          Math.sign(
            y
          ) *
          Math.pow(
            Math.abs(
              y
            ),
            1.05
          );


        targetPointer.set(

          THREE.MathUtils.clamp(
            x,
            -1,
            1
          ),

          THREE.MathUtils.clamp(
            y,
            -1,
            1
          )

        );

      }

    );


    document.documentElement.addEventListener(

      'mouseleave',

      function () {

        targetPointer.set(
          0,
          0
        );

      }

    );


    /* =====================================================
       FACIAL MORPHS
    ===================================================== */


    /*
      These names are confirmed to exist in the GLB:

      mouthSmileLeft
      mouthSmileRight
      cheekSquintLeft
      cheekSquintRight
    */

    function registerFacialMorphs(
      object
    ) {

      if (
        !object.morphTargetDictionary ||
        !object.morphTargetInfluences
      ) {

        return;

      }


      const d =
        object.morphTargetDictionary;


      /* -----------------------------------------
         Blink
      ----------------------------------------- */

      const blinkLeft =
        d.eyeBlinkLeft !== undefined
          ?
          d.eyeBlinkLeft
          :
          null;


      const blinkRight =
        d.eyeBlinkRight !== undefined
          ?
          d.eyeBlinkRight
          :
          null;


      if (
        blinkLeft !==
          null
        ||
        blinkRight !==
          null
      ) {

        blinkMeshes.push({

          mesh:
            object,

          left:
            blinkLeft,

          right:
            blinkRight

        });

      }


      /* -----------------------------------------
         Smile
      ----------------------------------------- */

      const smileLeft =
        d.mouthSmileLeft !== undefined
          ?
          d.mouthSmileLeft
          :
          null;


      const smileRight =
        d.mouthSmileRight !== undefined
          ?
          d.mouthSmileRight
          :
          null;


      const cheekLeft =
        d.cheekSquintLeft !== undefined
          ?
          d.cheekSquintLeft
          :
          null;


      const cheekRight =
        d.cheekSquintRight !== undefined
          ?
          d.cheekSquintRight
          :
          null;


      if (
        smileLeft !==
          null
        ||
        smileRight !==
          null
      ) {

        smileMeshes.push({

          mesh:
            object,

          left:
            smileLeft,

          right:
            smileRight,

          cheekLeft:
            cheekLeft,

          cheekRight:
            cheekRight

        });

      }

    }


    /*
      Much stronger than previous 0.28.

      Still below a full smile.
    */

    const RESTING_SMILE =
      0.62;


    const RESTING_CHEEK =
      0.14;


    function applyRestingSmile() {

      for (
        const entry
        of smileMeshes
      ) {

        const influences =
          entry
            .mesh
            .morphTargetInfluences;


        if (
          entry.left !==
          null
        ) {

          influences[
            entry.left
          ] =
            RESTING_SMILE;

        }


        if (
          entry.right !==
          null
        ) {

          influences[
            entry.right
          ] =
            RESTING_SMILE;

        }


        if (
          entry.cheekLeft !==
          null
        ) {

          influences[
            entry.cheekLeft
          ] =
            RESTING_CHEEK;

        }


        if (
          entry.cheekRight !==
          null
        ) {

          influences[
            entry.cheekRight
          ] =
            RESTING_CHEEK;

        }

      }

    }


    /* =====================================================
       BACKGROUND PARTICLES
    ===================================================== */

    let backgroundParticles =
      null;


    function createBackgroundParticles(
      size
    ) {

      const count =
        235;


      const positions =
        new Float32Array(
          count *
          3
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const i3 =
          i *
          3;


        positions[
          i3
        ] =
          (
            Math.random() -
            0.5
          ) *
          size.x *
          4;


        positions[
          i3 + 1
        ] =
          (
            Math.random() -
            0.42
          ) *
          size.y *
          1.8;


        positions[
          i3 + 2
        ] =
          (
            Math.random() -
            0.5
          ) *
          Math.max(
            size.x *
            4,
            size.z *
            7
          );

      }


      const geometry =
        new THREE.BufferGeometry();


      geometry.setAttribute(

        'position',

        new THREE.BufferAttribute(
          positions,
          3
        )

      );


      const material =
        new THREE.PointsMaterial({

          color:
            0x20d9ff,

          size:
            Math.max(
              size.y *
              0.0016,
              0.0016
            ),

          transparent:
            true,

          opacity:
            0.16,

          depthWrite:
            false,

          blending:
            THREE.AdditiveBlending

        });


      backgroundParticles =
        new THREE.Points(
          geometry,
          material
        );


      scene.add(
        backgroundParticles
      );

    }



    /* =====================================================
       SCREEN-SPACE PROJECTION PARTICLES
    ===================================================== */

    function createProjectionParticles() {

      if (
        !projectionParticles ||
        projectionParticles.childElementCount > 0
      ) {
        return;
      }


      const count =
        34;


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const dot =
          document.createElement(
            'i'
          );


        const x =
          26 +
          Math.random() *
          48;


        const size =
          1 +
          Math.random() *
          2.4;


        const duration =
          3.2 +
          Math.random() *
          4.8;


        const delay =
          -Math.random() *
          duration;


        const drift =
          (
            Math.random() -
            0.5
          ) *
          56;


        dot.style.setProperty(
          '--x',
          x + '%'
        );


        dot.style.setProperty(
          '--size',
          size + 'px'
        );


        dot.style.setProperty(
          '--duration',
          duration + 's'
        );


        dot.style.setProperty(
          '--delay',
          delay + 's'
        );


        dot.style.setProperty(
          '--drift',
          drift + 'px'
        );


        projectionParticles.appendChild(
          dot
        );

      }

    }

    /* =====================================================
       LOAD MODEL
    ===================================================== */

    const loader =
      new GLTFLoader();


    loader.load(

      './PrimeReceptionAI_Test01.glb',


      function (
        gltf
      ) {

        model =
          gltf.scene;


        scene.add(
          model
        );


        model.traverse(

          function (
            object
          ) {

            /* =============================================
               MESH
            ============================================= */

            if (
              object.isMesh
            ) {

              const name =
                object.name;


              registerFacialMorphs(
                object
              );


              /*
                Hide unwanted auxiliary meshes.
              */

              if (
                name ===
                  'SK_FemBase2_Censored_Torso'
                ||
                name ===
                  'SK_FemBase2_UnderWear'
                ||
                name ===
                  'SK_FemBase2_Unified_mesh'
              ) {

                object.visible =
                  false;


                return;

              }


              /*
                Body / hands / arms.
              */

              if (
                name ===
                  'Mesh010'
                ||
                name ===
                  'SK_FemBase2_Torso'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  bodyMaterial

                );


                return;

              }


              /*
                Face.
              */

              if (
                name ===
                  'Mesh010_1'
                ||
                name ===
                  'SK_FemBase2_Head_52ArKit'
                ||
                name ===
                  'SK_FemBase2_Head_52ARKit'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  faceMaterial

                );


                return;

              }


              /*
                Shirt.
              */

              if (
                name ===
                  'SK_FemBase2_TShirt'
              ) {

                shirtMesh =
                  object;


                /*
                  CHEST OCCLUSION FIX
                  The purchased GLB's torso includes modeled nipple geometry that
                  protrudes through the tight T-shirt mesh. Polygon offset cannot
                  fix intersections between separate meshes, so gently move the
                  shirt surface outward along its own vertex normals.
                */

                if (
                  object.geometry &&
                  object.geometry.attributes &&
                  object.geometry.attributes.position &&
                  object.geometry.attributes.normal &&
                  !object.geometry.userData.primeChestClearanceApplied
                ) {

                  const position =
                    object.geometry.attributes.position;

                  const normal =
                    object.geometry.attributes.normal;

                  for (
                    let i = 0;
                    i < position.count;
                    i++
                  ) {

                    const x = position.getX(i);
                    const y = position.getY(i);

                    /*
                      Restrict clearance to the front/central upper-shirt region
                      so the collar, sleeves and silhouette remain essentially
                      unchanged.
                    */

                    if (
                      y > 1.145 &&
                      y < 1.405 &&
                      Math.abs(x) < 0.205
                    ) {

                      const nx = normal.getX(i);
                      const ny = normal.getY(i);
                      const nz = normal.getZ(i);

                      const clearance = 0.010;

                      position.setXYZ(
                        i,
                        position.getX(i) + nx * clearance,
                        position.getY(i) + ny * clearance,
                        position.getZ(i) + nz * clearance
                      );

                    }

                  }

                  position.needsUpdate = true;
                  object.geometry.computeBoundingBox();
                  object.geometry.computeBoundingSphere();
                  object.geometry.userData.primeChestClearanceApplied = true;

                }


                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  shirtMaterial

                );


                shirtMaterial.needsUpdate =
                  true;


                return;

              }


              /*
                Lower garment.
              */

              if (
                name ===
                  'SK_FemBase2_Leggings'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  leggingsMaterial

                );


                return;

              }


              /*
                Hair.
              */

              if (
                name ===
                  'SK_FemBase2_Hair'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  hairMaterial

                );


                return;

              }


              /*
                Eyes.
              */

              if (
                name ===
                  'SK_FemBase2_EyeL'
              ) {

                eyeLObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  eyeMaterial

                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_EyeR'
              ) {

                eyeRObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  eyeMaterial

                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_EyeShell'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  eyeShellMaterial

                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Lashes'
                ||
                name ===
                  'SK_FemBase2_EyeEdge'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  darkDetailMaterial

                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Teeth'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  teethMaterial

                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Nails'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  nailMaterial

                );


                return;

              }

            }


            /* =============================================
               BONES
            ============================================= */

            if (
              object.isBone
            ) {

              const n =
                object
                  .name
                  .toLowerCase();


              if (
                n ===
                  'head'
                ||
                n.endsWith(
                  '_head'
                )
              ) {

                headBone =
                  object;

              }


              if (
                n.includes(
                  'neck_01'
                )
              ) {

                neck01 =
                  object;

              }


              if (
                n.includes(
                  'neck_02'
                )
              ) {

                neck02 =
                  object;

              }


              /*
                Actual arm bone names from this GLB.
              */

              if (
                n ===
                'clavicle_l'
              ) {

                clavicleL =
                  object;

              }


              if (
                n ===
                'clavicle_r'
              ) {

                clavicleR =
                  object;

              }


              if (
                n ===
                'upperarm_l'
              ) {

                upperArmL =
                  object;

              }


              if (
                n ===
                'upperarm_r'
              ) {

                upperArmR =
                  object;

              }


              if (
                n ===
                'lowerarm_l'
              ) {

                lowerArmL =
                  object;

              }


              if (
                n ===
                'lowerarm_r'
              ) {

                lowerArmR =
                  object;

              }


              if (
                n ===
                'hand_l'
              ) {

                handL =
                  object;

              }


              if (
                n ===
                'hand_r'
              ) {

                handR =
                  object;

              }

            }

          }

        );


        /* =================================================
           STORE BASE ROTATIONS
        ================================================= */

        if (
          headBone
        ) {

          baseHeadRotation =
            headBone
              .rotation
              .clone();

        }


        if (
          neck01
        ) {

          baseNeck01Rotation =
            neck01
              .rotation
              .clone();

        }


        if (
          neck02
        ) {

          baseNeck02Rotation =
            neck02
              .rotation
              .clone();

        }


        if (
          eyeLObject
        ) {

          baseEyeLRotation =
            eyeLObject
              .rotation
              .clone();

        }


        if (
          eyeRObject
        ) {

          baseEyeRRotation =
            eyeRObject
              .rotation
              .clone();

        }


        if (
          clavicleL
        ) {

          baseClavicleLRotation =
            clavicleL
              .rotation
              .clone();

        }


        if (
          clavicleR
        ) {

          baseClavicleRRotation =
            clavicleR
              .rotation
              .clone();

        }


        if (
          upperArmL
        ) {

          baseUpperArmLRotation =
            upperArmL
              .rotation
              .clone();

        }


        if (
          upperArmR
        ) {

          baseUpperArmRRotation =
            upperArmR
              .rotation
              .clone();

        }


        if (
          lowerArmL
        ) {

          baseLowerArmLRotation =
            lowerArmL
              .rotation
              .clone();

        }


        if (
          lowerArmR
        ) {

          baseLowerArmRRotation =
            lowerArmR
              .rotation
              .clone();

        }


        if (
          handL
        ) {

          baseHandLRotation =
            handL
              .rotation
              .clone();

        }


        if (
          handR
        ) {

          baseHandRRotation =
            handR
              .rotation
              .clone();

        }


        /* =================================================
           CENTER MODEL
        ================================================= */

        const box =
          new THREE.Box3()
            .setFromObject(
              model
            );


        modelSize =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        model.position.set(

          -center.x,

          -center.y,

          -center.z

        );


        model.updateMatrixWorld(
          true
        );


        /* =================================================
           CAMERA
        ================================================= */

        setupCamera();


        /* =================================================
           EFFECTS
        ================================================= */

        createBackgroundParticles(
          modelSize
        );


        createProjectionParticles();


        if (
          projectionFx
        ) {

          requestAnimationFrame(
            function () {

              /* cinematic projection disabled for clean diagnostic pass */

            }
          );

        }


        /*
          Apply smile immediately.
        */

        applyRestingSmile();


        console.log(

          'SMILE MORPH MESHES:',

          smileMeshes.length

        );


        status.style.display =
          'none';


        scheduleNextBlink();

      },


      function (
        xhr
      ) {

        if (
          xhr.total
        ) {

          const percent =
            Math.round(

              xhr.loaded /
              xhr.total *
              100

            );


          status.textContent =
            'INITIALIZING PRIME RECEPTION AI… ' +
            percent +
            '%';

        }

      },


      function (
        error
      ) {

        console.error(

          'GLB ERROR:',

          error

        );


        status.textContent =
          'MODEL FAILED TO LOAD';

      }

    );


    /* =====================================================
       CAMERA

       Shirt hem should almost touch bottom of viewport.

       Camera target is moved slightly ABOVE the head
       position, which visually moves the character DOWN.
    ===================================================== */

    const headWorld =
      new THREE.Vector3();


    function setupCamera() {

      if (
        !model ||
        !modelSize
      ) {

        return;

      }


      model.updateMatrixWorld(
        true
      );


      if (
        headBone
      ) {

        headBone.getWorldPosition(
          headWorld
        );

      }

      else {

        headWorld.set(

          0,

          modelSize.y *
          0.29,

          0

        );

      }


      let shirtBottomY;


      if (
        shirtMesh
      ) {

        const shirtBox =
          new THREE.Box3()
            .setFromObject(
              shirtMesh
            );


        shirtBottomY =
          shirtBox.min.y;

      }

      else {

        shirtBottomY =
          headWorld.y -
          modelSize.y *
          0.30;

      }


      /*
        Look slightly ABOVE her head center.

        This makes the entire model render lower
        on the screen.
      */

      const targetY =
        headWorld.y +
        modelSize.y *
        0.018;


      const targetX =
        headWorld.x;


      /*
        We frame from target point down to shirt hem.
      */

      const requiredHalfHeight =
        Math.max(

          targetY -
          shirtBottomY,

          modelSize.y *
          0.20

        ) *
        1.012;


      const verticalFOV =
        THREE.MathUtils.degToRad(
          camera.fov
        );


      let distance =
        requiredHalfHeight /
        Math.tan(
          verticalFOV /
          2
        );


      distance *=
        1.012;


      camera.position.set(

        targetX,

        targetY,

        distance

      );


      camera.lookAt(

        targetX,

        targetY,

        0

      );


      camera.near =
        Math.max(

          distance /
          120,

          0.01

        );


      camera.far =
        distance *
        100;


      camera.updateProjectionMatrix();

    }


    /* =====================================================
       BLINK
    ===================================================== */

    function setBlinkAmount(
      amount
    ) {

      const value =
        THREE.MathUtils.clamp(

          amount,

          0,

          1

        );


      for (
        const entry
        of blinkMeshes
      ) {

        const influences =
          entry
            .mesh
            .morphTargetInfluences;


        if (
          entry.left !==
          null
        ) {

          influences[
            entry.left
          ] =
            value;

        }


        if (
          entry.right !==
          null
        ) {

          influences[
            entry.right
          ] =
            value;

        }

      }

    }


    let blinkActive =
      false;


    let blinkStart =
      0;


    let blinkDuration =
      0.14;


    let nextBlink =
      Infinity;


    let doubleBlink =
      false;


    let secondBlinkAt =
      Infinity;


    function scheduleNextBlink() {

      nextBlink =
        performance.now() /
        1000 +
        2.4 +
        Math.random() *
        3.8;

    }


    function beginBlink() {

      blinkActive =
        true;


      blinkStart =
        performance.now() /
        1000;


      blinkDuration =
        0.12 +
        Math.random() *
        0.05;


      doubleBlink =
        Math.random() <
        0.10;

    }


    function updateBlink(
      now
    ) {

      if (
        !blinkActive &&
        now >= nextBlink
      ) {

        beginBlink();

      }


      if (
        !blinkActive &&
        doubleBlink &&
        now >= secondBlinkAt
      ) {

        doubleBlink =
          false;


        beginBlink();


        return;

      }


      if (
        !blinkActive
      ) {

        setBlinkAmount(
          0
        );


        return;

      }


      const progress =
        (
          now -
          blinkStart
        ) /
        blinkDuration;


      if (
        progress <= 1
      ) {

        setBlinkAmount(

          Math.sin(
            progress *
            Math.PI
          )

        );

      }

      else {

        setBlinkAmount(
          0
        );


        blinkActive =
          false;


        if (
          doubleBlink
        ) {

          secondBlinkAt =
            now +
            0.14 +
            Math.random() *
            0.08;

        }

        else {

          scheduleNextBlink();

        }

      }

    }


    /* =====================================================
       TRACKING
    ===================================================== */


    const eyeHorizontalMax =
      THREE.MathUtils.degToRad(
        12
      );


    const eyeUpMax =
      THREE.MathUtils.degToRad(
        7
      );


    const eyeDownMax =
      THREE.MathUtils.degToRad(
        11
      );


    /*
      Old version was ~5 degrees.
      This is about 13% higher.
    */

    const headHorizontalMax =
      THREE.MathUtils.degToRad(
        5.65
      );


    const headUpMax =
      THREE.MathUtils.degToRad(
        5
      );


    /*
      Down remains much stronger.
    */

    const headDownMax =
      THREE.MathUtils.degToRad(
        13
      );


    const neckHorizontalMax =
      THREE.MathUtils.degToRad(
        1.9
      );


    const neckUpMax =
      THREE.MathUtils.degToRad(
        1.8
      );


    const neckDownMax =
      THREE.MathUtils.degToRad(
        4.5
      );


    let eyeHorizontal =
      0;


    let eyeVertical =
      0;


    let headHorizontal =
      0;


    let headVertical =
      0;


    let neckHorizontal =
      0;


    let neckVertical =
      0;


    function damp(
      current,
      target,
      speed,
      delta
    ) {

      return THREE.MathUtils.lerp(

        current,

        target,

        1 -
        Math.exp(
          -speed *
          delta
        )

      );

    }


    function getVerticalTargets() {

      if (
        pointer.y >=
        0
      ) {

        return {

          eye:
            pointer.y *
            eyeUpMax,

          head:
            pointer.y *
            headUpMax,

          neck:
            pointer.y *
            neckUpMax

        };

      }


      const down =
        Math.abs(
          pointer.y
        );


      return {

        eye:
          -down *
          eyeDownMax,

        head:
          -down *
          headDownMax,

        neck:
          -down *
          neckDownMax

      };

    }


    /* =====================================================
       RELAXED ARM / SHOULDER POSE
    ===================================================== */


    /*
      The purchased model loads in an A-pose.

      We lower the upper arms toward the torso.
      These rotations are intentionally modest.
    */

    const ARM_DROP =
      THREE.MathUtils.degToRad(
        22
      );


    const ELBOW_RELAX =
      THREE.MathUtils.degToRad(
        6
      );


    const SHOULDER_DROP =
      THREE.MathUtils.degToRad(
        2.2
      );


    function applyRelaxedPose(
      now
    ) {

      /*
        Extremely subtle natural idle motion.
        The torso itself stays fixed.
      */

      const idle =
        Math.sin(
          now *
          0.72
        ) *
        THREE.MathUtils.degToRad(
          0.55
        );


      const idle2 =
        Math.sin(
          now *
          0.49 +
          1.3
        ) *
        THREE.MathUtils.degToRad(
          0.35
        );


      if (
        clavicleL &&
        baseClavicleLRotation
      ) {

        clavicleL.rotation.copy(
          baseClavicleLRotation
        );


        clavicleL.rotation.z -=
          SHOULDER_DROP;


        clavicleL.rotation.x +=
          idle2;

      }


      if (
        clavicleR &&
        baseClavicleRRotation
      ) {

        clavicleR.rotation.copy(
          baseClavicleRRotation
        );


        clavicleR.rotation.z +=
          SHOULDER_DROP;


        clavicleR.rotation.x -=
          idle2;

      }


      /*
        LEFT ARM DOWN
      */

      if (
        upperArmL &&
        baseUpperArmLRotation
      ) {

        upperArmL.rotation.copy(
          baseUpperArmLRotation
        );


        upperArmL.rotation.z -=
          ARM_DROP;


        upperArmL.rotation.x +=
          idle;

      }


      /*
        RIGHT ARM DOWN
      */

      if (
        upperArmR &&
        baseUpperArmRRotation
      ) {

        upperArmR.rotation.copy(
          baseUpperArmRRotation
        );


        upperArmR.rotation.z +=
          ARM_DROP;


        upperArmR.rotation.x -=
          idle;

      }


      /*
        Gentle elbow bend.
      */

      if (
        lowerArmL &&
        baseLowerArmLRotation
      ) {

        lowerArmL.rotation.copy(
          baseLowerArmLRotation
        );


        lowerArmL.rotation.z -=
          ELBOW_RELAX;

      }


      if (
        lowerArmR &&
        baseLowerArmRRotation
      ) {

        lowerArmR.rotation.copy(
          baseLowerArmRRotation
        );


        lowerArmR.rotation.z +=
          ELBOW_RELAX;

      }


      /*
        Keep wrists near their original orientation.
      */

      if (
        handL &&
        baseHandLRotation
      ) {

        handL.rotation.copy(
          baseHandLRotation
        );

      }


      if (
        handR &&
        baseHandRRotation
      ) {

        handR.rotation.copy(
          baseHandRRotation
        );

      }

    }


    /* =====================================================
       ANIMATION
    ===================================================== */

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(

          clock.getDelta(),

          0.05

        );


      const now =
        performance.now() /
        1000;


      /* =========================================
         POINTER
      ========================================= */

      pointer.x =
        damp(

          pointer.x,

          targetPointer.x,

          7.5,

          delta

        );


      pointer.y =
        damp(

          pointer.y,

          targetPointer.y,

          7.5,

          delta

        );


      const vertical =
        getVerticalTargets();


      /* =========================================
         EYES
      ========================================= */

      eyeHorizontal =
        damp(

          eyeHorizontal,

          pointer.x *
          eyeHorizontalMax,

          16,

          delta

        );


      eyeVertical =
        damp(

          eyeVertical,

          vertical.eye,

          16,

          delta

        );


      /* =========================================
         HEAD
      ========================================= */

      headHorizontal =
        damp(

          headHorizontal,

          pointer.x *
          headHorizontalMax,

          3.8,

          delta

        );


      headVertical =
        damp(

          headVertical,

          vertical.head,

          pointer.y <
            0
            ?
            4.6
            :
            3.25,

          delta

        );


      /* =========================================
         NECK
      ========================================= */

      neckHorizontal =
        damp(

          neckHorizontal,

          pointer.x *
          neckHorizontalMax,

          2.3,

          delta

        );


      neckVertical =
        damp(

          neckVertical,

          vertical.neck,

          pointer.y <
            0
            ?
            3.3
            :
            2.0,

          delta

        );


      /* =========================================
         EYE ROTATION
      ========================================= */

      if (
        eyeLObject &&
        baseEyeLRotation
      ) {

        eyeLObject.rotation.copy(
          baseEyeLRotation
        );


        eyeLObject.rotation.y +=
          eyeHorizontal;


        eyeLObject.rotation.x -=
          eyeVertical;

      }


      if (
        eyeRObject &&
        baseEyeRRotation
      ) {

        eyeRObject.rotation.copy(
          baseEyeRRotation
        );


        eyeRObject.rotation.y +=
          eyeHorizontal;


        eyeRObject.rotation.x -=
          eyeVertical;

      }


      /* =========================================
         HEAD

         Confirmed rig:
         X = horizontal
         Z = vertical
      ========================================= */

      if (
        headBone &&
        baseHeadRotation
      ) {

        headBone.rotation.copy(
          baseHeadRotation
        );


        headBone.rotation.x +=
          headHorizontal;


        headBone.rotation.z +=
          headVertical;


        headBone.rotation.y =
          baseHeadRotation.y;

      }


      /* =========================================
         NECK 02
      ========================================= */

      if (
        neck02 &&
        baseNeck02Rotation
      ) {

        neck02.rotation.copy(
          baseNeck02Rotation
        );


        neck02.rotation.x +=
          neckHorizontal;


        neck02.rotation.z +=
          neckVertical;


        neck02.rotation.y =
          baseNeck02Rotation.y;

      }


      /* =========================================
         NECK 01
      ========================================= */

      if (
        neck01 &&
        baseNeck01Rotation
      ) {

        neck01.rotation.copy(
          baseNeck01Rotation
        );


        neck01.rotation.x +=
          neckHorizontal *
          0.30;


        neck01.rotation.z +=
          neckVertical *
          0.28;


        neck01.rotation.y =
          baseNeck01Rotation.y;

      }


      /* =========================================
         RELAX ARMS / SHOULDERS
      ========================================= */

      applyRelaxedPose(
        now
      );


      /* =========================================
         SMILE
      ========================================= */

      applyRestingSmile();


      /* =========================================
         BLINK
      ========================================= */

      updateBlink(
        now
      );


      /* =========================================
         MOVING CYAN REFLECTION
      ========================================= */

      const waterTime =
        now *
        0.72;


      waterLightA.position.set(

        Math.sin(
          waterTime
        ) *
        1.3,

        0.35 +
        Math.sin(
          waterTime *
          1.8
        ) *
        0.42,

        1.45 +
        Math.cos(
          waterTime
        ) *
        0.50

      );


      waterLightB.position.set(

        Math.cos(
          waterTime *
          1.13
        ) *
        1.20,

        1.05 +
        Math.sin(
          waterTime *
          1.44 +
          1.7
        ) *
        0.44,

        1.15

      );


      waterLightC.position.set(

        Math.sin(
          waterTime *
          0.72 +
          2.2
        ) *
        1.5,

        -0.05 +
        Math.cos(
          waterTime *
          1.3
        ) *
        0.38,

        0.75

      );


      waterLightA.intensity =
        0.95 +
        (
          Math.sin(
            now *
            2.1
          ) *
          0.5 +
          0.5
        ) *
        0.52;


      waterLightB.intensity =
        0.65 +
        (
          Math.sin(
            now *
            2.65 +
            1.4
          ) *
          0.5 +
          0.5
        ) *
        0.42;


      waterLightC.intensity =
        0.38 +
        (
          Math.sin(
            now *
            1.9 +
            2.8
          ) *
          0.5 +
          0.5
        ) *
        0.34;


      /* =========================================
         EYE PULSE
      ========================================= */

      const eyePulse =
        (
          Math.sin(
            now *
            1.35
          ) *
          0.5 +
          0.5
        );


      eyeMaterial.emissiveIntensity =
        0.26 +
        eyePulse *
        0.10;


      lowerGlow.intensity =
        4.8 +
        eyePulse *
        0.8;


      /* =========================================
         PARTICLES
      ========================================= */

      if (
        backgroundParticles
      ) {

        backgroundParticles.rotation.y +=
          0.00009;

      }


      /* =========================================
         RENDER
      ========================================= */

      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =====================================================
       RESIZE
    ===================================================== */

    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );


        if (
          model
        ) {

          setupCamera();

        }

      }

    );

  </script>

</body>
