      function (
        event
      ) {

        let x =
          (
            event.clientX /
            window.innerWidth
          ) *
          2 -
          1;


        let y =
          -(
            (
              event.clientY /
              window.innerHeight
            ) *
            2 -
            1
          );


        const deadZone =
          0.045;


        if (
          Math.abs(
            x
          ) <
          deadZone
        ) {

          x =
            0;

        }


        if (
          Math.abs(
            y
          ) <
          deadZone
        ) {

          y =
            0;

        }


        x =
          Math.sign(
            x
          ) *
          Math.pow(
            Math.abs(
              x
            ),
            1.08
          );


        y =
          Math.sign(
            y
          ) *
          Math.pow(
            Math.abs(
              y
            ),
            1.05
          );


        targetPointer.set(

          THREE.MathUtils.clamp(
            x,
            -1,
            1
          ),

          THREE.MathUtils.clamp(
            y,
            -1,
            1
          )

        );

      }

    );

      V12 FACE EXPRESSION

      We drive the confirmed visible ARKit head mesh directly.
      Negative frown is intentional: it reinforces the upward
      corner movement without opening the mouth into a grin.
    */
    function setFaceMorph(
      name,
      value

      if (
        !faceMorphMesh ||
        !faceMorphMesh.morphTargetDictionary ||
        !faceMorphMesh.morphTargetInfluences

      const index =
        faceMorphMesh

    /* =====================================================
       LEGACY CHEST MASK (UNUSED IN V8)

       The purchased torso and shirt occupy almost the same
       surface around the chest. The skin-colored circles are
       the torso physically intersecting the shirt.

       We DO NOT inflate the shirt. Instead, we remove only the
       front torso triangles that sit underneath the shirt.
       Arms, hands, neck and the rest of the body stay intact.
    ===================================================== */

    function maskTorsoBehindShirt(
      torso,
      shirt
    ) {

      if (
        !torso ||
        !shirt ||
        !torso.geometry ||
        !shirt.geometry ||
        !torso.geometry.index
      ) {

        return;

      }


      const geometry =
        torso.geometry.clone();


      const position =
        geometry.attributes.position;


      const sourceIndex =
        geometry.index.array;


      shirt.geometry.computeBoundingBox();


      const shirtBox =
        shirt.geometry.boundingBox;


      /*
        The chest mask deliberately stops below the neck.
        It covers the front torso hidden by the shirt, including
        the exact nipple region around y ~= 1.23 in this GLB.
      */
      const minX =
        Math.max(
          shirtBox.min.x + 0.010,
          -0.205
        );


      const maxX =
        Math.min(
          shirtBox.max.x - 0.010,
          0.205
        );


      const minY =
        shirtBox.min.y +
        0.012;


      const maxY =
        Math.min(
          shirtBox.max.y - 0.065,
          1.342
        );


      /*
        Only the forward-facing half of the torso is removed.
        This avoids unnecessary changes to the back/body volume.
      */
      const minZ =
        0.015;


      const kept =
        [];


      function insideMask(
        vertexIndex
      ) {

        const x =
          position.getX(
            vertexIndex
          );

        const y =
          position.getY(
            vertexIndex
          );

        const z =
          position.getZ(
            vertexIndex
          );


        return (
          x > minX &&
          x < maxX &&
          y > minY &&
          y < maxY &&
          z > minZ
        );

      }


      for (
        let i = 0;
        i < sourceIndex.length;
        i += 3
      ) {

        const a =
          sourceIndex[i];

        const b =
          sourceIndex[i + 1];

        const c =
          sourceIndex[i + 2];


        const ax = position.getX(a);
        const ay = position.getY(a);
        const az = position.getZ(a);

        const bx = position.getX(b);
        const by = position.getY(b);
        const bz = position.getZ(b);

        const cx = position.getX(c);
        const cy = position.getY(c);
        const cz = position.getZ(c);


        const centerX =
          (ax + bx + cx) / 3;

        const centerY =
          (ay + by + cy) / 3;

        const centerZ =
          (az + bz + cz) / 3;


        const centerCovered = (
          centerX > minX &&
          centerX < maxX &&
          centerY > minY &&
          centerY < maxY &&
          centerZ > minZ
        );


        const vertexHits =
          Number(
            insideMask(a)
          ) +
          Number(
            insideMask(b)
          ) +
          Number(
            insideMask(c)
          );


        /*
          Dense topology means removing a triangle when its
          center OR at least two vertices are covered gives a
          clean hidden surface without affecting the arms.
        */
        if (
          centerCovered ||
          vertexHits >= 2
        ) {

          continue;

        }


        kept.push(
          a,
          b,
          c
        );

      }


      const IndexArray =
        sourceIndex.constructor;


      geometry.setIndex(
        new THREE.BufferAttribute(
          new IndexArray(kept),
          1
        )
      );


      geometry.computeBoundingSphere();


      torso.geometry =
        geometry;


      torso.renderOrder =
        0;


      shirt.renderOrder =
        1;


      torso.material.depthWrite =
        true;


      shirt.material.depthWrite =
        true;


      console.log(
        'LEGACY CHEST MASK (UNUSED IN V8):',
        sourceIndex.length / 3,
        'triangles ->',
        kept.length / 3
      );

    }


    /* =====================================================
       V7 RELAXED ARM TARGETS

       Old versions rotated Euler Z, but this skeleton's local
       arm axes do not correspond to screen/world Z. Therefore
       those rotations barely changed the pose.

       V7 computes an actual WORLD-SPACE arm direction and
       converts it back to the bone's local quaternion.
    ===================================================== */

    function makeBoneDirectionTarget(
      bone,
      child,
      targetDirection
    ) {

      if (
        !bone ||
        !child ||
        !bone.parent
      ) {

        return null;

      }


      model.updateMatrixWorld(
        true
      );


      const bonePosition =
        new THREE.Vector3();


      const childPosition =
        new THREE.Vector3();


      bone.getWorldPosition(
        bonePosition
      );


      child.getWorldPosition(
        childPosition
      );


      const currentDirection =
        childPosition
          .sub(
            bonePosition
          )
          .normalize();


      const desiredDirection =
        targetDirection
          .clone()
          .normalize();


      const directionDelta =
        new THREE.Quaternion()
          .setFromUnitVectors(
            currentDirection,
            desiredDirection
          );


      const currentWorldQuaternion =
        new THREE.Quaternion();


      bone.getWorldQuaternion(
        currentWorldQuaternion
      );


      const desiredWorldQuaternion =
        directionDelta
          .clone()
          .multiply(
            currentWorldQuaternion
          );


      const parentWorldQuaternion =
        new THREE.Quaternion();


      bone.parent.getWorldQuaternion(
        parentWorldQuaternion
      );


      return parentWorldQuaternion
        .invert()
        .multiply(
          desiredWorldQuaternion
        );

    }


    function configureRelaxedArms() {

      /*
        Close to vertical, but not glued to the body.
        Positive Z gives a slight natural forward hang.
      */
      relaxedUpperArmLQuaternion =
        makeBoneDirectionTarget(

          lowerArmL,

            value;

      false;


    let blinkStart =
      0;


    let blinkDuration =
      0.14;


    let nextBlink =
      Infinity;


    let doubleBlink =
      false;


    let secondBlinkAt =
      Infinity;


    function scheduleNextBlink() {

      nextBlink =
        performance.now() /
        1000 +
        2.4 +
        Math.random() *
        3.8;

    }


    function beginBlink() {

      blinkActive =
        true;


      blinkStart =
        performance.now() /
        1000;


      blinkDuration =
        0.12 +
        Math.random() *
        0.05;


      doubleBlink =
        Math.random() <
        0.10;

    }


    function updateBlink(
      now
    ) {

      if (
        !blinkActive &&
        now >= nextBlink

        beginBlink();

      }


      if (
        !blinkActive &&
        doubleBlink &&
        now >= secondBlinkAt

        doubleBlink =
          false;

        return;

      if (

      const progress =

          blinkStart

        blinkDuration;

            progress *
            Math.PI

          doubleBlink

      0;

      performance.now() /
      1000 +
      8 +

      8;


    function smooth01(
      value
    ) {

      const x =
        THREE.MathUtils.clamp(
          value,
          0,
          1

      return x * x *
        (
          3 -
          2 * x
        );

      now

        now +
        24 +
        Math.random() *
        32;

      now

        !swallowActive &&
        now >= nextSwallow

        beginSwallow(
          now

      if (
        !swallowActive

        swallowStrength =
          0;


        return;

      const progress =
        (
          now -
          swallowStart
        ) /
        SWALLOW_DURATION;


      if (
        progress >= 1
      ) {

        swallowActive =
          false;


        swallowStrength =
          0;


        scheduleNextSwallow(
          now
        );


        return;

      }


      if (
        progress < 0.30

        swallowStrength =
          smooth01(
            progress /
            0.30
          );

      }

      else if (
        progress < 0.58
      ) {

        swallowStrength =
          1;

      }

            0.42

        headBone.rotation.z +=
          headVertical +
          THREE.MathUtils.degToRad(
            -0.85
          ) *
          swallowStrength;


        headBone.rotation.y =
          baseHeadRotation.y;

      }


      /* =========================================
         NECK 02
      ========================================= */

      if (
        neck02 &&
        baseNeck02Rotation
      ) {

        neck02.rotation.copy(
          baseNeck02Rotation
        );


        neck02.rotation.x +=
          neckHorizontal;


        neck02.rotation.z +=
          neckVertical +
          THREE.MathUtils.degToRad(
            -0.55
          ) *
          swallowStrength;


        neck02.rotation.y =
          baseNeck02Rotation.y;

      }


      /* =========================================
         NECK 01
      ========================================= */

      if (
        neck01 &&
        baseNeck01Rotation
      ) {

        neck01.rotation.copy(
          baseNeck01Rotation
        );


        neck01.rotation.x +=
          neckHorizontal *
          0.30;


        neck01.rotation.z +=
          neckVertical *
          0.28 +
          THREE.MathUtils.degToRad(
            -0.20
          ) *
          swallowStrength;


        neck01.rotation.y =
          baseNeck01Rotation.y;

      }


      /* =========================================
         RELAX ARMS / SHOULDERS
      ========================================= */

      applyRelaxedPose(
        now
      );


      /* =========================================
         SMILE
      ========================================= */

      applyRestingSmile();


      applySwallowExpression();


      /* =========================================
         BLINK
      ========================================= */

      updateBlink(
        now
      );
/* =========================================
         EYE PULSE
      ========================================= */

      const eyePulse =
        (
          Math.sin(
            now *
            1.35
          ) *
          0.5 +
          0.5
        );


      eyeMaterial.emissiveIntensity =
        0.26 +
        eyePulse *
        0.10;


      lowerGlow.intensity =
        4.8 +
        eyePulse *
        0.8;
/* =========================================
         RENDER
      ========================================= */

      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =====================================================
       RESIZE
    ===================================================== */

    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );


        if (
          model
        ) {

          setupCamera();

        }

      }

    );

  </script>

</body>
</html>
