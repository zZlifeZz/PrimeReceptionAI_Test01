<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prime Reception AI — Character Gestures V9</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 50% 43%,
          #081c27 0%,
          #04121a 29%,
          #02080d 57%,
          #000 100%
        );
    }

    #stage::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 4;

      pointer-events: none;

      opacity: 0.025;

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 5px,
          rgba(40, 212, 255, 0.14) 6px,
          transparent 7px
        );

      animation:
        scanMove 14s linear infinite;
    }

    @keyframes scanMove {
      from {
        background-position-y: 0;
      }

      to {
        background-position-y: 240px;
      }
    }

    #stage::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 5;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 37%,
          rgba(0, 0, 0, 0.08) 61%,
          rgba(0, 0, 0, 0.80) 100%
        );
    }

    #stage canvas {
      position: relative;
      z-index: 1;

      display: block;

      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;

      z-index: 20;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      color:
        #55dfff;

      font-family:
        Arial,
        sans-serif;

      font-size:
        14px;

      letter-spacing:
        0.11em;

      white-space:
        nowrap;

      pointer-events:
        none;
    }


    /* =====================================================
       PRIME PROJECTION EFFECTS
    ===================================================== */

    #projectionFx {
      display: none !important;
      position: absolute;
      left: 50%;
      bottom: -42px;
      width: min(720px, 78vw);
      height: 185px;
      transform: translateX(-50%);
      z-index: 3;
      pointer-events: none;
      overflow: visible;
      opacity: 0;
      transition: opacity 0.8s ease;
      filter: saturate(1.08);
    }

    #projectionFx.ready {
      opacity: 1;
    }

    #projectionFx .projection-glow {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 72%;
      height: 98px;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(
          ellipse at center,
          rgba(64, 226, 255, 0.28) 0%,
          rgba(15, 180, 224, 0.14) 30%,
          rgba(0, 108, 145, 0.05) 52%,
          transparent 72%
        );
      filter: blur(12px);
      animation: projectionGlowPulse 4.6s ease-in-out infinite;
    }

    #projectionFx .projection-core {
      position: absolute;
      left: 50%;
      bottom: 38px;
      width: 54%;
      height: 10px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(75, 232, 255, 0.56);
      box-shadow:
        0 0 12px rgba(63, 224, 255, 0.60),
        0 0 34px rgba(19, 177, 221, 0.38),
        0 0 70px rgba(10, 118, 155, 0.20);
      filter: blur(1.5px);
      opacity: 0.72;
    }

    #projectionFx .ring {
      position: absolute;
      left: 50%;
      bottom: 31px;
      width: 48%;
      height: 52px;
      transform: translateX(-50%) scale(0.65);
      border: 1px solid rgba(74, 229, 255, 0.66);
      border-radius: 50%;
      opacity: 0;
      box-shadow:
        0 0 8px rgba(54, 219, 255, 0.25),
        inset 0 0 8px rgba(54, 219, 255, 0.12);
      animation: projectionRing 5.8s ease-out infinite;
    }

    #projectionFx .ring.r2 {
      animation-delay: 1.9s;
    }

    #projectionFx .ring.r3 {
      animation-delay: 3.8s;
    }

    #projectionParticles {
      position: absolute;
      inset: 0;
      overflow: visible;
    }

    #projectionParticles i {
      position: absolute;
      left: var(--x);
      bottom: 42px;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: rgba(92, 235, 255, 0.90);
      box-shadow: 0 0 7px rgba(49, 222, 255, 0.58);
      opacity: 0;
      animation: particleRise var(--duration) linear var(--delay) infinite;
    }

    #characterAura {
      position: absolute;
      z-index: 0;
      left: 50%;
      top: 46%;
      width: min(620px, 62vw);
      height: min(760px, 80vh);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          rgba(8, 109, 139, 0.10) 0%,
          rgba(5, 69, 92, 0.055) 42%,
          transparent 70%
        );
      filter: blur(20px);
      animation: auraPulse 6.5s ease-in-out infinite;
    }

    #holoSweep {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 8%;
      width: min(520px, 48vw);
      height: 110px;
      transform: translateX(-50%);
      pointer-events: none;
      opacity: 0;
      background:
        linear-gradient(
          to bottom,
          transparent 0%,
          rgba(91, 228, 255, 0.015) 32%,
          rgba(91, 228, 255, 0.085) 50%,
          rgba(91, 228, 255, 0.015) 68%,
          transparent 100%
        );
      filter: blur(5px);
      animation: holoSweepMove 11s ease-in-out infinite;
    }

    @keyframes projectionGlowPulse {
      0%, 100% {
        opacity: 0.64;
        transform: translateX(-50%) scaleX(0.96) scaleY(0.94);
      }
      50% {
        opacity: 0.92;
        transform: translateX(-50%) scaleX(1.05) scaleY(1.02);
      }
    }

    @keyframes projectionRing {
      0% {
        transform: translateX(-50%) scale(0.60);
        opacity: 0;
      }
      13% {
        opacity: 0.68;
      }
      72% {
        opacity: 0.16;
      }
      100% {
        transform: translateX(-50%) scale(1.55);
        opacity: 0;
      }
    }

    @keyframes particleRise {
      0% {
        transform: translate3d(0, 0, 0) scale(0.65);
        opacity: 0;
      }
      14% {
        opacity: 0.70;
      }
      72% {
        opacity: 0.30;
      }
      100% {
        transform: translate3d(var(--drift), -128px, 0) scale(0.15);
        opacity: 0;
      }
    }

    @keyframes auraPulse {
      0%, 100% {
        opacity: 0.52;
        transform: translate(-50%, -50%) scale(0.98);
      }
      50% {
        opacity: 0.82;
        transform: translate(-50%, -50%) scale(1.03);
      }
    }

    @keyframes holoSweepMove {
      0%, 68% {
        top: 8%;
        opacity: 0;
      }
      72% {
        opacity: 0.22;
      }
      82% {
        opacity: 0.36;
      }
      93% {
        top: 80%;
        opacity: 0.08;
      }
      100% {
        top: 80%;
        opacity: 0;
      }
    }

    @media (max-width: 800px) {
      #projectionFx {
        width: 92vw;
        bottom: -48px;
      }

      #holoSweep {
        width: 70vw;
      }
    }



    /* V7: all decorative VFX disabled while character geometry is corrected */
    #projectionFx {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    #stage::before {
      display: none !important;
    }

  </style>
</head>


<body>

  <div id="stage">

    <div id="characterAura"></div>
    <div id="holoSweep"></div>

    <div id="projectionFx">
      <div class="projection-glow"></div>
      <div class="projection-core"></div>
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div id="projectionParticles"></div>
    </div>

    <div id="status">
      INITIALIZING PRIME RECEPTION AI…
    </div>

  </div>


  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <script type="module">

    import * as THREE from 'three';

    import {
      GLTFLoader
    } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


    /* =====================================================
       DOM
    ===================================================== */

    const stage =
      document.getElementById(
        'stage'
      );


    const status =
      document.getElementById(
        'status'
      );


    const projectionFx =
      document.getElementById(
        'projectionFx'
      );


    const projectionParticles =
      document.getElementById(
        'projectionParticles'
      );


    /* =====================================================
       SCENE
    ===================================================== */

    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(

        30,

        window.innerWidth /
        window.innerHeight,

        0.01,

        1000

      );


    const renderer =
      new THREE.WebGLRenderer({

        antialias:
          true,

        alpha:
          true

      });


    renderer.setPixelRatio(

      Math.min(

        window.devicePixelRatio ||
        1,

        2

      )

    );


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      1.04;


    renderer.setClearColor(

      0x000000,

      0

    );


    stage.appendChild(
      renderer.domElement
    );


    /* =====================================================
       LIGHTING
    ===================================================== */


    /*
      Neutral ambient.
    */

    const ambient =
      new THREE.HemisphereLight(

        0xffeee3,

        0x020607,

        0.88

      );


    scene.add(
      ambient
    );


    /*
      Warm human-skin key light.
    */

    const keyLight =
      new THREE.DirectionalLight(

        0xffdbc7,

        2.35

      );


    keyLight.position.set(

      1.4,

      4.0,

      5.6

    );


    scene.add(
      keyLight
    );


    /*
      Gentle frontal fill.
    */

    const frontFill =
      new THREE.PointLight(

        0xffe1d2,

        0.85,

        6

      );


    frontFill.position.set(

      -0.6,

      1.6,

      3.3

    );


    scene.add(
      frontFill
    );


    /*
      Cyan left rim.
    */

    const cyanLeft =
      new THREE.DirectionalLight(

        0x10d8ff,

        4.3

      );


    cyanLeft.position.set(

      -4.5,

      3.7,

      -3.8

    );


    scene.add(
      cyanLeft
    );


    /*
      Cyan right rim.
    */

    const cyanRight =
      new THREE.DirectionalLight(

        0x51e8ff,

        2.4

      );


    cyanRight.position.set(

      4.4,

      3.1,

      -3.1

    );


    scene.add(
      cyanRight
    );


    /*
      Very subtle warm accent.
    */

    const warmAccent =
      new THREE.DirectionalLight(

        0xffb56b,

        0.72

      );


    warmAccent.position.set(

      3.2,

      2.5,

      3.2

    );


    scene.add(
      warmAccent
    );


    /*
      Cyan illumination from below.
    */

    const lowerGlow =
      new THREE.PointLight(

        0x0bdcff,

        5.3,

        6

      );


    lowerGlow.position.set(

      0,

      -0.85,

      1.4

    );


    scene.add(
      lowerGlow
    );


    /* =====================================================
       MOVING HOLOGRAPHIC / WATER REFLECTION LIGHTS
    ===================================================== */

    const waterLightA =
      new THREE.PointLight(

        0x00d8ff,

        1.15,

        4

      );


    scene.add(
      waterLightA
    );


    const waterLightB =
      new THREE.PointLight(

        0x45e7ff,

        0.85,

        4

      );


    scene.add(
      waterLightB
    );


    const waterLightC =
      new THREE.PointLight(

        0x007ea8,

        0.55,

        3.5

      );


    scene.add(
      waterLightC
    );


    /* =====================================================
       MATERIALS
    ===================================================== */


    /*
      BRONZE / OLIVE HUMAN SKIN

      Warm enough to contrast beautifully with:
      - black hair
      - black clothing
      - cyan eyes / lighting
    */

    const bodyMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x9f684f
          ),

        emissive:
          new THREE.Color(
            0x080706
          ),

        emissiveIntensity:
          0.012,

        metalness:
          0.0,

        roughness:
          0.49,

        clearcoat:
          0.08,

        clearcoatRoughness:
          0.48,

        sheen:
          0.06,

        sheenColor:
          new THREE.Color(
            0xd89a7d
          )

      });


    /*
      Face slightly lighter than body.
    */

    const faceMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xb7795c
          ),

        emissive:
          new THREE.Color(
            0x060504
          ),

        emissiveIntensity:
          0.008,

        metalness:
          0.0,

        roughness:
          0.48,

        clearcoat:
          0.075,

        clearcoatRoughness:
          0.48,

        sheen:
          0.065,

        sheenColor:
          new THREE.Color(
            0xe2a58b
          )

      });


    /*
      MATTE BLACK SHIRT

      Deliberately NOT latex/chrome.
    */

    const shirtMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x080a0c
          ),

        emissive:
          new THREE.Color(
            0x00090c
          ),

        emissiveIntensity:
          0.018,

        metalness:
          0.08,

        roughness:
          0.60,

        clearcoat:
          0.06,

        clearcoatRoughness:
          0.65,

        sheen:
          0.11,

        sheenColor:
          new THREE.Color(
            0x14434d
          )

      });


    /*
      Black lower garment.
    */

    const leggingsMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x050607
          ),

        emissive:
          new THREE.Color(
            0x000709
          ),

        emissiveIntensity:
          0.012,

        metalness:
          0.07,

        roughness:
          0.57,

        clearcoat:
          0.07,

        clearcoatRoughness:
          0.60

      });


    /*
      Hair.
    */

    const hairMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x020304
          ),

        emissive:
          new THREE.Color(
            0x00141a
          ),

        emissiveIntensity:
          0.085,

        metalness:
          0.11,

        roughness:
          0.37,

        clearcoat:
          0.24,

        clearcoatRoughness:
          0.29

      });


    /*
      BLUE GLOWING EYES
    */

    const eyeMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x76d7f3
          ),

        emissive:
          new THREE.Color(
            0x00bfff
          ),

        emissiveIntensity:
          0.32,

        metalness:
          0,

        roughness:
          0.13,

        clearcoat:
          1,

        clearcoatRoughness:
          0.035

      });


    const eyeShellMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xd8faff
          ),

        emissive:
          new THREE.Color(
            0x006d91
          ),

        emissiveIntensity:
          0.08,

        transparent:
          true,

        opacity:
          0.16,

        roughness:
          0.07,

        clearcoat:
          1

      });


    const darkDetailMaterial =
      new THREE.MeshStandardMaterial({

        color:
          new THREE.Color(
            0x010101
          ),

        roughness:
          0.47

      });


    const teethMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xf3ebe6
          ),

        metalness:
          0,

        roughness:
          0.35,

        clearcoat:
          0.08

      });


    const nailMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xb98672
          ),

        metalness:
          0,

        roughness:
          0.42,

        clearcoat:
          0.22

      });


    /* =====================================================
       MATERIAL HELPER
    ===================================================== */

    function forceCleanMaterial(
      object,
      material
    ) {

      object.material =
        material;


      material.map =
        null;


      material.normalMap =
        null;


      material.roughnessMap =
        null;


      material.metalnessMap =
        null;


      material.aoMap =
        null;


      material.emissiveMap =
        null;


      material.alphaMap =
        null;


      material.lightMap =
        null;


      material.displacementMap =
        null;


      material.vertexColors =
        false;


      material.needsUpdate =
        true;

    }


    /* =====================================================
       MODEL REFERENCES
    ===================================================== */

    let model =
      null;


    let modelSize =
      null;


    let shirtMesh =
      null;


    let torsoMesh =
      null;


    let faceMorphMesh =
      null;


    let headBone =
      null;


    let neck01 =
      null;


    let neck02 =
      null;


    let eyeLObject =
      null;


    let eyeRObject =
      null;


    /*
      Arm bones.
    */

    let clavicleL =
      null;


    let clavicleR =
      null;


    let upperArmL =
      null;


    let upperArmR =
      null;


    let lowerArmL =
      null;


    let lowerArmR =
      null;


    let handL =
      null;


    let handR =
      null;


    /*
      Fingertip references used by the procedural gesture IK.
      The index fingertip gives us a natural contact point for
      hair/temple touches instead of aiming the wrist at the face.
    */

    let indexTipL =
      null;


    let indexTipR =
      null;


    /*
      Base rotations.
    */

    let baseHeadRotation =
      null;


    let baseNeck01Rotation =
      null;


    let baseNeck02Rotation =
      null;


    let baseEyeLRotation =
      null;


    let baseEyeRRotation =
      null;


    let baseClavicleLRotation =
      null;


    let baseClavicleRRotation =
      null;


    let baseUpperArmLRotation =
      null;


    let baseUpperArmRRotation =
      null;


    let baseLowerArmLRotation =
      null;


    let baseLowerArmRRotation =
      null;


    let baseHandLRotation =
      null;


    let baseHandRRotation =
      null;


    let relaxedUpperArmLQuaternion =
      null;


    let relaxedUpperArmRQuaternion =
      null;


    const blinkMeshes =
      [];


    const smileMeshes =
      [];


    /* =====================================================
       POINTER
    ===================================================== */

    const pointer =
      new THREE.Vector2(
        0,
        0
      );


    const targetPointer =
      new THREE.Vector2(
        0,
        0
      );


    window.addEventListener(

      'pointermove',

      function (
        event
      ) {

        let x =
          (
            event.clientX /
            window.innerWidth
          ) *
          2 -
          1;


        let y =
          -(
            (
              event.clientY /
              window.innerHeight
            ) *
            2 -
            1
          );


        const deadZone =
          0.045;


        if (
          Math.abs(
            x
          ) <
          deadZone
        ) {

          x =
            0;

        }


        if (
          Math.abs(
            y
          ) <
          deadZone
        ) {

          y =
            0;

        }


        x =
          Math.sign(
            x
          ) *
          Math.pow(
            Math.abs(
              x
            ),
            1.08
          );


        y =
          Math.sign(
            y
          ) *
          Math.pow(
            Math.abs(
              y
            ),
            1.05
          );


        targetPointer.set(

          THREE.MathUtils.clamp(
            x,
            -1,
            1
          ),

          THREE.MathUtils.clamp(
            y,
            -1,
            1
          )

        );

      }

    );


    document.documentElement.addEventListener(

      'mouseleave',

      function () {

        targetPointer.set(
          0,
          0
        );

      }

    );


    /* =====================================================
       FACIAL MORPHS
    ===================================================== */


    /*
      These names are confirmed to exist in the GLB:

      mouthSmileLeft
      mouthSmileRight
      cheekSquintLeft
      cheekSquintRight
    */

    function registerFacialMorphs(
      object
    ) {

      if (
        !object.morphTargetDictionary ||
        !object.morphTargetInfluences
      ) {

        return;

      }


      const d =
        object.morphTargetDictionary;


      /* -----------------------------------------
         Blink
      ----------------------------------------- */

      const blinkLeft =
        d.eyeBlinkLeft !== undefined
          ?
          d.eyeBlinkLeft
          :
          null;


      const blinkRight =
        d.eyeBlinkRight !== undefined
          ?
          d.eyeBlinkRight
          :
          null;


      if (
        blinkLeft !==
          null
        ||
        blinkRight !==
          null
      ) {

        blinkMeshes.push({

          mesh:
            object,

          left:
            blinkLeft,

          right:
            blinkRight

        });

      }


      /* -----------------------------------------
         Smile
      ----------------------------------------- */

      const smileLeft =
        d.mouthSmileLeft !== undefined
          ?
          d.mouthSmileLeft
          :
          null;


      const smileRight =
        d.mouthSmileRight !== undefined
          ?
          d.mouthSmileRight
          :
          null;


      const cheekLeft =
        d.cheekSquintLeft !== undefined
          ?
          d.cheekSquintLeft
          :
          null;


      const cheekRight =
        d.cheekSquintRight !== undefined
          ?
          d.cheekSquintRight
          :
          null;

      const dimpleLeft =
        d.mouthDimpleLeft !== undefined ? d.mouthDimpleLeft : null;

      const dimpleRight =
        d.mouthDimpleRight !== undefined ? d.mouthDimpleRight : null;


      if (
        smileLeft !==
          null
        ||
        smileRight !==
          null
      ) {

        smileMeshes.push({

          mesh:
            object,

          left:
            smileLeft,

          right:
            smileRight,

          cheekLeft:
            cheekLeft,

          cheekRight:
            cheekRight,

          dimpleLeft:
            dimpleLeft,

          dimpleRight:
            dimpleRight

        });

      }

    }


    /*
      Much stronger than previous 0.28.

      Still below a full smile.

    /* =====================================================
       LEGACY CHEST MASK (UNUSED IN V8)

       The purchased torso and shirt occupy almost the same
       surface around the chest. The skin-colored circles are
       the torso physically intersecting the shirt.

       We DO NOT inflate the shirt. Instead, we remove only the
       front torso triangles that sit underneath the shirt.
       Arms, hands, neck and the rest of the body stay intact.
    ===================================================== */

    function maskTorsoBehindShirt(
      torso,
      shirt
    ) {

      if (
        !torso ||
        !shirt ||
        !torso.geometry ||
        !shirt.geometry ||
        !torso.geometry.index
      ) {

        return;

      }


      const geometry =
        torso.geometry.clone();


      const position =
        geometry.attributes.position;


      const sourceIndex =
        geometry.index.array;


      shirt.geometry.computeBoundingBox();


      const shirtBox =
        shirt.geometry.boundingBox;


      /*
        The chest mask deliberately stops below the neck.
        It covers the front torso hidden by the shirt, including
        the exact nipple region around y ~= 1.23 in this GLB.
      */
      const minX =
        Math.max(
          shirtBox.min.x + 0.010,
          -0.205
        );


      const maxX =
        Math.min(
          shirtBox.max.x - 0.010,
          0.205
        );


      const minY =
        shirtBox.min.y +
        0.012;


      const maxY =
        Math.min(
          shirtBox.max.y - 0.065,
          1.342
        );


      /*
        Only the forward-facing half of the torso is removed.
        This avoids unnecessary changes to the back/body volume.
      */
      const minZ =
        0.015;


      const kept =
        [];


      function insideMask(
        vertexIndex
      ) {

        const x =
          position.getX(
            vertexIndex
          );

        const y =
          position.getY(
            vertexIndex
          );

        const z =
          position.getZ(
            vertexIndex
          );


        return (
          x > minX &&
          x < maxX &&
          y > minY &&
          y < maxY &&
          z > minZ
        );

      }


      for (
        let i = 0;
        i < sourceIndex.length;
        i += 3
      ) {

        const a =
          sourceIndex[i];

        const b =
          sourceIndex[i + 1];

        const c =
          sourceIndex[i + 2];


        const ax = position.getX(a);
        const ay = position.getY(a);
        const az = position.getZ(a);

        const bx = position.getX(b);
        const by = position.getY(b);
        const bz = position.getZ(b);

        const cx = position.getX(c);
        const cy = position.getY(c);
        const cz = position.getZ(c);


        const centerX =
          (ax + bx + cx) / 3;

        const centerY =
          (ay + by + cy) / 3;

        const centerZ =
          (az + bz + cz) / 3;


        const centerCovered = (
          centerX > minX &&
          centerX < maxX &&
          centerY > minY &&
          centerY < maxY &&
          centerZ > minZ
        );


        const vertexHits =
          Number(
            insideMask(a)
          ) +
          Number(
            insideMask(b)
          ) +
          Number(
            insideMask(c)
          );


        /*
          Dense topology means removing a triangle when its
          center OR at least two vertices are covered gives a
          clean hidden surface without affecting the arms.
        */
        if (
          centerCovered ||
          vertexHits >= 2
        ) {

          continue;

        }


        kept.push(
          a,
          b,
          c
        );

      }


      const IndexArray =
        sourceIndex.constructor;


      geometry.setIndex(
        new THREE.BufferAttribute(
          new IndexArray(kept),
          1
        )
      );


      geometry.computeBoundingSphere();


      torso.geometry =
        geometry;


      torso.renderOrder =
        0;


      shirt.renderOrder =
        1;


      torso.material.depthWrite =
        true;


      shirt.material.depthWrite =
        true;


      console.log(
        'LEGACY CHEST MASK (UNUSED IN V8):',
        sourceIndex.length / 3,
        'triangles ->',
        kept.length / 3
      );

    }


    /* =====================================================
       V7 RELAXED ARM TARGETS

       Old versions rotated Euler Z, but this skeleton's local
       arm axes do not correspond to screen/world Z. Therefore
       those rotations barely changed the pose.

       V7 computes an actual WORLD-SPACE arm direction and
       converts it back to the bone's local quaternion.
    ===================================================== */

    function makeBoneDirectionTarget(
      bone,
      child,
      targetDirection
    ) {

      if (
        !bone ||
        !child ||
        !bone.parent
      ) {

        return null;

      }


      model.updateMatrixWorld(
        true
      );


      const bonePosition =
        new THREE.Vector3();


      const childPosition =
        new THREE.Vector3();


      bone.getWorldPosition(
        bonePosition
      );


      child.getWorldPosition(
        childPosition
      );


      const currentDirection =
        childPosition
          .sub(
            bonePosition
          )
          .normalize();


      const desiredDirection =
        targetDirection
          .clone()
          .normalize();


      const directionDelta =
        new THREE.Quaternion()
          .setFromUnitVectors(
            currentDirection,
            desiredDirection
          );


      const currentWorldQuaternion =
        new THREE.Quaternion();


      bone.getWorldQuaternion(
        currentWorldQuaternion
      );


      const desiredWorldQuaternion =
        directionDelta
          .clone()
          .multiply(
            currentWorldQuaternion
          );


      const parentWorldQuaternion =
        new THREE.Quaternion();


      bone.parent.getWorldQuaternion(
        parentWorldQuaternion
      );


      return parentWorldQuaternion
        .invert()
        .multiply(
          desiredWorldQuaternion
        );

    }

      camera.near =

        THREE.MathUtils.clamp(

          amount,

          0,

          1

        );


      for (
        const entry
        of blinkMeshes
      ) {

        const influences =
          entry
            .mesh
            .morphTargetInfluences;


        if (
          entry.left !==
          null
        ) {

          influences[
            entry.left
          ] =
            value;

        }


        if (
          entry.right !==
          null
        ) {

          influences[
            entry.right
          ] =
            value;

        }

      }

    }


    let blinkActive =
      false;


    let blinkStart =
      0;


    let blinkDuration =
      0.14;


    let nextBlink =
      Infinity;


    let doubleBlink =
      false;


    let secondBlinkAt =
      Infinity;


    function scheduleNextBlink() {

      nextBlink =
        performance.now() /
        1000 +
        2.4 +
        Math.random() *
        3.8;

    }


    function beginBlink() {

      blinkActive =
        true;


      blinkStart =
        performance.now() /
        1000;


      blinkDuration =
        0.12 +
        Math.random() *
        0.05;


      doubleBlink =
        Math.random() <
        0.10;

    }


    function updateBlink(
      now
    ) {

      if (
        !blinkActive &&
        now >= nextBlink
      ) {

        beginBlink();

      }


      if (
        !blinkActive &&
        doubleBlink &&
        now >= secondBlinkAt
      ) {

        doubleBlink =
          false;


        beginBlink();


        return;

      }


      if (
        !blinkActive
      ) {

        setBlinkAmount(
          0
        );


        return;

      }


      const progress =
        (
          now -
          blinkStart
        ) /
        blinkDuration;


      if (
        progress <= 1
      ) {

        setBlinkAmount(

          Math.sin(
            progress *
            Math.PI
          )

        );

      }

      else {

        setBlinkAmount(
          0
        );


        blinkActive =
          false;


        if (
          doubleBlink
        ) {

          secondBlinkAt =
            now +
            0.14 +
            Math.random() *
            0.08;

        }

        else {

          scheduleNextBlink();

        }

      }

    }

       TRACKING

    const eyeHorizontalMax =
      THREE.MathUtils.degToRad(
        12
      );


    const eyeUpMax =
      THREE.MathUtils.degToRad(
        7
      );


    const eyeDownMax =
      THREE.MathUtils.degToRad(
        11
      );


    /*
      Old version was ~5 degrees.
      This is about 13% higher.
    */

    const headHorizontalMax =
      THREE.MathUtils.degToRad(
        5.65
      );


    const headUpMax =
      THREE.MathUtils.degToRad(
        5
      );


    /*
      Down remains much stronger.
    */

    const headDownMax =
      THREE.MathUtils.degToRad(
        13
      );


    const neckHorizontalMax =
      THREE.MathUtils.degToRad(
        1.9
      );


    const neckUpMax =
      THREE.MathUtils.degToRad(
        1.8
      );


    const neckDownMax =
      THREE.MathUtils.degToRad(
        4.5
      );

      0;


    let eyeVertical =
      0;


    let headHorizontal =
      0;


    let headVertical =
      0;


    let neckHorizontal =

    let neckVertical =

    function damp(
      current,
      target,
      speed,
      delta

      return THREE.MathUtils.lerp(

        )

    function getVerticalTargets() {

      if (
        pointer.y >=

          eye:
            pointer.y *
            eyeUpMax,

          head:
            pointer.y *
            headUpMax,

          neck:
            pointer.y *
            neckUpMax

      }


      const down =
        Math.abs(

      return {

       RELAXED ARM / SHOULDER POSE
    ===================================================== */


    /*
      The purchased model loads in an A-pose.

      We lower the upper arms toward the torso.
      These rotations are intentionally modest.
    */

    function applyRelaxedPose(
      now
    ) {

      /*
        The main relaxation is quaternion-based and therefore
        follows the real bone orientation instead of assuming
        a local Euler axis.
      */
      if (
        upperArmL &&
        relaxedUpperArmLQuaternion
      ) {

        upperArmL.quaternion.copy(
          relaxedUpperArmLQuaternion
        );

      }


      if (
        upperArmR &&
        relaxedUpperArmRQuaternion
      ) {

        upperArmR.quaternion.copy(
          relaxedUpperArmRQuaternion
        );

      }


      /*
        Forearms and wrists retain the purchased rig's authored
        local bend. Because they inherit the new upper-arm
        direction, the hands naturally hang much closer to the
        sides instead of remaining in the statue/A-pose.
      */
      if (
        lowerArmL &&
        baseLowerArmLRotation
      ) {

        lowerArmL.rotation.copy(
          baseLowerArmLRotation
        );

      }


      if (
        lowerArmR &&
        baseLowerArmRRotation
      ) {

        lowerArmR.rotation.copy(
          baseLowerArmRRotation
        );

      }


      if (
        handL &&
        baseHandLRotation
      ) {

        handL.rotation.copy(
          baseHandLRotation
        );

      }


      if (
        handR &&
        baseHandRRotation
      ) {

        handR.rotation.copy(
          baseHandRRotation
        );

      }


      /*
        Always restore every finger to the purchased rig's base pose
        before an optional gesture is layered on top.
      */
      resetFingerPose();

    }


    /* =====================================================
       PROCEDURAL NECK-RELIEF GESTURE — V10

       V9 moved the arm successfully, but the wrist and fingers were
       not posed as part of the contact. V10 changes the strategy:

       - only a calm neck-relief / self-massage gesture is used
       - the arm IK targets the WRIST, not a fingertip
       - the palm is explicitly oriented toward the side of the neck
       - all finger joints receive a soft authored curl pose
       - the fingers make tiny squeeze/release changes while holding
       - the gesture blends in and out slowly
       - normal relaxed-arm pose is restored every frame first

       No hair touching and no eye rubbing in this version.
    ===================================================== */

    const gestureState = {

      active: false,

      side: 'L',

      start: 0,

      approach: 1.45,

      hold: 2.35,

      release: 1.55,

      duration: 5.35,

      nextAt: Infinity

    };


    /* -----------------------------------------------------
       Finger rig cache
    ----------------------------------------------------- */

    const fingerRig = {

      L: null,

      R: null

    };


    const fingerBaseQuaternions =
      new Map();


    const handLocalBasisQuaternion = {

      L: null,

      R: null

    };


    const tempFingerWorldA =
      new THREE.Vector3();


    const tempFingerWorldB =
      new THREE.Vector3();


    const tempFingerWorldC =
      new THREE.Vector3();


    const tempFingerLocalA =
      new THREE.Vector3();


    const tempFingerLocalB =
      new THREE.Vector3();


    const tempFingerLocalC =
      new THREE.Vector3();


    const tempBasisX =
      new THREE.Vector3();


    const tempBasisY =
      new THREE.Vector3();


    const tempBasisZ =
      new THREE.Vector3();


    const tempBasisMatrix =
      new THREE.Matrix4();


    function getBoneByName(
      name
    ) {

      if (
        !model
      ) {

        return null;

      }


      return model.getObjectByName(
        name
      ) || null;

    }


    function buildFingerSide(
      suffix
    ) {

      const side = {

        index: [
          getBoneByName(`index_01_${suffix}`),
          getBoneByName(`index_02_${suffix}`),
          getBoneByName(`index_03_${suffix}`)
        ],

        middle: [
          getBoneByName(`middle_01_${suffix}`),
          getBoneByName(`middle_02_${suffix}`),
          getBoneByName(`middle_03_${suffix}`)
        ],

        ring: [
          getBoneByName(`ring_01_${suffix}`),
          getBoneByName(`ring_02_${suffix}`),
          getBoneByName(`ring_03_${suffix}`)
        ],

        pinky: [
          getBoneByName(`pinky_01_${suffix}`),
          getBoneByName(`pinky_02_${suffix}`),
          getBoneByName(`pinky_03_${suffix}`)
        ],

        thumb: [
          getBoneByName(`thumb_01_${suffix}`),
          getBoneByName(`thumb_02_${suffix}`),
          getBoneByName(`thumb_03_${suffix}`)
        ]

      };


      for (
        const chain
        of Object.values(side)
      ) {

        for (
          const bone
          of chain
        ) {

          if (
            bone &&
            !fingerBaseQuaternions.has(bone)
          ) {

            fingerBaseQuaternions.set(
              bone,
              bone.quaternion.clone()
            );

          }

        }

      }


      return side;

    }


    function cacheHandLocalBasis(
      sideName
    ) {

      const isLeft =
        sideName === 'L';


      const hand =
        isLeft
          ? handL
          : handR;


      const rig =
        fingerRig[sideName];


      if (
        !hand ||
        !rig ||
        !rig.index[0] ||
        !rig.middle[0] ||
        !rig.pinky[0]
      ) {

        return;

      }


      model.updateMatrixWorld(
        true
      );


      rig.index[0].getWorldPosition(
        tempFingerWorldA
      );


      rig.middle[0].getWorldPosition(
        tempFingerWorldB
      );


      rig.pinky[0].getWorldPosition(
        tempFingerWorldC
      );


      tempFingerLocalA
        .copy(tempFingerWorldA);


      tempFingerLocalB
        .copy(tempFingerWorldB);


      tempFingerLocalC
        .copy(tempFingerWorldC);


      hand.worldToLocal(
        tempFingerLocalA
      );


      hand.worldToLocal(
        tempFingerLocalB
      );


      hand.worldToLocal(
        tempFingerLocalC
      );


      /*
        Y basis = direction from wrist into the fingers.
      */
      tempBasisY
        .copy(tempFingerLocalB)
        .normalize();


      /*
        X basis = across the palm from pinky toward index.
      */
      tempBasisX
        .subVectors(
          tempFingerLocalA,
          tempFingerLocalC
        )
        .normalize();


      /*
        Orthogonal palm normal.
      */
      tempBasisZ
        .crossVectors(
          tempBasisX,
          tempBasisY
        )
        .normalize();


      /*
        The mesh is mirrored across sides. Flip the left-hand normal
        so +Z of our derived basis always represents the palm side.
      */
      if (
        isLeft
      ) {

        tempBasisZ.multiplyScalar(
          -1
        );

      }


      /* Rebuild X so the three axes remain orthogonal. */
      tempBasisX
        .crossVectors(
          tempBasisY,
          tempBasisZ
        )
        .normalize();


      tempBasisMatrix.makeBasis(
        tempBasisX,
        tempBasisY,
        tempBasisZ
      );


      handLocalBasisQuaternion[sideName] =
        new THREE.Quaternion()
          .setFromRotationMatrix(
            tempBasisMatrix
          );

    }


    function cacheFingerRig() {

      /*
        Put the skeleton in the same relaxed arm pose that is used
        during runtime before measuring the palm basis.
      */
      applyRelaxedPose(
        0
      );


      model.updateMatrixWorld(
        true
      );


      fingerRig.L =
        buildFingerSide('l');


      fingerRig.R =
        buildFingerSide('r');


      cacheHandLocalBasis(
        'L'
      );


      cacheHandLocalBasis(
        'R'
      );


      console.log(
        'V10 FINGER RIG READY:',
        {
          left: !!fingerRig.L,
          right: !!fingerRig.R
        }
      );

    }


    function resetFingerPose() {

      for (
        const [
          bone,
          baseQuaternion
        ]
        of fingerBaseQuaternions
      ) {

        bone.quaternion.copy(
          baseQuaternion
        );

      }

    }


    /* -----------------------------------------------------
       Gesture scheduling
    ----------------------------------------------------- */

    function smoothGestureStep(
      value
    ) {

      const t =
        THREE.MathUtils.clamp(
          value,
          0,
          1
        );


      return t * t * (3 - 2 * t);

    }


    function scheduleNextGesture(
      now,
      initial = false
    ) {

      gestureState.nextAt =
        now +
        (
          initial
            ? 8 + Math.random() * 6
            : 24 + Math.random() * 26
        );

    }


    function beginRandomGesture(
      now
    ) {

      gestureState.active =
        true;


      gestureState.start =
        now;


      gestureState.side =
        Math.random() < 0.5
          ? 'L'
          : 'R';


      /*
        A neck-relief gesture should be unhurried. The hold is long
        enough for two or three tiny massage compressions.
      */
      gestureState.approach =
        1.35 + Math.random() * 0.28;


      gestureState.hold =
        2.15 + Math.random() * 0.65;


      gestureState.release =
        1.45 + Math.random() * 0.30;


      gestureState.duration =
        gestureState.approach +
        gestureState.hold +
        gestureState.release;


      console.log(
        'V10 NECK RELIEF:',
        gestureState.side
      );

    }


    function getGestureWeight(
      now
    ) {

      if (
        !gestureState.active
      ) {

        return 0;

      }


      const elapsed =
        now - gestureState.start;


      if (
        elapsed < gestureState.approach
      ) {

        return smoothGestureStep(
          elapsed /
          gestureState.approach
        );

      }


      const holdEnd =
        gestureState.approach +
        gestureState.hold;


      if (
        elapsed < holdEnd
      ) {

        return 1;

      }


      return 1 - smoothGestureStep(
        (
          elapsed -
          holdEnd
        ) /
        gestureState.release
      );

    }


    function getGestureHoldWeight(
      now
    ) {

      if (
        !gestureState.active
      ) {

        return 0;

      }


      const elapsed =
        now - gestureState.start;


      if (
        elapsed <= gestureState.approach
      ) {

        return 0;

      }


      const holdProgress =
        (
          elapsed -
          gestureState.approach
        ) /
        gestureState.hold;


      if (
        holdProgress < 0 ||
        holdProgress > 1
      ) {

        return 0;

      }


      return Math.sin(
        holdProgress *
        Math.PI
      );

    }


    /* -----------------------------------------------------
       Neck and wrist targets
    ----------------------------------------------------- */

    const gestureNeckContact =
      new THREE.Vector3();


    const gestureWristTarget =
      new THREE.Vector3();


    const gestureRestWrist =
      new THREE.Vector3();


    const gestureBlendedWristTarget =
      new THREE.Vector3();


    const gestureBonePosition =
      new THREE.Vector3();


    const gestureEffectorPosition =
      new THREE.Vector3();


    const gestureToEffector =
      new THREE.Vector3();


    const gestureToTarget =
      new THREE.Vector3();


    const gestureCurrentWorldQuaternion =
      new THREE.Quaternion();


    const gestureParentWorldQuaternion =
      new THREE.Quaternion();


    const gestureDeltaWorldQuaternion =
      new THREE.Quaternion();


    const gestureStepQuaternion =
      new THREE.Quaternion();


    const gestureDesiredWorldQuaternion =
      new THREE.Quaternion();


    const gestureDesiredLocalQuaternion =
      new THREE.Quaternion();


    function getNeckGestureTargets(
      now,
      sideName
    ) {

      const sideSign =
        sideName === 'L'
          ? 1
          : -1;


      const scale =
        modelSize.y;


      /*
        neck_02 is a much better anatomical anchor than the head for
        this gesture. Contact sits on the side/back of the neck.
      */
      if (
        neck02
      ) {

        neck02.getWorldPosition(
          gestureNeckContact
        );

      }

      else if (
        headBone
      ) {

        headBone.getWorldPosition(
          gestureNeckContact
        );


        gestureNeckContact.y -=
          scale * 0.060;

      }


      gestureNeckContact.x +=
        sideSign *
        scale *
        0.032;


      gestureNeckContact.y -=
        scale *
        0.022;


      gestureNeckContact.z +=
        scale *
        0.010;


      /*
        The WRIST must stay outside/below the neck. The hand and
        fingers then make the actual contact after palm orientation.
      */
      gestureWristTarget
        .copy(
          gestureNeckContact
        );


      gestureWristTarget.x +=
        sideSign *
        scale *
        0.052;


      gestureWristTarget.y -=
        scale *
        0.040;


      gestureWristTarget.z +=
        scale *
        0.017;


      /*
        Tiny vertical movement during the hold gives a gentle massage
        instead of a hand frozen against the neck.
      */
      const holdWeight =
        getGestureHoldWeight(
          now
        );


      gestureNeckContact.y +=
        Math.sin(
          now * 3.1
        ) *
        scale *
        0.0017 *
        holdWeight;


      gestureWristTarget.y +=
        Math.sin(
          now * 3.1
        ) *
        scale *
        0.0013 *
        holdWeight;


      return {
        contact: gestureNeckContact,
        wrist: gestureWristTarget
      };

    }


    /* -----------------------------------------------------
       Arm IK — shoulder/elbow only

       The wrist is intentionally excluded from the position solver.
       V9 let the CCD solver rotate the wrist simply to chase a target,
       which is the main reason the hand looked disconnected from the
       contact. V10 positions the arm first, then orients the palm in a
       separate controlled step.
    ----------------------------------------------------- */

    function solveGestureCCD(
      chain,
      effector,
      targetWorld,
      iterations = 7
    ) {

      if (
        !model ||
        !effector ||
        chain.some(
          bone => !bone
        )
      ) {

        return;

      }


      for (
        let iteration = 0;
        iteration < iterations;
        iteration++
      ) {

        for (
          let i = chain.length - 1;
          i >= 0;
          i--
        ) {

          const bone =
            chain[i];


          model.updateMatrixWorld(
            true
          );


          bone.getWorldPosition(
            gestureBonePosition
          );


          effector.getWorldPosition(
            gestureEffectorPosition
          );


          gestureToEffector
            .subVectors(
              gestureEffectorPosition,
              gestureBonePosition
            );


          gestureToTarget
            .subVectors(
              targetWorld,
              gestureBonePosition
            );


          if (
            gestureToEffector.lengthSq() < 0.0000001 ||
            gestureToTarget.lengthSq() < 0.0000001
          ) {

            continue;

          }


          gestureToEffector.normalize();
          gestureToTarget.normalize();


          gestureDeltaWorldQuaternion
            .setFromUnitVectors(
              gestureToEffector,
              gestureToTarget
            );


          /*
            Lower arm does most of the final placement. Upper arm
            contributes strongly. Clavicle moves only slightly.
          */
          let correctionStrength =
            0.56;


          if (
            i === 1
          ) {

            correctionStrength =
              0.44;

          }


          if (
            i === 0
          ) {

            correctionStrength =
              0.20;

          }


          gestureStepQuaternion
            .identity()
            .slerp(
              gestureDeltaWorldQuaternion,
              correctionStrength
            );


          bone.getWorldQuaternion(
            gestureCurrentWorldQuaternion
          );


          gestureDesiredWorldQuaternion
            .copy(
              gestureStepQuaternion
            )
            .multiply(
              gestureCurrentWorldQuaternion
            );


          bone.parent.getWorldQuaternion(
            gestureParentWorldQuaternion
          );


          gestureDesiredLocalQuaternion
            .copy(
              gestureParentWorldQuaternion
            )
            .invert()
            .multiply(
              gestureDesiredWorldQuaternion
            );


          bone.quaternion.slerp(
            gestureDesiredLocalQuaternion,
            0.68
          );


          bone.updateMatrixWorld(
            true
          );

        }

      }

    }


    /* -----------------------------------------------------
       Palm orientation
    ----------------------------------------------------- */

    const orientHandPosition =
      new THREE.Vector3();


    const desiredPalmNormal =
      new THREE.Vector3();


    const desiredFingerDirection =
      new THREE.Vector3();


    const desiredAcrossPalm =
      new THREE.Vector3();


    const desiredHandBasisMatrix =
      new THREE.Matrix4();


    const desiredHandBasisQuaternion =
      new THREE.Quaternion();


    const desiredHandWorldQuaternion =
      new THREE.Quaternion();


    const currentHandLocalQuaternion =
      new THREE.Quaternion();


    function orientHandToNeck(
      hand,
      sideName,
      contactWorld,
      weight
    ) {

      const localBasis =
        handLocalBasisQuaternion[sideName];


      if (
        !hand ||
        !localBasis ||
        weight <= 0
      ) {

        return;

      }


      model.updateMatrixWorld(
        true
      );


      hand.getWorldPosition(
        orientHandPosition
      );


      /* Palm faces the neck. */
      desiredPalmNormal
        .subVectors(
          contactWorld,
          orientHandPosition
        )
        .normalize();


      /*
        Fingers point mostly upward along the neck. Project world-up
        onto the plane of the palm so the wrist never twists randomly.
      */
      desiredFingerDirection.set(
        0,
        1,
        0
      );


      desiredFingerDirection
        .addScaledVector(
          desiredPalmNormal,
          -desiredFingerDirection.dot(
            desiredPalmNormal
          )
        );


      if (
        desiredFingerDirection.lengthSq() < 0.00001
      ) {

        desiredFingerDirection.set(
          0,
          0,
          1
        );

      }


      desiredFingerDirection.normalize();


      /*
        X x Y = Z. Therefore X = Y x Z.
      */
      desiredAcrossPalm
        .crossVectors(
          desiredFingerDirection,
          desiredPalmNormal
        )
        .normalize();


      desiredHandBasisMatrix.makeBasis(
        desiredAcrossPalm,
        desiredFingerDirection,
        desiredPalmNormal
      );


      desiredHandBasisQuaternion
        .setFromRotationMatrix(
          desiredHandBasisMatrix
        );


      /*
        handWorld * localPalmBasis = desiredWorldPalmBasis
      */
      desiredHandWorldQuaternion
        .copy(
          desiredHandBasisQuaternion
        )
        .multiply(
          localBasis
            .clone()
            .invert()
        );


      hand.parent.getWorldQuaternion(
        gestureParentWorldQuaternion
      );


      gestureDesiredLocalQuaternion
        .copy(
          gestureParentWorldQuaternion
        )
        .invert()
        .multiply(
          desiredHandWorldQuaternion
        );


      currentHandLocalQuaternion
        .copy(
          hand.quaternion
        );


      hand.quaternion
        .copy(
          currentHandLocalQuaternion
        )
        .slerp(
          gestureDesiredLocalQuaternion,
          THREE.MathUtils.clamp(
            weight * 0.92,
            0,
            0.92
          )
        );

    }


    /* -----------------------------------------------------
       Finger contact pose
    ----------------------------------------------------- */

    const localCurlAxis =
      new THREE.Vector3(
        0,
        0,
        1
      );


    const localThumbAxis =
      new THREE.Vector3(
        0,
        1,
        0
      );


    const fingerDeltaQuaternion =
      new THREE.Quaternion();


    function rotateFingerLocal(
      bone,
      radians,
      axis = localCurlAxis
    ) {

      if (
        !bone
      ) {

        return;

      }


      fingerDeltaQuaternion
        .setFromAxisAngle(
          axis,
          radians
        );


      bone.quaternion.multiply(
        fingerDeltaQuaternion
      );

    }


    function applyNeckFingerPose(
      sideName,
      gestureWeight,
      now
    ) {

      const rig =
        fingerRig[sideName];


      if (
        !rig ||
        gestureWeight <= 0
      ) {

        return;

      }


      const elapsed =
        now - gestureState.start;


      const holding =
        elapsed > gestureState.approach &&
        elapsed < gestureState.approach + gestureState.hold;


      /*
        A tiny 2.4 Hz squeeze while the palm rests on the neck.
        The fingers never make a fist; they simply conform to the neck.
      */
      const massagePulse =
        holding
          ? 0.5 + 0.5 * Math.sin(
              now * 2.4 * Math.PI
            )
          : 0;


      const curl =
        gestureWeight *
        (
          1 +
          massagePulse * 0.09
        );


      const deg =
        THREE.MathUtils.degToRad;


      const applyChain = (
        chain,
        a,
        b,
        c
      ) => {

        rotateFingerLocal(
          chain[0],
          deg(a) * curl
        );


        rotateFingerLocal(
          chain[1],
          deg(b) * curl
        );


        rotateFingerLocal(
          chain[2],
          deg(c) * curl
        );

      };


      /*
        Middle/ring fingers hug the neck most. Index stays slightly
        straighter and pinky slightly softer. This reads much more like
        an open hand than a generic fist curl.
      */
      applyChain(
        rig.index,
        12,
        20,
        13
      );


      applyChain(
        rig.middle,
        18,
        29,
        19
      );


      applyChain(
        rig.ring,
        21,
        32,
        21
      );


      applyChain(
        rig.pinky,
        18,
        28,
        19
      );


      /*
        Thumb rests inward toward the side of the neck rather than
        sticking straight away from the palm.
      */
      rotateFingerLocal(
        rig.thumb[0],
        deg(12) * curl,
        localThumbAxis
      );


      rotateFingerLocal(
        rig.thumb[1],
        deg(15) * curl
      );


      rotateFingerLocal(
        rig.thumb[2],
        deg(8) * curl
      );

    }


    function updateGesture(
      now
    ) {

      if (
        !gestureState.active &&
        now >= gestureState.nextAt
      ) {

        beginRandomGesture(
          now
        );

      }


      if (
        !gestureState.active
      ) {

        return;

      }


      const elapsed =
        now - gestureState.start;


      if (
        elapsed >= gestureState.duration
      ) {

        gestureState.active =
          false;


        scheduleNextGesture(
          now,
          false
        );


        return;

      }


      const weight =
        getGestureWeight(
          now
        );


      if (
        weight <= 0.0001
      ) {

        return;

      }


      const sideName =
        gestureState.side;


      const isLeft =
        sideName === 'L';


      const clavicle =
        isLeft
          ? clavicleL
          : clavicleR;


      const upperArm =
        isLeft
          ? upperArmL
          : upperArmR;


      const lowerArm =
        isLeft
          ? lowerArmL
          : lowerArmR;


      const hand =
        isLeft
          ? handL
          : handR;


      if (
        !clavicle ||
        !upperArm ||
        !lowerArm ||
        !hand
      ) {

        return;

      }


      model.updateMatrixWorld(
        true
      );


      /*
        Rest wrist comes from the already-correct V8/V9 relaxed pose.
      */
      hand.getWorldPosition(
        gestureRestWrist
      );


      const targets =
        getNeckGestureTargets(
          now,
          sideName
        );


      gestureBlendedWristTarget
        .copy(
          gestureRestWrist
        )
        .lerp(
          targets.wrist,
          weight
        );


      solveGestureCCD(
        [
          clavicle,
          upperArm,
          lowerArm
        ],
        hand,
        gestureBlendedWristTarget,
        7
      );


      model.updateMatrixWorld(
        true
      );


      orientHandToNeck(
        hand,
        sideName,
        targets.contact,
        weight
      );


      /*
        Finger pose is applied AFTER wrist orientation so the contact
        curl is never overwritten by IK.
      */
      applyNeckFingerPose(
        sideName,
        weight,
        now
      );


      model.updateMatrixWorld(
        true
      );

    }


    /* =====================================================
       ANIMATION
    ===================================================== */

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(

          clock.getDelta(),

          0.05

        );


      const now =
        performance.now() /
        1000;


      /* =========================================
         POINTER
      ========================================= */

      pointer.x =
        damp(

          pointer.x,

          targetPointer.x,

          7.5,

          delta

        );


      pointer.y =
        damp(

          pointer.y,

          targetPointer.y,

          7.5,

          delta

        );


      const vertical =
        getVerticalTargets();


      /* =========================================
         EYES
      ========================================= */

      eyeHorizontal =
        damp(

          eyeHorizontal,

          pointer.x *
          eyeHorizontalMax,

          16,

          delta

        );


      eyeVertical =
        damp(

          eyeVertical,

          vertical.eye,

          16,

          delta

        );


      /* =========================================
         HEAD
      ========================================= */

      headHorizontal =
        damp(

          headHorizontal,

          pointer.x *
          headHorizontalMax,

          3.8,

          delta

        );


      headVertical =
        damp(

          headVertical,

          vertical.head,

          pointer.y <
            0
            ?
            4.6
            :
            3.25,

          delta

        );


      /* =========================================
         NECK
      ========================================= */

      neckHorizontal =
        damp(

          neckHorizontal,

          pointer.x *
          neckHorizontalMax,

          2.3,

          delta

        );


      neckVertical =
        damp(

          neckVertical,

          vertical.neck,

          pointer.y <
            0
            ?
            3.3
            :
            2.0,

          delta

        );


      /* =========================================
         EYE ROTATION
      ========================================= */

      if (
        eyeLObject &&
        baseEyeLRotation
      ) {

        eyeLObject.rotation.copy(
          baseEyeLRotation
        );


        eyeLObject.rotation.y +=
          eyeHorizontal;


        eyeLObject.rotation.x -=
          eyeVertical;

      }


      if (
        eyeRObject &&
        baseEyeRRotation
      ) {

        eyeRObject.rotation.copy(
          baseEyeRRotation
        );


        eyeRObject.rotation.y +=
          eyeHorizontal;


        eyeRObject.rotation.x -=
          eyeVertical;

      }


      /* =========================================
         HEAD

         Confirmed rig:
         X = horizontal
         Z = vertical
      ========================================= */

      if (
        headBone &&
        baseHeadRotation
      ) {

        headBone.rotation.copy(
          baseHeadRotation
        );


        headBone.rotation.x +=
          headHorizontal;


        headBone.rotation.z +=
          headVertical;


        headBone.rotation.y =
          baseHeadRotation.y;

      }


      /* =========================================
         NECK 02
      ========================================= */

      if (
        neck02 &&
        baseNeck02Rotation
      ) {

        neck02.rotation.copy(
          baseNeck02Rotation
        );


        neck02.rotation.x +=
          neckHorizontal;


        neck02.rotation.z +=
          neckVertical;


        neck02.rotation.y =
          baseNeck02Rotation.y;

      }


      /* =========================================
         NECK 01
      ========================================= */

      if (
        neck01 &&
        baseNeck01Rotation
      ) {

        neck01.rotation.copy(
          baseNeck01Rotation
        );


        neck01.rotation.x +=
          neckHorizontal *
          0.30;


        neck01.rotation.z +=
          neckVertical *
          0.28;


        neck01.rotation.y =
          baseNeck01Rotation.y;

      }


      /* =========================================
         RELAX ARMS / SHOULDERS
      ========================================= */

      applyRelaxedPose(
        now
      );


      /* =========================================
         OCCASIONAL HAND GESTURE
      ========================================= */

      updateGesture(
        now
      );


      /* =========================================
         SMILE
      ========================================= */

      applyRestingSmile();


      /* =========================================
         BLINK
      ========================================= */

      updateBlink(
        now
      );


      /* =========================================
         DECORATIVE VFX

         Disabled in V7 while the character itself is being
         finalized.
      ========================================= */

      /* =========================================
         EYE PULSE
      ========================================= */

      const eyePulse =
        (
          Math.sin(
            now *
            1.35
          ) *
          0.5 +
          0.5
        );


      eyeMaterial.emissiveIntensity =
        0.26 +
        eyePulse *
        0.10;


      lowerGlow.intensity =
        4.8 +
        eyePulse *
        0.8;


      /* =========================================
         PARTICLES
      ========================================= */


      /* =========================================
         RENDER
      ========================================= */

      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =====================================================
       RESIZE
    ===================================================== */

    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );


        if (
          model
        ) {

          setupCamera();

        }

      }

    );

  </script>

</body>
</html>
