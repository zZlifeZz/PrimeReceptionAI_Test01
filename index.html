<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prime Reception AI — Digital Receptionist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 50% 45%,
          #09202c 0%,
          #04131b 27%,
          #02080d 55%,
          #000000 100%
        );
    }

    /* -----------------------------------------
       Very subtle digital scan atmosphere
    ----------------------------------------- */

    #stage::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 4;

      pointer-events: none;

      opacity: 0.028;

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 5px,
          rgba(69, 227, 255, 0.14) 6px,
          transparent 7px
        );

      animation:
        scanMove 13s linear infinite;
    }

    @keyframes scanMove {
      from {
        background-position-y: 0;
      }

      to {
        background-position-y: 240px;
      }
    }


    /* -----------------------------------------
       Cinematic vignette
    ----------------------------------------- */

    #stage::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 5;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 37%,
          rgba(0, 0, 0, 0.08) 59%,
          rgba(0, 0, 0, 0.78) 100%
        );
    }


    #stage canvas {
      position: relative;

      z-index: 1;

      display: block;

      width: 100%;
      height: 100%;
    }


    #status {
      position: absolute;

      z-index: 20;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      color:
        #62e7ff;

      font-family:
        Arial,
        sans-serif;

      font-size:
        14px;

      letter-spacing:
        0.11em;

      white-space:
        nowrap;

      pointer-events:
        none;
    }
  </style>
</head>


<body>

  <div id="stage">

    <div id="status">
      INITIALIZING PRIME RECEPTION AI…
    </div>

  </div>


  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <script type="module">

    import * as THREE from 'three';

    import {
      GLTFLoader
    } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


    /* =====================================================
       DOM
    ===================================================== */

    const stage =
      document.getElementById(
        'stage'
      );


    const status =
      document.getElementById(
        'status'
      );


    /* =====================================================
       SCENE
    ===================================================== */

    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(

        30,

        window.innerWidth /
        window.innerHeight,

        0.01,

        1000

      );


    /* =====================================================
       RENDERER
    ===================================================== */

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true,

        alpha: true

      });


    renderer.setPixelRatio(

      Math.min(

        window.devicePixelRatio || 1,

        2

      )

    );


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      1.05;


    renderer.setClearColor(

      0x000000,

      0

    );


    stage.appendChild(
      renderer.domElement
    );


    /* =====================================================
       LIGHTING
    ===================================================== */


    /*
      General environment illumination.
    */

    const ambient =
      new THREE.HemisphereLight(

        0xfff4ec,

        0x020607,

        0.92

      );


    scene.add(
      ambient
    );


    /*
      Main human-face key light.
      Slight warmth helps the skin.
    */

    const keyLight =
      new THREE.DirectionalLight(

        0xffe8d9,

        2.6

      );


    keyLight.position.set(

      1.5,

      4.3,

      5.8

    );


    scene.add(
      keyLight
    );


    /*
      Soft frontal fill.
    */

    const frontFill =
      new THREE.PointLight(

        0xffe9dd,

        1.0,

        6

      );


    frontFill.position.set(

      -0.4,

      1.7,

      3.2

    );


    scene.add(
      frontFill
    );


    /*
      Strong cyan holographic silhouette.
    */

    const cyanLeft =
      new THREE.DirectionalLight(

        0x19ddff,

        4.8

      );


    cyanLeft.position.set(

      -4.5,

      3.7,

      -3.8

    );


    scene.add(
      cyanLeft
    );


    const cyanRight =
      new THREE.DirectionalLight(

        0x63e9ff,

        2.7

      );


    cyanRight.position.set(

      4.5,

      3.2,

      -3.2

    );


    scene.add(
      cyanRight
    );


    /*
      Gold illumination reinforces clothing.
    */

    const goldKey =
      new THREE.DirectionalLight(

        0xffc35a,

        1.45

      );


    goldKey.position.set(

      3.2,

      2.8,

      3.5

    );


    scene.add(
      goldKey
    );


    /*
      Lower cyan projection.
    */

    const lowerGlow =
      new THREE.PointLight(

        0x16dfff,

        6.5,

        6

      );


    lowerGlow.position.set(

      0,

      -1.0,

      1.4

    );


    scene.add(
      lowerGlow
    );


    /* =====================================================
       MOVING "WATER / HOLOGRAM REFLECTION" LIGHTS

       These produce animated cyan reflections across the
       character instead of making her skin look wet.
    ===================================================== */


    const waterLightA =
      new THREE.PointLight(

        0x11e5ff,

        1.7,

        4

      );


    scene.add(
      waterLightA
    );


    const waterLightB =
      new THREE.PointLight(

        0x55edff,

        1.15,

        4

      );


    scene.add(
      waterLightB
    );


    const waterLightC =
      new THREE.PointLight(

        0x008fb3,

        0.9,

        3.5

      );


    scene.add(
      waterLightC
    );


    /* =====================================================
       MATERIALS
    ===================================================== */


    /*
      HUMAN-LOOKING EXPOSED SKIN

      This material is used for torso/arms/hands.
      We deliberately keep metalness almost zero.
    */

    const bodyMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xc9aba0
          ),

        emissive:
          new THREE.Color(
            0x080d0e
          ),

        emissiveIntensity:
          0.018,

        metalness:
          0.01,

        roughness:
          0.49,

        clearcoat:
          0.10,

        clearcoatRoughness:
          0.46,

        sheen:
          0.08,

        sheenColor:
          new THREE.Color(
            0xffcabe
          )

      });


    /*
      FACE

      Slightly brighter than the body.
    */

    const faceMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xd3b4a9
          ),

        emissive:
          new THREE.Color(
            0x06090a
          ),

        emissiveIntensity:
          0.012,

        metalness:
          0,

        roughness:
          0.50,

        clearcoat:
          0.085,

        clearcoatRoughness:
          0.48,

        sheen:
          0.075,

        sheenColor:
          new THREE.Color(
            0xffd2c5
          )

      });


    /*
      PREMIUM GOLD SHIRT
    */

    const shirtMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xc4942e
          ),

        emissive:
          new THREE.Color(
            0x251503
          ),

        emissiveIntensity:
          0.055,

        metalness:
          0.73,

        roughness:
          0.25,

        clearcoat:
          0.48,

        clearcoatRoughness:
          0.19,

        sheen:
          0.24,

        sheenColor:
          new THREE.Color(
            0xffd46b
          )

      });


    /*
      Matching gold lower uniform.
      Most of this will be outside our new camera crop.
    */

    const leggingsMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x9e711b
          ),

        emissive:
          new THREE.Color(
            0x1c1001
          ),

        emissiveIntensity:
          0.040,

        metalness:
          0.69,

        roughness:
          0.29,

        clearcoat:
          0.40,

        clearcoatRoughness:
          0.23

      });


    /*
      Dark hair.
    */

    const hairMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x030405
          ),

        emissive:
          new THREE.Color(
            0x00141a
          ),

        emissiveIntensity:
          0.10,

        metalness:
          0.12,

        roughness:
          0.38,

        clearcoat:
          0.28,

        clearcoatRoughness:
          0.27

      });


    /*
      Eyes remain futuristic,
      but not overwhelmingly bright.
    */

    const eyeMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xd9f9ff
          ),

        emissive:
          new THREE.Color(
            0x1cd9f5
          ),

        emissiveIntensity:
          0.72,

        metalness:
          0,

        roughness:
          0.14,

        clearcoat:
          1,

        clearcoatRoughness:
          0.04

      });


    const eyeShellMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          0xe3fbff,

        emissive:
          0x054a54,

        emissiveIntensity:
          0.15,

        transparent:
          true,

        opacity:
          0.26,

        roughness:
          0.08,

        clearcoat:
          1

      });


    const darkDetailMaterial =
      new THREE.MeshStandardMaterial({

        color:
          0x010101,

        roughness:
          0.46

      });


    const teethMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          0xf4eee9,

        roughness:
          0.34,

        clearcoat:
          0.10

      });


    const nailMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xd1a259
          ),

        metalness:
          0.18,

        roughness:
          0.36,

        clearcoat:
          0.35

      });


    /* =====================================================
       CLEAN MATERIAL HELPER
    ===================================================== */

    function forceCleanMaterial(
      object,
      material
    ) {

      object.material =
        material;


      material.map =
        null;


      material.normalMap =
        null;


      material.roughnessMap =
        null;


      material.metalnessMap =
        null;


      material.aoMap =
        null;


      material.emissiveMap =
        null;


      material.alphaMap =
        null;


      material.lightMap =
        null;


      material.displacementMap =
        null;


      material.vertexColors =
        false;


      material.needsUpdate =
        true;

    }


    /* =====================================================
       MODEL REFERENCES
       DECLARED ONCE.
    ===================================================== */

    let model =
      null;


    let modelSize =
      null;


    let modelBox =
      null;


    let shirtMesh =
      null;


    let headBone =
      null;


    let neck01 =
      null;


    let neck02 =
      null;


    let eyeLObject =
      null;


    let eyeRObject =
      null;


    let baseHeadRotation =
      null;


    let baseNeck01Rotation =
      null;


    let baseNeck02Rotation =
      null;


    let baseEyeLRotation =
      null;


    let baseEyeRRotation =
      null;


    const blinkMeshes =
      [];


    const smileMeshes =
      [];


    /* =====================================================
       POINTER
    ===================================================== */

    const pointer =
      new THREE.Vector2(
        0,
        0
      );


    const targetPointer =
      new THREE.Vector2(
        0,
        0
      );


    window.addEventListener(

      'pointermove',

      function (
        event
      ) {

        let x =
          (
            event.clientX /
            window.innerWidth
          ) *
          2 -
          1;


        let y =
          -(
            (
              event.clientY /
              window.innerHeight
            ) *
            2 -
            1
          );


        /*
          Small dead zone near screen center.
        */

        const deadZone =
          0.045;


        if (
          Math.abs(
            x
          ) <
          deadZone
        ) {

          x =
            0;

        }


        if (
          Math.abs(
            y
          ) <
          deadZone
        ) {

          y =
            0;

        }


        /*
          Slight curve makes center movements gentle
          while still allowing strong movement at edges.
        */

        x =
          Math.sign(
            x
          ) *
          Math.pow(
            Math.abs(
              x
            ),
            1.10
          );


        y =
          Math.sign(
            y
          ) *
          Math.pow(
            Math.abs(
              y
            ),
            1.06
          );


        targetPointer.set(

          THREE.MathUtils.clamp(
            x,
            -1,
            1
          ),

          THREE.MathUtils.clamp(
            y,
            -1,
            1
          )

        );

      }

    );


    document.documentElement.addEventListener(

      'mouseleave',

      function () {

        targetPointer.set(
          0,
          0
        );

      }

    );


    /* =====================================================
       MORPH UTILITIES
    ===================================================== */

    function normalizeMorphName(
      name
    ) {

      return name
        .toLowerCase()
        .replace(
          /[^a-z0-9]/g,
          ''
        );

    }


    function findMorphIndex(
      dictionary,
      possibilities
    ) {

      /*
        First try exact names.
      */

      for (
        const possibility
        of possibilities
      ) {

        if (
          dictionary[possibility] !==
          undefined
        ) {

          return dictionary[
            possibility
          ];

        }

      }


      /*
        Then try normalized fuzzy matching.
      */

      const entries =
        Object.entries(
          dictionary
        );


      for (
        const [
          morphName,
          index
        ]
        of entries
      ) {

        const normalizedMorph =
          normalizeMorphName(
            morphName
          );


        for (
          const possibility
          of possibilities
        ) {

          const normalizedPossibility =
            normalizeMorphName(
              possibility
            );


          if (
            normalizedMorph ===
            normalizedPossibility
            ||
            normalizedMorph.includes(
              normalizedPossibility
            )
          ) {

            return index;

          }

        }

      }


      return null;

    }


    function registerFacialMorphs(
      object
    ) {

      if (
        !object.morphTargetDictionary ||
        !object.morphTargetInfluences
      ) {

        return;

      }


      const dictionary =
        object.morphTargetDictionary;


      /* =========================================
         BLINK
      ========================================= */

      const blinkLeft =
        findMorphIndex(

          dictionary,

          [
            'eyeBlinkLeft',
            'EyeBlinkLeft',
            'blinkLeft',
            'eyeBlink_L',
            'eyeBlinkL'
          ]

        );


      const blinkRight =
        findMorphIndex(

          dictionary,

          [
            'eyeBlinkRight',
            'EyeBlinkRight',
            'blinkRight',
            'eyeBlink_R',
            'eyeBlinkR'
          ]

        );


      if (
        blinkLeft !==
          null
        ||
        blinkRight !==
          null
      ) {

        blinkMeshes.push({

          mesh:
            object,

          left:
            blinkLeft,

          right:
            blinkRight

        });

      }


      /* =========================================
         SMILE
      ========================================= */

      const smileLeft =
        findMorphIndex(

          dictionary,

          [
            'mouthSmileLeft',
            'MouthSmileLeft',
            'smileLeft',
            'SmileLeft',
            'mouthSmile_L',
            'mouthSmileL',
            'smile_L'
          ]

        );


      const smileRight =
        findMorphIndex(

          dictionary,

          [
            'mouthSmileRight',
            'MouthSmileRight',
            'smileRight',
            'SmileRight',
            'mouthSmile_R',
            'mouthSmileR',
            'smile_R'
          ]

        );


      const cheekLeft =
        findMorphIndex(

          dictionary,

          [
            'cheekSquintLeft',
            'CheekSquintLeft',
            'cheekSquint_L'
          ]

        );


      const cheekRight =
        findMorphIndex(

          dictionary,

          [
            'cheekSquintRight',
            'CheekSquintRight',
            'cheekSquint_R'
          ]

        );


      if (
        smileLeft !==
          null
        ||
        smileRight !==
          null
      ) {

        smileMeshes.push({

          mesh:
            object,

          left:
            smileLeft,

          right:
            smileRight,

          cheekLeft:
            cheekLeft,

          cheekRight:
            cheekRight

        });

      }


      /*
        Debugging information.

        If smile is still unavailable,
        this gives us the model's exact morph names.
      */

      console.log(

        'FACIAL MORPHS:',
        object.name,
        Object.keys(
          dictionary
        )

      );

    }


    /* =====================================================
       PROFESSIONAL RESTING SMILE
    ===================================================== */

    const RESTING_SMILE =
      0.28;


    const CHEEK_SMILE =
      0.075;


    function applyRestingSmile() {

      for (
        const entry
        of smileMeshes
      ) {

        const influences =
          entry
            .mesh
            .morphTargetInfluences;


        if (
          entry.left !==
          null
        ) {

          influences[
            entry.left
          ] =
            RESTING_SMILE;

        }


        if (
          entry.right !==
          null
        ) {

          influences[
            entry.right
          ] =
            RESTING_SMILE;

        }


        if (
          entry.cheekLeft !==
          null
        ) {

          influences[
            entry.cheekLeft
          ] =
            CHEEK_SMILE;

        }


        if (
          entry.cheekRight !==
          null
        ) {

          influences[
            entry.cheekRight
          ] =
            CHEEK_SMILE;

        }

      }

    }


    /* =====================================================
       BACKGROUND PARTICLES
    ===================================================== */

    let backgroundParticles =
      null;


    function createBackgroundParticles(
      size
    ) {

      const count =
        250;


      const positions =
        new Float32Array(
          count *
          3
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const i3 =
          i *
          3;


        positions[
          i3
        ] =
          (
            Math.random() -
            0.5
          ) *
          size.x *
          4;


        positions[
          i3 + 1
        ] =
          (
            Math.random() -
            0.42
          ) *
          size.y *
          1.8;


        positions[
          i3 + 2
        ] =
          (
            Math.random() -
            0.5
          ) *
          Math.max(
            size.x *
            4,
            size.z *
            7
          );

      }


      const geometry =
        new THREE.BufferGeometry();


      geometry.setAttribute(

        'position',

        new THREE.BufferAttribute(
          positions,
          3
        )

      );


      const material =
        new THREE.PointsMaterial({

          color:
            0x24dfff,

          size:
            Math.max(
              size.y *
              0.0017,
              0.0017
            ),

          transparent:
            true,

          opacity:
            0.18,

          depthWrite:
            false,

          blending:
            THREE.AdditiveBlending

        });


      backgroundParticles =
        new THREE.Points(
          geometry,
          material
        );


      scene.add(
        backgroundParticles
      );

    }


    /* =====================================================
       MODEL LOADING
    ===================================================== */

    const loader =
      new GLTFLoader();


    loader.load(

      './PrimeReceptionAI_Test01.glb',


      function (
        gltf
      ) {

        model =
          gltf.scene;


        scene.add(
          model
        );


        model.traverse(

          function (
            object
          ) {


            /* =============================================
               MESHES
            ============================================= */

            if (
              object.isMesh
            ) {

              const name =
                object.name;


              registerFacialMorphs(
                object
              );


              /*
                Hide known unwanted auxiliary layers.
              */

              if (
                name ===
                  'SK_FemBase2_Censored_Torso'
                ||
                name ===
                  'SK_FemBase2_UnderWear'
              ) {

                object.visible =
                  false;


                return;

              }


              /*
                Body / arms / hands / torso.
              */

              if (
                name ===
                  'Mesh010'
                ||
                name ===
                  'SK_FemBase2_Torso'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  bodyMaterial

                );


                return;

              }


              /*
                Face.
              */

              if (
                name ===
                  'Mesh010_1'
                ||
                name ===
                  'SK_FemBase2_Head_52ArKit'
                ||
                name ===
                  'SK_FemBase2_Head_52ARKit'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  faceMaterial

                );


                return;

              }


              /*
                GOLD SHIRT.
              */

              if (
                name ===
                  'SK_FemBase2_TShirt'
              ) {

                shirtMesh =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  shirtMaterial

                );


                return;

              }


              /*
                GOLD LEGGINGS.
              */

              if (
                name ===
                  'SK_FemBase2_Leggings'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  leggingsMaterial

                );


                return;

              }


              /*
                HAIR.
              */

              if (
                name ===
                  'SK_FemBase2_Hair'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  hairMaterial

                );


                return;

              }


              /*
                LEFT EYE.
              */

              if (
                name ===
                  'SK_FemBase2_EyeL'
              ) {

                eyeLObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  eyeMaterial

                );


                return;

              }


              /*
                RIGHT EYE.
              */

              if (
                name ===
                  'SK_FemBase2_EyeR'
              ) {

                eyeRObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  eyeMaterial

                );


                return;

              }


              /*
                EYE SHELL.
              */

              if (
                name ===
                  'SK_FemBase2_EyeShell'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  eyeShellMaterial

                );


                return;

              }


              /*
                LASHES.
              */

              if (
                name ===
                  'SK_FemBase2_Lashes'
                ||
                name ===
                  'SK_FemBase2_EyeEdge'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  darkDetailMaterial

                );


                return;

              }


              /*
                TEETH.
              */

              if (
                name ===
                  'SK_FemBase2_Teeth'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  teethMaterial

                );


                return;

              }


              /*
                NAILS.
              */

              if (
                name ===
                  'SK_FemBase2_Nails'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(

                  object,

                  nailMaterial

                );


                return;

              }

            }


            /* =============================================
               BONES
            ============================================= */

            if (
              object.isBone
            ) {

              const lowerName =
                object
                  .name
                  .toLowerCase();


              if (
                lowerName ===
                  'head'
                ||
                lowerName.endsWith(
                  '_head'
                )
              ) {

                headBone =
                  object;

              }


              if (
                lowerName.includes(
                  'neck_01'
                )
              ) {

                neck01 =
                  object;

              }


              if (
                lowerName.includes(
                  'neck_02'
                )
              ) {

                neck02 =
                  object;

              }

            }

          }

        );


        /* =================================================
           STORE ORIGINAL BONE ROTATIONS
        ================================================= */

        if (
          headBone
        ) {

          baseHeadRotation =
            headBone
              .rotation
              .clone();

        }


        if (
          neck01
        ) {

          baseNeck01Rotation =
            neck01
              .rotation
              .clone();

        }


        if (
          neck02
        ) {

          baseNeck02Rotation =
            neck02
              .rotation
              .clone();

        }


        if (
          eyeLObject
        ) {

          baseEyeLRotation =
            eyeLObject
              .rotation
              .clone();

        }


        if (
          eyeRObject
        ) {

          baseEyeRRotation =
            eyeRObject
              .rotation
              .clone();

        }


        /* =================================================
           CENTER ENTIRE MODEL
        ================================================= */

        modelBox =
          new THREE.Box3()
            .setFromObject(
              model
            );


        modelSize =
          modelBox.getSize(
            new THREE.Vector3()
          );


        const modelCenter =
          modelBox.getCenter(
            new THREE.Vector3()
          );


        model.position.set(

          -modelCenter.x,

          -modelCenter.y,

          -modelCenter.z

        );


        model.updateMatrixWorld(
          true
        );


        /* =================================================
           CAMERA

           PRIMARY GOALS:

           1. Head centered.
           2. Tight corporate portrait.
           3. Bottom of frame around shirt hem.
           4. Belly/lower body no longer emphasized.
        ================================================= */

        setupPortraitCamera();


        /* =================================================
           EFFECTS
        ================================================= */

        createBackgroundParticles(
          modelSize
        );


        /* =================================================
           FACE
        ================================================= */

        applyRestingSmile();


        console.log(

          'SMILE MORPH MESHES:',

          smileMeshes.length

        );


        status.style.display =
          'none';


        scheduleNextBlink();

      },


      /* ===================================================
         PROGRESS
      =================================================== */

      function (
        xhr
      ) {

        if (
          xhr.total
        ) {

          const percent =
            Math.round(

              (
                xhr.loaded /
                xhr.total
              ) *
              100

            );


          status.textContent =
            'INITIALIZING PRIME RECEPTION AI… ' +
            percent +
            '%';

        }

      },


      /* ===================================================
         ERROR
      =================================================== */

      function (
        error
      ) {

        console.error(

          'GLB ERROR:',

          error

        );


        status.textContent =
          'MODEL FAILED TO LOAD';

      }

    );


    /* =====================================================
       CAMERA SETUP
    ===================================================== */

    const headWorldPosition =
      new THREE.Vector3();


    function setupPortraitCamera() {

      if (
        !model ||
        !modelSize
      ) {

        return;

      }


      model.updateMatrixWorld(
        true
      );


      /*
        Find actual head location.
      */

      if (
        headBone
      ) {

        headBone.getWorldPosition(
          headWorldPosition
        );

      }

      else {

        headWorldPosition.set(

          0,

          modelSize.y *
          0.29,

          0

        );

      }


      /*
        Find the actual lower edge of the shirt.
      */

      let shirtBottomY;


      if (
        shirtMesh
      ) {

        const shirtBox =
          new THREE.Box3()
            .setFromObject(
              shirtMesh
            );


        shirtBottomY =
          shirtBox.min.y;

      }

      else {

        shirtBottomY =
          headWorldPosition.y -
          modelSize.y *
          0.31;

      }


      /*
        HEAD IS THE CAMERA TARGET.

        Therefore the head sits at the center
        of the viewport vertically and horizontally.
      */

      const targetY =
        headWorldPosition.y;


      const targetX =
        headWorldPosition.x;


      /*
        We need enough room from head-center down
        to the shirt hem.

        Small margin prevents accidental clipping.
      */

      const distanceHeadToShirt =
        Math.max(

          targetY -
          shirtBottomY,

          modelSize.y *
          0.20

        );


      /*
        Frame reaches just slightly below shirt.
      */

      const requiredHalfHeight =
        distanceHeadToShirt *
        1.075;


      const verticalFOV =
        THREE.MathUtils.degToRad(
          camera.fov
        );


      let cameraDistance =
        requiredHalfHeight /
        Math.tan(
          verticalFOV /
          2
        );


      /*
        Small safety margin.
      */

      cameraDistance *=
        1.025;


      camera.position.set(

        targetX,

        targetY,

        cameraDistance

      );


      camera.lookAt(

        targetX,

        targetY,

        0

      );


      camera.near =
        Math.max(

          cameraDistance /
          120,

          0.01

        );


      camera.far =
        cameraDistance *
        100;


      camera.updateProjectionMatrix();

    }


    /* =====================================================
       BLINKING
    ===================================================== */

    function setBlinkAmount(
      amount
    ) {

      const value =
        THREE.MathUtils.clamp(

          amount,

          0,

          1

        );


      for (
        const entry
        of blinkMeshes
      ) {

        const influences =
          entry
            .mesh
            .morphTargetInfluences;


        if (
          entry.left !==
          null
        ) {

          influences[
            entry.left
          ] =
            value;

        }


        if (
          entry.right !==
          null
        ) {

          influences[
            entry.right
          ] =
            value;

        }

      }

    }


    let blinkActive =
      false;


    let blinkStart =
      0;


    let blinkDuration =
      0.15;


    let nextBlink =
      Infinity;


    let doubleBlink =
      false;


    let secondBlinkAt =
      Infinity;


    function scheduleNextBlink() {

      nextBlink =
        performance.now() /
        1000 +
        2.3 +
        Math.random() *
        3.8;

    }


    function beginBlink() {

      blinkActive =
        true;


      blinkStart =
        performance.now() /
        1000;


      blinkDuration =
        0.12 +
        Math.random() *
        0.055;


      doubleBlink =
        Math.random() <
        0.10;

    }


    function updateBlink(
      now
    ) {

      if (
        !blinkActive &&
        now >=
        nextBlink
      ) {

        beginBlink();

      }


      if (
        !blinkActive &&
        doubleBlink &&
        now >=
        secondBlinkAt
      ) {

        doubleBlink =
          false;


        beginBlink();


        return;

      }


      if (
        !blinkActive
      ) {

        setBlinkAmount(
          0
        );


        return;

      }


      const progress =
        (
          now -
          blinkStart
        ) /
        blinkDuration;


      if (
        progress <=
        1
      ) {

        setBlinkAmount(

          Math.sin(

            progress *
            Math.PI

          )

        );

      }

      else {

        setBlinkAmount(
          0
        );


        blinkActive =
          false;


        if (
          doubleBlink
        ) {

          secondBlinkAt =
            now +
            0.14 +
            Math.random() *
            0.08;

        }

        else {

          scheduleNextBlink();

        }

      }

    }


    /* =====================================================
       TRACKING SETTINGS
    ===================================================== */


    /*
      Eyes react considerably more than before.
    */

    const eyeHorizontalMax =
      THREE.MathUtils.degToRad(
        12
      );


    const eyeVerticalUpMax =
      THREE.MathUtils.degToRad(
        7
      );


    const eyeVerticalDownMax =
      THREE.MathUtils.degToRad(
        11
      );


    /*
      Horizontal head movement remains restrained.
    */

    const headHorizontalMax =
      THREE.MathUtils.degToRad(
        5
      );


    /*
      UP and DOWN intentionally use different limits.

      Looking down needs to be unmistakable.
    */

    const headUpMax =
      THREE.MathUtils.degToRad(
        5
      );


    const headDownMax =
      THREE.MathUtils.degToRad(
        12
      );


    const neckHorizontalMax =
      THREE.MathUtils.degToRad(
        1.7
      );


    const neckUpMax =
      THREE.MathUtils.degToRad(
        1.8
      );


    const neckDownMax =
      THREE.MathUtils.degToRad(
        4.2
      );


    let eyeHorizontal =
      0;


    let eyeVertical =
      0;


    let headHorizontal =
      0;


    let headVertical =
      0;


    let neckHorizontal =
      0;


    let neckVertical =
      0;


    function damp(
      current,
      target,
      speed,
      delta
    ) {

      return THREE.MathUtils.lerp(

        current,

        target,

        1 -
        Math.exp(
          -speed *
          delta
        )

      );

    }


    /* =====================================================
       TRACKING TARGET CALCULATION
    ===================================================== */

    function calculateVerticalTargets() {

      /*
        pointer.y:

        +1 = cursor at TOP
        -1 = cursor at BOTTOM
      */


      if (
        pointer.y >=
        0
      ) {

        /*
          LOOKING UP
        */

        return {

          eye:
            pointer.y *
            eyeVerticalUpMax,

          head:
            pointer.y *
            headUpMax,

          neck:
            pointer.y *
            neckUpMax

        };

      }


      /*
        LOOKING DOWN

        Negative values use substantially greater
        rotation than upward gaze.
      */

      const downAmount =
        Math.abs(
          pointer.y
        );


      return {

        eye:
          -downAmount *
          eyeVerticalDownMax,

        head:
          -downAmount *
          headDownMax,

        neck:
          -downAmount *
          neckDownMax

      };

    }


    /* =====================================================
       ANIMATION LOOP
    ===================================================== */

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(

          clock.getDelta(),

          0.05

        );


      const now =
        performance.now() /
        1000;


      /* =========================================
         POINTER SMOOTHING
      ========================================= */

      pointer.x =
        damp(

          pointer.x,

          targetPointer.x,

          7.5,

          delta

        );


      pointer.y =
        damp(

          pointer.y,

          targetPointer.y,

          7.5,

          delta

        );


      const verticalTargets =
        calculateVerticalTargets();


      /* =========================================
         EYES

         Eyes react fastest.
      ========================================= */

      eyeHorizontal =
        damp(

          eyeHorizontal,

          pointer.x *
          eyeHorizontalMax,

          16,

          delta

        );


      eyeVertical =
        damp(

          eyeVertical,

          verticalTargets.eye,

          16,

          delta

        );


      /* =========================================
         HEAD

         Faster and more obvious than old version.
      ========================================= */

      headHorizontal =
        damp(

          headHorizontal,

          pointer.x *
          headHorizontalMax,

          3.7,

          delta

        );


      headVertical =
        damp(

          headVertical,

          verticalTargets.head,

          pointer.y <
            0
            ?
            4.4
            :
            3.2,

          delta

        );


      /* =========================================
         NECK
      ========================================= */

      neckHorizontal =
        damp(

          neckHorizontal,

          pointer.x *
          neckHorizontalMax,

          2.2,

          delta

        );


      neckVertical =
        damp(

          neckVertical,

          verticalTargets.neck,

          pointer.y <
            0
            ?
            3.2
            :
            2.0,

          delta

        );


      /* =========================================
         APPLY EYES
      ========================================= */

      if (
        eyeLObject &&
        baseEyeLRotation
      ) {

        eyeLObject.rotation.copy(
          baseEyeLRotation
        );


        eyeLObject.rotation.y +=
          eyeHorizontal;


        eyeLObject.rotation.x -=
          eyeVertical;

      }


      if (
        eyeRObject &&
        baseEyeRRotation
      ) {

        eyeRObject.rotation.copy(
          baseEyeRRotation
        );


        eyeRObject.rotation.y +=
          eyeHorizontal;


        eyeRObject.rotation.x -=
          eyeVertical;

      }


      /* =========================================
         APPLY HEAD

         Confirmed rig mapping from our testing:

         X = LEFT / RIGHT
         Z = UP / DOWN
         Y must remain untouched.
      ========================================= */

      if (
        headBone &&
        baseHeadRotation
      ) {

        headBone.rotation.copy(
          baseHeadRotation
        );


        headBone.rotation.x +=
          headHorizontal;


        headBone.rotation.z +=
          headVertical;


        headBone.rotation.y =
          baseHeadRotation.y;

      }


      /* =========================================
         NECK 02
      ========================================= */

      if (
        neck02 &&
        baseNeck02Rotation
      ) {

        neck02.rotation.copy(
          baseNeck02Rotation
        );


        neck02.rotation.x +=
          neckHorizontal;


        neck02.rotation.z +=
          neckVertical;


        neck02.rotation.y =
          baseNeck02Rotation.y;

      }


      /* =========================================
         NECK 01

         Reduced contribution so most of the
         downward expression comes from upper neck/head.
      ========================================= */

      if (
        neck01 &&
        baseNeck01Rotation
      ) {

        neck01.rotation.copy(
          baseNeck01Rotation
        );


        neck01.rotation.x +=
          neckHorizontal *
          0.30;


        neck01.rotation.z +=
          neckVertical *
          0.28;


        neck01.rotation.y =
          baseNeck01Rotation.y;

      }


      /* =========================================
         FACIAL EXPRESSION
      ========================================= */

      applyRestingSmile();


      updateBlink(
        now
      );


      /* =========================================
         WATER-LIKE CYAN LIGHT REFLECTIONS

         No actual body movement.
         Only light moves.
      ========================================= */

      const waterTime =
        now *
        0.75;


      waterLightA.position.set(

        Math.sin(
          waterTime
        ) *
        1.4,

        0.45 +
        Math.sin(
          waterTime *
          1.8
        ) *
        0.45,

        1.45 +
        Math.cos(
          waterTime
        ) *
        0.55

      );


      waterLightB.position.set(

        Math.cos(
          waterTime *
          1.15
        ) *
        1.25,

        1.15 +
        Math.sin(
          waterTime *
          1.45 +
          1.7
        ) *
        0.48,

        1.2

      );


      waterLightC.position.set(

        Math.sin(
          waterTime *
          0.72 +
          2.2
        ) *
        1.6,

        -0.05 +
        Math.cos(
          waterTime *
          1.3
        ) *
        0.40,

        0.75

      );


      /*
        Light intensity also moves slightly,
        resembling reflected water caustics.
      */

      waterLightA.intensity =
        1.30 +
        (
          Math.sin(
            now *
            2.1
          ) *
          0.5 +
          0.5
        ) *
        0.65;


      waterLightB.intensity =
        0.85 +
        (
          Math.sin(
            now *
            2.7 +
            1.4
          ) *
          0.5 +
          0.5
        ) *
        0.55;


      waterLightC.intensity =
        0.55 +
        (
          Math.sin(
            now *
            1.9 +
            2.8
          ) *
          0.5 +
          0.5
        ) *
        0.45;


      /* =========================================
         SUBTLE AI ENERGY PULSE
      ========================================= */

      const pulse =
        (
          Math.sin(
            now *
            1.1
          ) *
          0.5 +
          0.5
        );


      lowerGlow.intensity =
        5.8 +
        pulse *
        1.4;


      eyeMaterial.emissiveIntensity =
        0.64 +
        pulse *
        0.14;


      shirtMaterial.emissiveIntensity =
        0.045 +
        pulse *
        0.018;


      /* =========================================
         BACKGROUND PARTICLES
      ========================================= */

      if (
        backgroundParticles
      ) {

        backgroundParticles.rotation.y +=
          0.00010;

      }


      /* =========================================
         RENDER
      ========================================= */

      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );


        /*
          Recalculate camera framing,
          keeping her head centered.
        */

        if (
          model
        ) {

          setupPortraitCamera();

        }

      }

    );

  </script>

</body>

</html>
