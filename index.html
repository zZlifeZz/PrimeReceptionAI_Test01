<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prime Reception AI — 3D Hologram</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #010305;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

      background:
        radial-gradient(
          circle at 50% 36%,
          #0a1c26 0%,
          #041015 30%,
          #02070b 58%,
          #000000 100%
        );
    }

    /* =========================================
       DIGITAL SCAN LINES
    ========================================= */

    #stage::before {
      content: "";
      position: absolute;
      inset: 0;

      z-index: 4;

      pointer-events: none;

      opacity: 0.09;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(62, 224, 255, 0.00) 0px,
          rgba(62, 224, 255, 0.00) 3px,
          rgba(62, 224, 255, 0.16) 4px,
          rgba(62, 224, 255, 0.00) 5px
        );

      animation:
        scanMove 8s linear infinite;
    }

    @keyframes scanMove {

      from {
        background-position-y: 0px;
      }

      to {
        background-position-y: 120px;
      }

    }


    /* =========================================
       VIGNETTE
    ========================================= */

    #stage::after {
      content: "";
      position: absolute;
      inset: 0;

      z-index: 5;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 34%,
          rgba(0, 0, 0, 0.18) 58%,
          rgba(0, 0, 0, 0.72) 100%
        );
    }


    #stage canvas {
      position: relative;

      z-index: 1;

      display: block;

      width: 100%;
      height: 100%;
    }


    #status {
      position: absolute;

      z-index: 10;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      color: #72edff;

      font-family:
        Arial,
        sans-serif;

      font-size: 15px;

      letter-spacing: 0.09em;

      text-align: center;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="stage">

    <div id="status">
      INITIALIZING PRIME RECEPTION AI…
    </div>

  </div>


  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <script type="module">

    import * as THREE from 'three';

    import {
      GLTFLoader
    } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


    const stage =
      document.getElementById('stage');

    const status =
      document.getElementById('status');


    /* =====================================================
       SCENE
    ===================================================== */

    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(
        32,
        window.innerWidth /
        window.innerHeight,
        0.01,
        1000
      );


    /* =====================================================
       RENDERER
    ===================================================== */

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true,

        alpha: true

      });


    renderer.setPixelRatio(

      Math.min(

        window.devicePixelRatio || 1,

        2

      )

    );


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      1.0;


    renderer.setClearColor(

      0x000000,

      0

    );


    stage.appendChild(

      renderer.domElement

    );


    /* =====================================================
       LIGHTING
    ===================================================== */


    const ambient =
      new THREE.HemisphereLight(

        0xcfefff,

        0x020405,

        0.72

      );


    scene.add(

      ambient

    );


    /*
      Primary face illumination.
    */

    const faceLight =
      new THREE.DirectionalLight(

        0xf9ffff,

        2.25

      );


    faceLight.position.set(

      1.4,

      3.8,

      5.5

    );


    scene.add(

      faceLight

    );


    /*
      Strong cyan holographic rim.
    */

    const cyanRim =
      new THREE.DirectionalLight(

        0x22dfff,

        4.4

      );


    cyanRim.position.set(

      -4,

      3,

      -3.5

    );


    scene.add(

      cyanRim

    );


    /*
      Secondary cyan rim.
    */

    const cyanRimRight =
      new THREE.DirectionalLight(

        0x4ceaff,

        2.1

      );


    cyanRimRight.position.set(

      4,

      4,

      -3

    );


    scene.add(

      cyanRimRight

    );


    /*
      Prime gold accent.
    */

    const goldRim =
      new THREE.DirectionalLight(

        0xd3a64c,

        1.55

      );


    goldRim.position.set(

      3.5,

      2,

      -2

    );


    scene.add(

      goldRim

    );


    /*
      Lower cyan hologram glow.
    */

    const lowerGlow =
      new THREE.PointLight(

        0x13ccea,

        9,

        8

      );


    lowerGlow.position.set(

      0,

      -1.5,

      1.6

    );


    scene.add(

      lowerGlow

    );


    /*
      Face-area electronic glow.
    */

    const faceGlow =
      new THREE.PointLight(

        0x39e7ff,

        1.5,

        5

      );


    faceGlow.position.set(

      0,

      1.4,

      2.2

    );


    scene.add(

      faceGlow

    );


    /* =====================================================
       HOLOGRAPHIC MATERIALS
    ===================================================== */


    const bodyMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x9eafb5
          ),

        emissive:
          new THREE.Color(
            0x063842
          ),

        emissiveIntensity:
          0.24,

        metalness:
          0.48,

        roughness:
          0.32,

        clearcoat:
          0.38,

        clearcoatRoughness:
          0.26,

        sheen:
          0.22,

        sheenColor:
          new THREE.Color(
            0x36dbef
          )

      });


    /*
      Face deliberately less metallic
      than the rest of the body.
    */

    const faceMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xcbd7da
          ),

        emissive:
          new THREE.Color(
            0x06272d
          ),

        emissiveIntensity:
          0.12,

        metalness:
          0.22,

        roughness:
          0.39,

        clearcoat:
          0.25,

        clearcoatRoughness:
          0.29,

        sheen:
          0.12,

        sheenColor:
          new THREE.Color(
            0x42cfe5
          )

      });


    /*
      Professional near-black uniform.
    */

    const shirtMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x030608
          ),

        emissive:
          new THREE.Color(
            0x00151a
          ),

        emissiveIntensity:
          0.22,

        metalness:
          0.50,

        roughness:
          0.34,

        clearcoat:
          0.32,

        clearcoatRoughness:
          0.28

      });


    const leggingsMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x030608
          ),

        emissive:
          new THREE.Color(
            0x001319
          ),

        emissiveIntensity:
          0.18,

        metalness:
          0.47,

        roughness:
          0.36,

        clearcoat:
          0.28,

        clearcoatRoughness:
          0.30

      });


    const hairMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x030609
          ),

        emissive:
          new THREE.Color(
            0x001119
          ),

        emissiveIntensity:
          0.16,

        metalness:
          0.28,

        roughness:
          0.38,

        clearcoat:
          0.28,

        clearcoatRoughness:
          0.28

      });


    const eyeMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xe4fcff
          ),

        emissive:
          new THREE.Color(
            0x23dcf8
          ),

        emissiveIntensity:
          1.05,

        metalness:
          0.02,

        roughness:
          0.13,

        clearcoat:
          1,

        clearcoatRoughness:
          0.06

      });


    const eyeShellMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xc8f8ff
          ),

        emissive:
          new THREE.Color(
            0x0b6372
          ),

        emissiveIntensity:
          0.35,

        transparent:
          true,

        opacity:
          0.42,

        metalness:
          0,

        roughness:
          0.08,

        clearcoat:
          1

      });


    const darkDetailMaterial =
      new THREE.MeshStandardMaterial({

        color:
          new THREE.Color(
            0x010203
          ),

        metalness:
          0.12,

        roughness:
          0.45

      });


    const teethMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xf4f7f7
          ),

        metalness:
          0,

        roughness:
          0.30,

        clearcoat:
          0.18

      });


    const goldMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xcfa34a
          ),

        emissive:
          new THREE.Color(
            0x352308
          ),

        emissiveIntensity:
          0.18,

        metalness:
          0.76,

        roughness:
          0.26,

        clearcoat:
          0.35

      });


    function forceCleanMaterial(
      object,
      material
    ) {

      object.material =
        material;


      material.map =
        null;


      material.normalMap =
        null;


      material.roughnessMap =
        null;


      material.metalnessMap =
        null;


      material.aoMap =
        null;


      material.emissiveMap =
        null;


      material.alphaMap =
        null;


      material.lightMap =
        null;


      material.displacementMap =
        null;


      material.vertexColors =
        false;


      material.needsUpdate =
        true;

    }


    /* =====================================================
       CHARACTER REFERENCES
    ===================================================== */

    let model =
      null;


    let headBone =
      null;


    let neck01 =
      null;


    let neck02 =
      null;


    let eyeLObject =
      null;


    let eyeRObject =
      null;


    let baseHeadRotation =
      null;


    let baseNeck01Rotation =
      null;


    let baseNeck02Rotation =
      null;


    let baseEyeLRotation =
      null;


    let baseEyeRRotation =
      null;


    const blinkMeshes =
      [];


    /* =====================================================
       POINTER
    ===================================================== */

    const pointer =
      new THREE.Vector2(
        0,
        0
      );


    const targetPointer =
      new THREE.Vector2(
        0,
        0
      );


    window.addEventListener(

      'pointermove',

      function (
        event
      ) {

        let x =
          (
            event.clientX /
            window.innerWidth
          ) * 2 - 1;


        let y =
          -(
            (
              event.clientY /
              window.innerHeight
            ) * 2 - 1
          );


        const deadZone =
          0.055;


        if (
          Math.abs(
            x
          ) <
          deadZone
        ) {

          x =
            0;

        }


        if (
          Math.abs(
            y
          ) <
          deadZone
        ) {

          y =
            0;

        }


        x =
          Math.sign(
            x
          ) *
          Math.pow(
            Math.abs(
              x
            ),
            1.15
          );


        y =
          Math.sign(
            y
          ) *
          Math.pow(
            Math.abs(
              y
            ),
            1.15
          );


        targetPointer.set(

          THREE.MathUtils.clamp(
            x,
            -1,
            1
          ),

          THREE.MathUtils.clamp(
            y,
            -1,
            1
          )

        );

      }

    );


    document.documentElement.addEventListener(

      'mouseleave',

      function () {

        targetPointer.set(
          0,
          0
        );

      }

    );


    /* =====================================================
       PARTICLES
    ===================================================== */

    let particleSystem =
      null;


    let particlePositions =
      null;


    const particleSpeeds =
      [];


    function createParticles(
      size
    ) {

      const count =
        480;


      const geometry =
        new THREE.BufferGeometry();


      particlePositions =
        new Float32Array(
          count * 3
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const i3 =
          i * 3;


        particlePositions[
          i3
        ] =
          (
            Math.random() -
            0.5
          ) *
          size.x *
          2.4;


        particlePositions[
          i3 + 1
        ] =
          (
            Math.random() -
            0.45
          ) *
          size.y *
          1.25;


        particlePositions[
          i3 + 2
        ] =
          (
            Math.random() -
            0.5
          ) *
          size.z *
          5;


        particleSpeeds.push(

          0.002 +
          Math.random() *
          0.006

        );

      }


      geometry.setAttribute(

        'position',

        new THREE.BufferAttribute(
          particlePositions,
          3
        )

      );


      const material =
        new THREE.PointsMaterial({

          color:
            0x4be9ff,

          size:
            Math.max(
              size.y *
              0.0035,
              0.003
            ),

          transparent:
            true,

          opacity:
            0.48,

          depthWrite:
            false,

          blending:
            THREE.AdditiveBlending

        });


      particleSystem =
        new THREE.Points(
          geometry,
          material
        );


      scene.add(
        particleSystem
      );

    }


    function updateParticles(
      size
    ) {

      if (
        !particleSystem ||
        !particlePositions
      ) {

        return;

      }


      const positions =
        particleSystem
          .geometry
          .attributes
          .position;


      for (
        let i = 0;
        i < particleSpeeds.length;
        i++
      ) {

        const yIndex =
          i * 3 + 1;


        particlePositions[
          yIndex
        ] +=
          particleSpeeds[
            i
          ];


        if (
          particlePositions[
            yIndex
          ] >
          size.y *
          0.65
        ) {

          particlePositions[
            yIndex
          ] =
            -size.y *
            0.62;

        }

      }


      positions.needsUpdate =
        true;

    }


    /* =====================================================
       LOAD MODEL
    ===================================================== */

    const loader =
      new GLTFLoader();


    let modelSize =
      null;


    loader.load(

      './PrimeReceptionAI_Test01.glb',


      function (
        gltf
      ) {

        model =
          gltf.scene;


        scene.add(
          model
        );


        model.traverse(

          function (
            object
          ) {


            /* =============================================
               MESHES
            ============================================= */

            if (
              object.isMesh
            ) {

              const name =
                object.name;


              /*
                Find blink morphs.
              */

              if (
                object.morphTargetDictionary &&
                object.morphTargetInfluences
              ) {

                const dictionary =
                  object
                    .morphTargetDictionary;


                if (
                  dictionary.eyeBlinkLeft
                    !== undefined
                  ||
                  dictionary.eyeBlinkRight
                    !== undefined
                ) {

                  blinkMeshes.push(
                    object
                  );

                }

              }


              /*
                Hide unused meshes.
              */

              if (
                name ===
                  'SK_FemBase2_Censored_Torso'
                ||
                name ===
                  'SK_FemBase2_UnderWear'
              ) {

                object.visible =
                  false;


                return;

              }


              /*
                Synthetic body.
              */

              if (
                name ===
                  'Mesh010'
                ||
                name ===
                  'SK_FemBase2_Torso'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  bodyMaterial
                );


                return;

              }


              /*
                Face.
              */

              if (
                name ===
                  'Mesh010_1'
                ||
                name ===
                  'SK_FemBase2_Head_52ArKit'
                ||
                name ===
                  'SK_FemBase2_Head_52ARKit'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  faceMaterial
                );


                return;

              }


              /*
                Shirt.
              */

              if (
                name ===
                'SK_FemBase2_TShirt'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  shirtMaterial
                );


                return;

              }


              /*
                Leggings.
              */

              if (
                name ===
                'SK_FemBase2_Leggings'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  leggingsMaterial
                );


                return;

              }


              /*
                Hair.
              */

              if (
                name ===
                'SK_FemBase2_Hair'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  hairMaterial
                );


                return;

              }


              /*
                Left eye.
              */

              if (
                name ===
                'SK_FemBase2_EyeL'
              ) {

                eyeLObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeMaterial
                );


                return;

              }


              /*
                Right eye.
              */

              if (
                name ===
                'SK_FemBase2_EyeR'
              ) {

                eyeRObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeMaterial
                );


                return;

              }


              /*
                Eye shell.
              */

              if (
                name ===
                'SK_FemBase2_EyeShell'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeShellMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Lashes'
                ||
                name ===
                  'SK_FemBase2_EyeEdge'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  darkDetailMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Teeth'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  teethMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Nails'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  goldMaterial
                );


                return;

              }

            }


            /* =============================================
               BONES
            ============================================= */

            if (
              object.isBone
            ) {

              const lowerName =
                object
                  .name
                  .toLowerCase();


              if (
                lowerName ===
                  'head'
                ||
                lowerName.endsWith(
                  '_head'
                )
              ) {

                headBone =
                  object;

              }


              if (
                lowerName.includes(
                  'neck_01'
                )
              ) {

                neck01 =
                  object;

              }


              if (
                lowerName.includes(
                  'neck_02'
                )
              ) {

                neck02 =
                  object;

              }

            }

          }

        );


        /* =================================================
           STORE BASE ROTATIONS
        ================================================= */

        if (
          headBone
        ) {

          baseHeadRotation =
            headBone
              .rotation
              .clone();

        }


        if (
          neck01
        ) {

          baseNeck01Rotation =
            neck01
              .rotation
              .clone();

        }


        if (
          neck02
        ) {

          baseNeck02Rotation =
            neck02
              .rotation
              .clone();

        }


        if (
          eyeLObject
        ) {

          baseEyeLRotation =
            eyeLObject
              .rotation
              .clone();

        }


        if (
          eyeRObject
        ) {

          baseEyeRRotation =
            eyeRObject
              .rotation
              .clone();

        }


        /* =================================================
           CENTER MODEL
        ================================================= */

        const box =
          new THREE.Box3()
            .setFromObject(
              model
            );


        modelSize =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        model.position.set(

          -center.x,

          -center.y,

          -center.z

        );


        /* =================================================
           CAMERA
        ================================================= */

        const verticalFOV =
          THREE.MathUtils.degToRad(
            camera.fov
          );


        const upperBodyHeight =
          modelSize.y *
          0.78;


        let distance =
          upperBodyHeight /
          (
            2 *
            Math.tan(
              verticalFOV /
              2
            )
          );


        distance *=
          1.05;


        const targetHeight =
          modelSize.y *
          0.17;


        camera.position.set(

          0,

          targetHeight,

          distance

        );


        camera.lookAt(

          0,

          targetHeight,

          0

        );


        camera.near =
          Math.max(
            distance /
            100,
            0.01
          );


        camera.far =
          distance *
          100;


        camera.updateProjectionMatrix();


        /*
          Create the holographic particle field.
        */

        createParticles(
          modelSize
        );


        status.style.display =
          'none';


        scheduleNextBlink();

      },


      /* =========================================
         PROGRESS
      ========================================= */

      function (
        xhr
      ) {

        if (
          xhr.total
        ) {

          const percentage =
            Math.round(

              xhr.loaded /
              xhr.total *
              100

            );


          status.textContent =
            'INITIALIZING PRIME RECEPTION AI… ' +
            percentage +
            '%';

        }

      },


      /* =========================================
         ERROR
      ========================================= */

      function (
        error
      ) {

        console.error(
          error
        );


        status.textContent =
          'MODEL FAILED TO LOAD';

      }

    );


    /* =====================================================
       BLINKING
    ===================================================== */

    function setBlinkAmount(
      amount
    ) {

      const value =
        THREE.MathUtils.clamp(
          amount,
          0,
          1
        );


      for (
        const mesh
        of blinkMeshes
      ) {

        const dictionary =
          mesh
            .morphTargetDictionary;


        const influences =
          mesh
            .morphTargetInfluences;


        if (
          dictionary.eyeBlinkLeft !==
          undefined
        ) {

          influences[
            dictionary.eyeBlinkLeft
          ] =
            value;

        }


        if (
          dictionary.eyeBlinkRight !==
          undefined
        ) {

          influences[
            dictionary.eyeBlinkRight
          ] =
            value;

        }

      }

    }


    let blinkActive =
      false;


    let blinkStart =
      0;


    let blinkDuration =
      0.15;


    let nextBlink =
      Infinity;


    let doubleBlink =
      false;


    let secondBlinkAt =
      Infinity;


    function scheduleNextBlink() {

      nextBlink =
        performance.now() /
        1000 +
        2.3 +
        Math.random() *
        3.7;

    }


    function beginBlink() {

      blinkActive =
        true;


      blinkStart =
        performance.now() /
        1000;


      blinkDuration =
        0.12 +
        Math.random() *
        0.055;


      doubleBlink =
        Math.random() <
        0.12;

    }


    function updateBlink(
      now
    ) {

      if (
        !blinkActive &&
        now >=
        nextBlink
      ) {

        beginBlink();

      }


      if (
        !blinkActive &&
        doubleBlink &&
        now >=
        secondBlinkAt
      ) {

        doubleBlink =
          false;


        beginBlink();


        return;

      }


      if (
        !blinkActive
      ) {

        setBlinkAmount(
          0
        );


        return;

      }


      const progress =
        (
          now -
          blinkStart
        ) /
        blinkDuration;


      if (
        progress <=
        1
      ) {

        setBlinkAmount(

          Math.sin(

            progress *
            Math.PI

          )

        );

      }

      else {

        setBlinkAmount(
          0
        );


        blinkActive =
          false;


        if (
          doubleBlink
        ) {

          secondBlinkAt =
            now +
            0.15 +
            Math.random() *
            0.08;

        }

        else {

          scheduleNextBlink();

        }

      }

    }


    /* =====================================================
       TRACKING
    ===================================================== */

    const eyeHorizontalMax =
      THREE.MathUtils.degToRad(
        10
      );


    const eyeVerticalMax =
      THREE.MathUtils.degToRad(
        6
      );


    const headHorizontalMax =
      THREE.MathUtils.degToRad(
        4.2
      );


    const headVerticalMax =
      THREE.MathUtils.degToRad(
        2.2
      );


    const neckHorizontalMax =
      THREE.MathUtils.degToRad(
        1.25
      );


    const neckVerticalMax =
      THREE.MathUtils.degToRad(
        0.7
      );


    let eyeHorizontal =
      0;


    let eyeVertical =
      0;


    let headHorizontal =
      0;


    let headVertical =
      0;


    let neckHorizontal =
      0;


    let neckVertical =
      0;


    function damp(
      current,
      target,
      speed,
      delta
    ) {

      return THREE.MathUtils.lerp(

        current,

        target,

        1 -
        Math.exp(
          -speed *
          delta
        )

      );

    }


    /* =====================================================
       ANIMATION LOOP
    ===================================================== */

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(

          clock.getDelta(),

          0.05

        );


      const now =
        performance.now() /
        1000;


      /* =========================================
         POINTER SMOOTHING
      ========================================= */

      pointer.x =
        damp(

          pointer.x,

          targetPointer.x,

          7,

          delta

        );


      pointer.y =
        damp(

          pointer.y,

          targetPointer.y,

          7,

          delta

        );


      /* =========================================
         EYES
      ========================================= */

      eyeHorizontal =
        damp(

          eyeHorizontal,

          pointer.x *
          eyeHorizontalMax,

          14,

          delta

        );


      eyeVertical =
        damp(

          eyeVertical,

          pointer.y *
          eyeVerticalMax,

          14,

          delta

        );


      /* =========================================
         HEAD
      ========================================= */

      headHorizontal =
        damp(

          headHorizontal,

          pointer.x *
          headHorizontalMax,

          2.7,

          delta

        );


      headVertical =
        damp(

          headVertical,

          pointer.y *
          headVerticalMax,

          2.5,

          delta

        );


      /* =========================================
         NECK
      ========================================= */

      neckHorizontal =
        damp(

          neckHorizontal,

          pointer.x *
          neckHorizontalMax,

          1.65,

          delta

        );


      neckVertical =
        damp(

          neckVertical,

          pointer.y *
          neckVerticalMax,

          1.5,

          delta

        );


      /* =========================================
         APPLY EYE ROTATIONS
      ========================================= */

      if (
        eyeLObject &&
        baseEyeLRotation
      ) {

        eyeLObject.rotation.copy(
          baseEyeLRotation
        );


        eyeLObject.rotation.y +=
          eyeHorizontal;


        eyeLObject.rotation.x -=
          eyeVertical;

      }


      if (
        eyeRObject &&
        baseEyeRRotation
      ) {

        eyeRObject.rotation.copy(
          baseEyeRRotation
        );


        eyeRObject.rotation.y +=
          eyeHorizontal;


        eyeRObject.rotation.x -=
          eyeVertical;

      }


      /* =========================================
         APPLY HEAD ROTATIONS
      ========================================= */

      if (
        headBone &&
        baseHeadRotation
      ) {

        headBone.rotation.copy(
          baseHeadRotation
        );


        /*
          Correct rig axis:
          X = left/right
        */

        headBone.rotation.x +=
          headHorizontal;


        /*
          Correct rig axis:
          Z = up/down
        */

        headBone.rotation.z +=
          headVertical;


        /*
          Do not touch Y.
        */

        headBone.rotation.y =
          baseHeadRotation.y;

      }


      /* =========================================
         NECK 02
      ========================================= */

      if (
        neck02 &&
        baseNeck02Rotation
      ) {

        neck02.rotation.copy(
          baseNeck02Rotation
        );


        neck02.rotation.x +=
          neckHorizontal;


        neck02.rotation.z +=
          neckVertical;


        neck02.rotation.y =
          baseNeck02Rotation.y;

      }


      /* =========================================
         NECK 01
      ========================================= */

      if (
        neck01 &&
        baseNeck01Rotation
      ) {

        neck01.rotation.copy(
          baseNeck01Rotation
        );


        neck01.rotation.x +=
          neckHorizontal *
          0.30;


        neck01.rotation.z +=
          neckVertical *
          0.22;


        neck01.rotation.y =
          baseNeck01Rotation.y;

      }


      /* =========================================
         BLINK
      ========================================= */

      updateBlink(
        now
      );


      /* =========================================
         HOLOGRAPHIC LIGHT PULSE
      ========================================= */

      const pulse =
        0.5 +
        Math.sin(
          now *
          1.25
        ) *
        0.5;


      lowerGlow.intensity =
        7.5 +
        pulse *
        2.0;


      faceGlow.intensity =
        1.25 +
        pulse *
        0.35;


      eyeMaterial.emissiveIntensity =
        0.92 +
        pulse *
        0.18;


      bodyMaterial.emissiveIntensity =
        0.20 +
        pulse *
        0.06;


      /* =========================================
         PARTICLES
      ========================================= */

      if (
        modelSize
      ) {

        updateParticles(
          modelSize
        );

      }


      if (
        particleSystem
      ) {

        particleSystem.rotation.y +=
          0.00035;

      }


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );

      }

    );

  </script>

</body>
</html>
