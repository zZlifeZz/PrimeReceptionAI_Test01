<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prime Reception AI — Digital Receptionist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 50% 38%,
          #0a1b26 0%,
          #05131b 27%,
          #02080d 54%,
          #000000 100%
        );
    }

    /* very subtle scan texture */
    #stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;

      opacity: 0.03;

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 5px,
          rgba(71, 229, 255, 0.14) 6px,
          transparent 7px
        );

      animation: scanMove 12s linear infinite;
    }

    @keyframes scanMove {
      from {
        background-position-y: 0;
      }

      to {
        background-position-y: 220px;
      }
    }

    /* cinematic vignette */
    #stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 36%,
          rgba(0, 0, 0, 0.10) 58%,
          rgba(0, 0, 0, 0.78) 100%
        );
    }

    #stage canvas {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      z-index: 20;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      font-family: Arial, sans-serif;
      color: #67e9ff;
      font-size: 14px;
      letter-spacing: 0.11em;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="stage">
    <div id="status">
      INITIALIZING PRIME RECEPTION AI…
    </div>
  </div>


  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <script type="module">

    import * as THREE from 'three';

    import {
      GLTFLoader
    } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


    /* =====================================================
       DOM
    ===================================================== */

    const stage =
      document.getElementById('stage');

    const status =
      document.getElementById('status');


    /* =====================================================
       SCENE
    ===================================================== */

    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(
        31,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
      );


    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        2
      )
    );


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      1.02;


    renderer.setClearColor(
      0x000000,
      0
    );


    stage.appendChild(
      renderer.domElement
    );


    /* =====================================================
       LIGHTING
    ===================================================== */

    const ambient =
      new THREE.HemisphereLight(
        0xe9f9ff,
        0x020405,
        0.88
      );

    scene.add(
      ambient
    );


    const keyLight =
      new THREE.DirectionalLight(
        0xfffaf2,
        2.75
      );

    keyLight.position.set(
      1.5,
      4,
      5.8
    );

    scene.add(
      keyLight
    );


    const cyanLeft =
      new THREE.DirectionalLight(
        0x22ddff,
        4.7
      );

    cyanLeft.position.set(
      -4.3,
      3.6,
      -3.5
    );

    scene.add(
      cyanLeft
    );


    const cyanRight =
      new THREE.DirectionalLight(
        0x69efff,
        2.6
      );

    cyanRight.position.set(
      4,
      3,
      -3.2
    );

    scene.add(
      cyanRight
    );


    const goldLight =
      new THREE.DirectionalLight(
        0xd7aa50,
        1.1
      );

    goldLight.position.set(
      3.5,
      2.6,
      -1.8
    );

    scene.add(
      goldLight
    );


    const lowerGlow =
      new THREE.PointLight(
        0x24ddff,
        9.5,
        8
      );

    lowerGlow.position.set(
      0,
      -1.5,
      1.5
    );

    scene.add(
      lowerGlow
    );


    const faceFill =
      new THREE.PointLight(
        0x74ebff,
        0.8,
        4.5
      );

    faceFill.position.set(
      0,
      1.6,
      2.3
    );

    scene.add(
      faceFill
    );


    /* =====================================================
       MATERIALS
    ===================================================== */

    const bodyMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xb8c7cb),

        emissive:
          new THREE.Color(0x03242b),

        emissiveIntensity:
          0.075,

        metalness:
          0.18,

        roughness:
          0.39,

        clearcoat:
          0.30,

        clearcoatRoughness:
          0.28,

        sheen:
          0.14,

        sheenColor:
          new THREE.Color(0x5bdcec)

      });


    const faceMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xd8dfe0),

        emissive:
          new THREE.Color(0x021418),

        emissiveIntensity:
          0.035,

        metalness:
          0.035,

        roughness:
          0.46,

        clearcoat:
          0.17,

        clearcoatRoughness:
          0.34,

        sheen:
          0.07,

        sheenColor:
          new THREE.Color(0x78d9e6)

      });


    const shirtMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xd9e3e5),

        emissive:
          new THREE.Color(0x042d35),

        emissiveIntensity:
          0.085,

        metalness:
          0.24,

        roughness:
          0.31,

        clearcoat:
          0.41,

        clearcoatRoughness:
          0.22,

        sheen:
          0.21,

        sheenColor:
          new THREE.Color(0x55e5f5)

      });


    const leggingsMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xc5d1d5),

        emissive:
          new THREE.Color(0x032830),

        emissiveIntensity:
          0.07,

        metalness:
          0.27,

        roughness:
          0.32,

        clearcoat:
          0.38,

        clearcoatRoughness:
          0.25,

        sheen:
          0.17,

        sheenColor:
          new THREE.Color(0x45d9eb)

      });


    const hairMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0x030609),

        emissive:
          new THREE.Color(0x00141b),

        emissiveIntensity:
          0.11,

        metalness:
          0.16,

        roughness:
          0.39,

        clearcoat:
          0.25,

        clearcoatRoughness:
          0.28

      });


    const eyeMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xe8fcff),

        emissive:
          new THREE.Color(0x25d9f5),

        emissiveIntensity:
          0.82,

        metalness:
          0.01,

        roughness:
          0.15,

        clearcoat:
          1,

        clearcoatRoughness:
          0.05

      });


    const eyeShellMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          0xd4faff,

        emissive:
          0x064b57,

        emissiveIntensity:
          0.20,

        transparent:
          true,

        opacity:
          0.31,

        metalness:
          0,

        roughness:
          0.08,

        clearcoat:
          1

      });


    const darkDetailMaterial =
      new THREE.MeshStandardMaterial({

        color:
          0x010203,

        roughness:
          0.46

      });


    const teethMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          0xf5f6f4,

        roughness:
          0.33,

        clearcoat:
          0.12

      });


    const goldMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          0xd2a449,

        emissive:
          0x281900,

        emissiveIntensity:
          0.10,

        metalness:
          0.72,

        roughness:
          0.27

      });


    function forceCleanMaterial(
      object,
      material
    ) {

      object.material =
        material;

      material.map =
        null;

      material.normalMap =
        null;

      material.roughnessMap =
        null;

      material.metalnessMap =
        null;

      material.aoMap =
        null;

      material.emissiveMap =
        null;

      material.alphaMap =
        null;

      material.lightMap =
        null;

      material.displacementMap =
        null;

      material.vertexColors =
        false;

      material.needsUpdate =
        true;

    }


    /* =====================================================
       MODEL VARIABLES — DECLARED ONCE ONLY
    ===================================================== */

    let model =
      null;

    let modelSize =
      null;

    let headBone =
      null;

    let neck01 =
      null;

    let neck02 =
      null;

    let eyeLObject =
      null;

    let eyeRObject =
      null;

    let baseHeadRotation =
      null;

    let baseNeck01Rotation =
      null;

    let baseNeck02Rotation =
      null;

    let baseEyeLRotation =
      null;

    let baseEyeRRotation =
      null;


    const blinkMeshes =
      [];


    const smileMeshes =
      [];


    /* =====================================================
       POINTER
    ===================================================== */

    const pointer =
      new THREE.Vector2(
        0,
        0
      );


    const targetPointer =
      new THREE.Vector2(
        0,
        0
      );


    window.addEventListener(

      'pointermove',

      function (event) {

        let x =
          (
            event.clientX /
            window.innerWidth
          ) * 2 - 1;


        let y =
          -(
            (
              event.clientY /
              window.innerHeight
            ) * 2 - 1
          );


        const deadZone =
          0.055;


        if (
          Math.abs(x) <
          deadZone
        ) {

          x =
            0;

        }


        if (
          Math.abs(y) <
          deadZone
        ) {

          y =
            0;

        }


        x =
          Math.sign(x) *
          Math.pow(
            Math.abs(x),
            1.15
          );


        y =
          Math.sign(y) *
          Math.pow(
            Math.abs(y),
            1.15
          );


        targetPointer.set(

          THREE.MathUtils.clamp(
            x,
            -1,
            1
          ),

          THREE.MathUtils.clamp(
            y,
            -1,
            1
          )

        );

      }

    );


    document.documentElement.addEventListener(

      'mouseleave',

      function () {

        targetPointer.set(
          0,
          0
        );

      }

    );


    /* =====================================================
       BACKGROUND PARTICLES
    ===================================================== */

    let backgroundParticles =
      null;


    function createBackgroundParticles(
      size
    ) {

      const count =
        270;


      const positions =
        new Float32Array(
          count * 3
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const i3 =
          i * 3;


        positions[i3] =
          (
            Math.random() -
            0.5
          ) *
          size.x *
          3.1;


        positions[i3 + 1] =
          (
            Math.random() -
            0.44
          ) *
          size.y *
          1.35;


        positions[i3 + 2] =
          (
            Math.random() -
            0.5
          ) *
          Math.max(
            size.x * 3,
            size.z * 5
          );

      }


      const geometry =
        new THREE.BufferGeometry();


      geometry.setAttribute(

        'position',

        new THREE.BufferAttribute(
          positions,
          3
        )

      );


      const material =
        new THREE.PointsMaterial({

          color:
            0x36ddff,

          size:
            Math.max(
              size.y *
              0.0022,
              0.002
            ),

          transparent:
            true,

          opacity:
            0.19,

          depthWrite:
            false,

          blending:
            THREE.AdditiveBlending

        });


      backgroundParticles =
        new THREE.Points(
          geometry,
          material
        );


      scene.add(
        backgroundParticles
      );

    }


    /* =====================================================
       PROJECTOR / WATER EFFECT
    ===================================================== */

    const projectorGroup =
      new THREE.Group();


    scene.add(
      projectorGroup
    );


    let waterMaterial =
      null;


    let projectorY =
      0;


    function createProjector(
      size
    ) {

      projectorY =
        -size.y *
        0.39;


      const radius =
        size.x *
        0.70;


      const waterGeometry =
        new THREE.CircleGeometry(
          radius,
          128
        );


      waterMaterial =
        new THREE.ShaderMaterial({

          transparent:
            true,

          depthWrite:
            false,

          side:
            THREE.DoubleSide,

          blending:
            THREE.AdditiveBlending,

          uniforms: {

            uTime: {
              value: 0
            }

          },

          vertexShader: `

            varying vec2 vUv;

            void main() {

              vUv =
                uv;

              gl_Position =
                projectionMatrix *
                modelViewMatrix *
                vec4(
                  position,
                  1.0
                );

            }

          `,

          fragmentShader: `

            uniform float uTime;

            varying vec2 vUv;

            void main() {

              vec2 p =
                vUv -
                vec2(0.5);


              float d =
                length(p) *
                2.0;


              float mask =
                1.0 -
                smoothstep(
                  0.70,
                  1.0,
                  d
                );


              float waveA =
                sin(
                  d *
                  74.0 -
                  uTime *
                  4.0
                );


              float waveB =
                sin(
                  d *
                  115.0 -
                  uTime *
                  6.1
                );


              waveA =
                smoothstep(
                  0.67,
                  1.0,
                  waveA
                );


              waveB =
                smoothstep(
                  0.72,
                  1.0,
                  waveB
                );


              float center =
                1.0 -
                smoothstep(
                  0.0,
                  0.62,
                  d
                );


              float alpha =
                (
                  waveA *
                  0.35 +
                  waveB *
                  0.22 +
                  center *
                  0.14
                ) *
                mask;


              gl_FragColor =
                vec4(
                  0.05,
                  0.80,
                  1.0,
                  alpha
                );

            }

          `

        });


      const water =
        new THREE.Mesh(
          waterGeometry,
          waterMaterial
        );


      water.rotation.x =
        -Math.PI / 2;


      water.position.y =
        projectorY;


      projectorGroup.add(
        water
      );


      const ringData = [

        [0.72, 0.009, 0.68],

        [0.88, 0.005, 0.42],

        [1.03, 0.0036, 0.27],

        [1.21, 0.0025, 0.14]

      ];


      for (
        const values
        of ringData
      ) {

        const material =
          new THREE.MeshBasicMaterial({

            color:
              0x41e8ff,

            transparent:
              true,

            opacity:
              values[2],

            depthWrite:
              false,

            blending:
              THREE.AdditiveBlending

          });


        const ring =
          new THREE.Mesh(

            new THREE.TorusGeometry(

              radius *
              values[0],

              radius *
              values[1],

              10,

              128

            ),

            material

          );


        ring.rotation.x =
          Math.PI / 2;


        ring.position.y =
          projectorY +
          0.001;


        ring.userData.phase =
          Math.random() *
          Math.PI *
          2;


        projectorGroup.add(
          ring
        );

      }

    }


    /* =====================================================
       LOWER DIGITAL PARTICLES
    ===================================================== */

    let lowerParticles =
      null;


    let lowerPositions =
      null;


    const lowerSpeeds =
      [];


    function createLowerParticles(
      size
    ) {

      const count =
        340;


      lowerPositions =
        new Float32Array(
          count * 3
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const i3 =
          i * 3;


        const angle =
          Math.random() *
          Math.PI *
          2;


        const radius =
          Math.sqrt(
            Math.random()
          ) *
          size.x *
          0.42;


        lowerPositions[i3] =
          Math.cos(angle) *
          radius;


        lowerPositions[i3 + 1] =
          projectorY +
          Math.random() *
          size.y *
          0.17;


        lowerPositions[i3 + 2] =
          Math.sin(angle) *
          radius *
          0.38;


        lowerSpeeds.push(

          0.0012 +
          Math.random() *
          0.0045

        );

      }


      const geometry =
        new THREE.BufferGeometry();


      geometry.setAttribute(

        'position',

        new THREE.BufferAttribute(
          lowerPositions,
          3
        )

      );


      const material =
        new THREE.PointsMaterial({

          color:
            0x43e6ff,

          size:
            Math.max(
              size.y *
              0.0028,
              0.0025
            ),

          transparent:
            true,

          opacity:
            0.42,

          depthWrite:
            false,

          blending:
            THREE.AdditiveBlending

        });


      lowerParticles =
        new THREE.Points(
          geometry,
          material
        );


      scene.add(
        lowerParticles
      );

    }


    function updateLowerParticles(
      size,
      now
    ) {

      if (
        !lowerParticles ||
        !lowerPositions
      ) {

        return;

      }


      const upperLimit =
        projectorY +
        size.y *
        0.17;


      for (
        let i = 0;
        i < lowerSpeeds.length;
        i++
      ) {

        const i3 =
          i * 3;


        lowerPositions[i3 + 1] +=
          lowerSpeeds[i];


        lowerPositions[i3] +=
          Math.sin(
            now *
            2 +
            i
          ) *
          0.000018;


        if (
          lowerPositions[i3 + 1] >
          upperLimit
        ) {

          lowerPositions[i3 + 1] =
            projectorY;

        }

      }


      lowerParticles
        .geometry
        .attributes
        .position
        .needsUpdate =
          true;

    }


    /* =====================================================
       FACIAL MORPHS / SMILE
    ===================================================== */

    const smileLeftNames = [

      'mouthSmileLeft',

      'MouthSmileLeft',

      'mouth_smile_left',

      'SmileLeft'

    ];


    const smileRightNames = [

      'mouthSmileRight',

      'MouthSmileRight',

      'mouth_smile_right',

      'SmileRight'

    ];


    function findMorphIndex(
      dictionary,
      names
    ) {

      for (
        const name
        of names
      ) {

        if (
          dictionary[name] !==
          undefined
        ) {

          return dictionary[name];

        }

      }


      return null;

    }


    function registerFacialMorphs(
      object
    ) {

      if (
        !object.morphTargetDictionary ||
        !object.morphTargetInfluences
      ) {

        return;

      }


      const dictionary =
        object.morphTargetDictionary;


      if (
        dictionary.eyeBlinkLeft !==
          undefined
        ||
        dictionary.eyeBlinkRight !==
          undefined
      ) {

        blinkMeshes.push(
          object
        );

      }


      const smileLeft =
        findMorphIndex(
          dictionary,
          smileLeftNames
        );


      const smileRight =
        findMorphIndex(
          dictionary,
          smileRightNames
        );


      if (
        smileLeft !== null ||
        smileRight !== null
      ) {

        smileMeshes.push({

          mesh:
            object,

          left:
            smileLeft,

          right:
            smileRight

        });

      }

    }


    /*
      Small professional smile.
    */
    const RESTING_SMILE =
      0.18;


    function applyRestingSmile() {

      for (
        const entry
        of smileMeshes
      ) {

        const influences =
          entry
            .mesh
            .morphTargetInfluences;


        if (
          entry.left !==
          null
        ) {

          influences[
            entry.left
          ] =
            RESTING_SMILE;

        }


        if (
          entry.right !==
          null
        ) {

          influences[
            entry.right
          ] =
            RESTING_SMILE;

        }

      }

    }


    /* =====================================================
       LOAD MODEL
    ===================================================== */

    const loader =
      new GLTFLoader();


    loader.load(

      './PrimeReceptionAI_Test01.glb',


      function (gltf) {

        model =
          gltf.scene;


        scene.add(
          model
        );


        model.traverse(

          function (object) {


            if (
              object.isMesh
            ) {

              const name =
                object.name;


              registerFacialMorphs(
                object
              );


              /*
                Hide unwanted auxiliary layers.
              */
              if (
                name ===
                  'SK_FemBase2_Censored_Torso'
                ||
                name ===
                  'SK_FemBase2_UnderWear'
              ) {

                object.visible =
                  false;


                return;

              }


              /*
                Body.
              */
              if (
                name ===
                  'Mesh010'
                ||
                name ===
                  'SK_FemBase2_Torso'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  bodyMaterial
                );


                return;

              }


              /*
                Face.
              */
              if (
                name ===
                  'Mesh010_1'
                ||
                name ===
                  'SK_FemBase2_Head_52ArKit'
                ||
                name ===
                  'SK_FemBase2_Head_52ARKit'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  faceMaterial
                );


                return;

              }


              /*
                Shirt.
              */
              if (
                name ===
                  'SK_FemBase2_TShirt'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  shirtMaterial
                );


                return;

              }


              /*
                Leggings.
              */
              if (
                name ===
                  'SK_FemBase2_Leggings'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  leggingsMaterial
                );


                return;

              }


              /*
                Hair.
              */
              if (
                name ===
                  'SK_FemBase2_Hair'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  hairMaterial
                );


                return;

              }


              /*
                Left eye.
              */
              if (
                name ===
                  'SK_FemBase2_EyeL'
              ) {

                eyeLObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeMaterial
                );


                return;

              }


              /*
                Right eye.
              */
              if (
                name ===
                  'SK_FemBase2_EyeR'
              ) {

                eyeRObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_EyeShell'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeShellMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Lashes'
                ||
                name ===
                  'SK_FemBase2_EyeEdge'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  darkDetailMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Teeth'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  teethMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Nails'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  goldMaterial
                );


                return;

              }

            }


            /*
              Bones.
            */
            if (
              object.isBone
            ) {

              const lowerName =
                object.name.toLowerCase();


              if (
                lowerName ===
                  'head'
                ||
                lowerName.endsWith(
                  '_head'
                )
              ) {

                headBone =
                  object;

              }


              if (
                lowerName.includes(
                  'neck_01'
                )
              ) {

                neck01 =
                  object;

              }


              if (
                lowerName.includes(
                  'neck_02'
                )
              ) {

                neck02 =
                  object;

              }

            }

          }

        );


        console.log(
          'SMILE MORPH MESHES:',
          smileMeshes.length
        );


        /* =================================================
           SAVE ORIGINAL ROTATIONS
        ================================================= */

        if (
          headBone
        ) {

          baseHeadRotation =
            headBone.rotation.clone();

        }


        if (
          neck01
        ) {

          baseNeck01Rotation =
            neck01.rotation.clone();

        }


        if (
          neck02
        ) {

          baseNeck02Rotation =
            neck02.rotation.clone();

        }


        if (
          eyeLObject
        ) {

          baseEyeLRotation =
            eyeLObject.rotation.clone();

        }


        if (
          eyeRObject
        ) {

          baseEyeRRotation =
            eyeRObject.rotation.clone();

        }


        /* =================================================
           CENTER MODEL
        ================================================= */

        const box =
          new THREE.Box3()
            .setFromObject(
              model
            );


        modelSize =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        model.position.set(

          -center.x,

          -center.y,

          -center.z

        );


        /* =================================================
           CAMERA
        ================================================= */

        const verticalFOV =
          THREE.MathUtils.degToRad(
            camera.fov
          );


        const visibleHeight =
          modelSize.y *
          0.73;


        let distance =
          visibleHeight /
          (
            2 *
            Math.tan(
              verticalFOV /
              2
            )
          );


        distance *=
          1.04;


        const targetHeight =
          modelSize.y *
          0.15;


        camera.position.set(

          0,

          targetHeight,

          distance

        );


        camera.lookAt(

          0,

          targetHeight,

          0

        );


        camera.near =
          Math.max(
            distance /
            100,
            0.01
          );


        camera.far =
          distance *
          100;


        camera.updateProjectionMatrix();


        /* =================================================
           EFFECTS
        ================================================= */

        createBackgroundParticles(
          modelSize
        );


        createProjector(
          modelSize
        );


        createLowerParticles(
          modelSize
        );


        applyRestingSmile();


        status.style.display =
          'none';


        scheduleNextBlink();

      },


      function (xhr) {

        if (
          xhr.total
        ) {

          const percentage =
            Math.round(

              xhr.loaded /
              xhr.total *
              100

            );


          status.textContent =
            'INITIALIZING PRIME RECEPTION AI… ' +
            percentage +
            '%';

        }

      },


      function (error) {

        console.error(
          'GLB ERROR:',
          error
        );


        status.textContent =
          'MODEL FAILED TO LOAD';

      }

    );


    /* =====================================================
       BLINK
    ===================================================== */

    function setBlinkAmount(
      amount
    ) {

      const value =
        THREE.MathUtils.clamp(
          amount,
          0,
          1
        );


      for (
        const mesh
        of blinkMeshes
      ) {

        const dictionary =
          mesh.morphTargetDictionary;


        const influences =
          mesh.morphTargetInfluences;


        if (
          dictionary.eyeBlinkLeft !==
          undefined
        ) {

          influences[
            dictionary.eyeBlinkLeft
          ] =
            value;

        }


        if (
          dictionary.eyeBlinkRight !==
          undefined
        ) {

          influences[
            dictionary.eyeBlinkRight
          ] =
            value;

        }

      }

    }


    let blinkActive =
      false;


    let blinkStart =
      0;


    let blinkDuration =
      0.15;


    let nextBlink =
      Infinity;


    let doubleBlink =
      false;


    let secondBlinkAt =
      Infinity;


    function scheduleNextBlink() {

      nextBlink =
        performance.now() /
        1000 +
        2.4 +
        Math.random() *
        3.8;

    }


    function beginBlink() {

      blinkActive =
        true;


      blinkStart =
        performance.now() /
        1000;


      blinkDuration =
        0.12 +
        Math.random() *
        0.05;


      doubleBlink =
        Math.random() <
        0.10;

    }


    function updateBlink(
      now
    ) {

      if (
        !blinkActive &&
        now >= nextBlink
      ) {

        beginBlink();

      }


      if (
        !blinkActive &&
        doubleBlink &&
        now >= secondBlinkAt
      ) {

        doubleBlink =
          false;


        beginBlink();


        return;

      }


      if (
        !blinkActive
      ) {

        setBlinkAmount(
          0
        );


        return;

      }


      const progress =
        (
          now -
          blinkStart
        ) /
        blinkDuration;


      if (
        progress <= 1
      ) {

        setBlinkAmount(

          Math.sin(
            progress *
            Math.PI
          )

        );

      }

      else {

        setBlinkAmount(
          0
        );


        blinkActive =
          false;


        if (
          doubleBlink
        ) {

          secondBlinkAt =
            now +
            0.15 +
            Math.random() *
            0.07;

        }

        else {

          scheduleNextBlink();

        }

      }

    }


    /* =====================================================
       TRACKING
    ===================================================== */

    const eyeHorizontalMax =
      THREE.MathUtils.degToRad(
        10
      );


    const eyeVerticalMax =
      THREE.MathUtils.degToRad(
        6
      );


    const headHorizontalMax =
      THREE.MathUtils.degToRad(
        4.2
      );


    const headVerticalMax =
      THREE.MathUtils.degToRad(
        2.2
      );


    const neckHorizontalMax =
      THREE.MathUtils.degToRad(
        1.25
      );


    const neckVerticalMax =
      THREE.MathUtils.degToRad(
        0.7
      );


    let eyeHorizontal =
      0;


    let eyeVertical =
      0;


    let headHorizontal =
      0;


    let headVertical =
      0;


    let neckHorizontal =
      0;


    let neckVertical =
      0;


    function damp(
      current,
      target,
      speed,
      delta
    ) {

      return THREE.MathUtils.lerp(

        current,

        target,

        1 -
        Math.exp(
          -speed *
          delta
        )

      );

    }


    /* =====================================================
       ANIMATION
    ===================================================== */

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(
          clock.getDelta(),
          0.05
        );


      const now =
        performance.now() /
        1000;


      /* pointer smoothing */

      pointer.x =
        damp(
          pointer.x,
          targetPointer.x,
          7,
          delta
        );


      pointer.y =
        damp(
          pointer.y,
          targetPointer.y,
          7,
          delta
        );


      /* eyes */

      eyeHorizontal =
        damp(
          eyeHorizontal,
          pointer.x *
          eyeHorizontalMax,
          14,
          delta
        );


      eyeVertical =
        damp(
          eyeVertical,
          pointer.y *
          eyeVerticalMax,
          14,
          delta
        );


      /* head */

      headHorizontal =
        damp(
          headHorizontal,
          pointer.x *
          headHorizontalMax,
          2.7,
          delta
        );


      headVertical =
        damp(
          headVertical,
          pointer.y *
          headVerticalMax,
          2.5,
          delta
        );


      /* neck */

      neckHorizontal =
        damp(
          neckHorizontal,
          pointer.x *
          neckHorizontalMax,
          1.65,
          delta
        );


      neckVertical =
        damp(
          neckVertical,
          pointer.y *
          neckVerticalMax,
          1.5,
          delta
        );


      /* apply eye rotations */

      if (
        eyeLObject &&
        baseEyeLRotation
      ) {

        eyeLObject.rotation.copy(
          baseEyeLRotation
        );


        eyeLObject.rotation.y +=
          eyeHorizontal;


        eyeLObject.rotation.x -=
          eyeVertical;

      }


      if (
        eyeRObject &&
        baseEyeRRotation
      ) {

        eyeRObject.rotation.copy(
          baseEyeRRotation
        );


        eyeRObject.rotation.y +=
          eyeHorizontal;


        eyeRObject.rotation.x -=
          eyeVertical;

      }


      /*
        Confirmed rig mapping:
        X = left/right
        Z = up/down
      */

      if (
        headBone &&
        baseHeadRotation
      ) {

        headBone.rotation.copy(
          baseHeadRotation
        );


        headBone.rotation.x +=
          headHorizontal;


        headBone.rotation.z +=
          headVertical;


        headBone.rotation.y =
          baseHeadRotation.y;

      }


      if (
        neck02 &&
        baseNeck02Rotation
      ) {

        neck02.rotation.copy(
          baseNeck02Rotation
        );


        neck02.rotation.x +=
          neckHorizontal;


        neck02.rotation.z +=
          neckVertical;


        neck02.rotation.y =
          baseNeck02Rotation.y;

      }


      if (
        neck01 &&
        baseNeck01Rotation
      ) {

        neck01.rotation.copy(
          baseNeck01Rotation
        );


        neck01.rotation.x +=
          neckHorizontal *
          0.30;


        neck01.rotation.z +=
          neckVertical *
          0.22;


        neck01.rotation.y =
          baseNeck01Rotation.y;

      }


      /* face */

      applyRestingSmile();


      updateBlink(
        now
      );


      /* subtle electronic pulse */

      const pulse =
        0.5 +
        Math.sin(
          now *
          1.15
        ) *
        0.5;


      lowerGlow.intensity =
        8 +
        pulse *
        1.6;


      faceFill.intensity =
        0.70 +
        pulse *
        0.16;


      bodyMaterial.emissiveIntensity =
        0.060 +
        pulse *
        0.028;


      shirtMaterial.emissiveIntensity =
        0.070 +
        pulse *
        0.035;


      leggingsMaterial.emissiveIntensity =
        0.055 +
        pulse *
        0.026;


      eyeMaterial.emissiveIntensity =
        0.75 +
        pulse *
        0.16;


      /* water */

      if (
        waterMaterial
      ) {

        waterMaterial
          .uniforms
          .uTime
          .value =
            now;

      }


      /* ring breathing */

      for (
        let i = 1;
        i < projectorGroup.children.length;
        i++
      ) {

        const ring =
          projectorGroup.children[i];


        if (
          ring.userData.phase ===
          undefined
        ) {

          continue;

        }


        const scale =
          1 +
          Math.sin(
            now *
            1.1 +
            ring.userData.phase
          ) *
          0.014;


        ring.scale.set(
          scale,
          scale,
          scale
        );

      }


      if (
        modelSize
      ) {

        updateLowerParticles(
          modelSize,
          now
        );

      }


      if (
        backgroundParticles
      ) {

        backgroundParticles.rotation.y +=
          0.00012;

      }


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }

    );

  </script>

</body>
</html>
