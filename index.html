<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prime Reception AI — 3D Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02070c;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

      background:
        radial-gradient(
          circle at center,
          #071722 0%,
          #02070c 55%,
          #000000 100%
        );
    }

    #stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      z-index: 10;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      color: #6eeaff;

      font-family:
        Arial,
        sans-serif;

      font-size: 15px;

      letter-spacing: 0.08em;

      text-align: center;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="stage">

    <div id="status">
      Loading Prime Reception AI…
    </div>

  </div>


  <!-- THREE.JS IMPORT MAP -->

  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <script type="module">

    import * as THREE from 'three';

    import {
      GLTFLoader
    } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


    /* ==========================================
       PRIME RECEPTION AI
       THREE.JS CHARACTER VIEWER
    ========================================== */


    const stage =
      document.getElementById('stage');

    const status =
      document.getElementById('status');


    /* ==========================================
       SCENE
    ========================================== */

    const scene =
      new THREE.Scene();


    /* ==========================================
       CAMERA
    ========================================== */

    const camera =
      new THREE.PerspectiveCamera(
        32,
        window.innerWidth /
        window.innerHeight,
        0.01,
        1000
      );


    /* ==========================================
       RENDERER
    ========================================== */

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        2
      )
    );


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.setClearColor(
      0x000000,
      0
    );


    stage.appendChild(
      renderer.domElement
    );


    /* ==========================================
       LIGHTING
    ========================================== */


    /*
      Soft general illumination
    */

    const hemisphere =
      new THREE.HemisphereLight(
        0xffffff,
        0x122334,
        2.5
      );

    scene.add(
      hemisphere
    );


    /*
      Main front light
    */

    const key =
      new THREE.DirectionalLight(
        0xffffff,
        4
      );

    key.position.set(
      3,
      4,
      5
    );

    scene.add(
      key
    );


    /*
      Cyan fill light
    */

    const fill =
      new THREE.DirectionalLight(
        0x8feaff,
        2
      );

    fill.position.set(
      -4,
      1,
      3
    );

    scene.add(
      fill
    );


    /*
      Strong holographic rim
    */

    const rim =
      new THREE.DirectionalLight(
        0x20dfff,
        5
      );

    rim.position.set(
      -3,
      4,
      -4
    );

    scene.add(
      rim
    );


    /* ==========================================
       GLB LOADER
    ========================================== */

    const loader =
      new GLTFLoader();


    loader.load(

      './PrimeReceptionAI_Test01.glb',


      /* ========================================
         MODEL LOADED
      ======================================== */

      function (gltf) {

        const model =
          gltf.scene;


        scene.add(
          model
        );


        /* --------------------------------------
           CALCULATE CHARACTER DIMENSIONS
        -------------------------------------- */

        const box =
          new THREE.Box3()
            .setFromObject(
              model
            );


        const size =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        console.log(
          'MODEL SIZE:',
          size
        );


        console.log(
          'MODEL CENTER:',
          center
        );


        /* --------------------------------------
           CENTER CHARACTER
        -------------------------------------- */

        model.position.set(
          -center.x,
          -center.y,
          -center.z
        );


        /* ======================================
           HOMEPAGE UPPER-BODY FRAMING
        ====================================== */


        const verticalFOV =
          THREE.MathUtils.degToRad(
            camera.fov
          );


        /*
          We intentionally frame approximately
          the upper 62% of the character instead
          of fitting the entire body.
        */

        const upperBodyHeight =
          size.y * 0.78;


        let distance =
          upperBodyHeight /
          (
            2 *
            Math.tan(
              verticalFOV / 2
            )
          );


        /*
          Small amount of breathing room
          around the character.
        */

        distance *= 1.05;


        /*
          Raise the camera slightly above
          the character's geometric center.

          This moves our composition toward
          the upper torso and face.
        */

        const cameraTargetHeight =
          size.y * 0.17;


        camera.position.set(
          0,
          cameraTargetHeight,
          distance
        );


        camera.lookAt(
          0,
          cameraTargetHeight,
          0
        );


        /* --------------------------------------
           CAMERA CLIPPING PLANES
        -------------------------------------- */

        camera.near =
          Math.max(
            distance / 100,
            0.01
          );


        camera.far =
          distance * 100;


        camera.updateProjectionMatrix();


        /* ======================================
           INSPECT CHARACTER STRUCTURE
        ====================================== */

        console.log(
          'GLB SUCCESSFULLY LOADED:',
          gltf
        );


        model.traverse(

          function (object) {


            /*
              Log every object.

              This will help us identify:

              Head
              Neck
              EyeL
              EyeR
              Armature
              Face meshes
            */

            console.log(
              'OBJECT:',
              object.name,
              object.type
            );


            /*
              Mesh inspection
            */

            if (
              object.isMesh
            ) {

              console.log(
                'MESH:',
                object.name
              );


              /*
                ARKit / facial morph targets
              */

              if (
                object.morphTargetDictionary
              ) {

                console.log(
                  'MORPH TARGETS:',
                  object.name,
                  object.morphTargetDictionary
                );

              }

            }


            /*
              Bone inspection
            */

            if (
              object.isBone
            ) {

              console.log(
                'BONE:',
                object.name
              );

            }

          }

        );


        /* --------------------------------------
           REMOVE LOADING MESSAGE
        -------------------------------------- */

        status.style.display =
          'none';

      },


      /* ========================================
         DOWNLOAD PROGRESS
      ======================================== */

      function (xhr) {

        if (
          xhr.total
        ) {

          const percent =
            Math.round(
              xhr.loaded /
              xhr.total *
              100
            );


          status.textContent =
            'Loading Prime Reception AI… ' +
            percent +
            '%';

        }

        else {

          const mb =
            (
              xhr.loaded /
              1024 /
              1024
            ).toFixed(1);


          status.textContent =
            'Loading Prime Reception AI… ' +
            mb +
            ' MB';

        }

      },


      /* ========================================
         LOAD ERROR
      ======================================== */

      function (error) {

        console.error(
          'GLB ERROR:',
          error
        );


        status.innerHTML =
          'MODEL FAILED TO LOAD<br>' +
          '<small>Check browser console</small>';

      }

    );


    /* ==========================================
       RENDER LOOP
    ========================================== */

    function animate() {

      requestAnimationFrame(
        animate
      );


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* ==========================================
       RESPONSIVE RESIZE
    ========================================== */

    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }

    );

  </script>

</body>
</html>
