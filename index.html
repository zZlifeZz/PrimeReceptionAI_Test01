<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prime Reception AI — Hologram Receptionist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 37%,
          #0a1b26 0%,
          #041018 29%,
          #02080d 55%,
          #000 100%
        );
    }

    /* Very subtle digital scan texture */
    #stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;

      opacity: 0.04;

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 4px,
          rgba(70, 225, 255, 0.16) 5px,
          transparent 6px
        );

      animation: scanMove 10s linear infinite;
    }

    @keyframes scanMove {
      from {
        background-position-y: 0;
      }

      to {
        background-position-y: 180px;
      }
    }

    /* Cinematic vignette */
    #stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 37%,
          rgba(0, 0, 0, 0.10) 58%,
          rgba(0, 0, 0, 0.76) 100%
        );
    }

    canvas {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      z-index: 20;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: #61e8ff;

      font-family: Arial, sans-serif;

      font-size: 14px;
      letter-spacing: 0.10em;

      pointer-events: none;
    }

    /*
      Real Prime Reception AI logo.
    */
    #chestLogo {
      position: fixed;

      z-index: 3;

      left: 0;
      top: 0;

      width: 55px;
      height: auto;

      opacity: 0;

      pointer-events: none;

      transform:
        translate(-50%, -50%);

      filter:
        drop-shadow(
          0 0 3px rgba(232, 182, 73, 0.30)
        )
        drop-shadow(
          0 0 6px rgba(55, 224, 255, 0.14)
        );

      transition:
        opacity 0.4s ease;
    }

    @media (max-width: 900px) {
      #chestLogo {
        width: 45px;
      }
    }
  </style>
</head>


<body>

  <div id="stage">

    <div id="status">
      INITIALIZING PRIME RECEPTION AI…
    </div>

    <img
      id="chestLogo"
      src="./prime-reception-logo.png"
      alt=""
    >

  </div>


  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <script type="module">

    import * as THREE from 'three';

    import {
      GLTFLoader
    } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


    /* =====================================================
       DOM
    ===================================================== */

    const stage =
      document.getElementById(
        'stage'
      );

    const status =
      document.getElementById(
        'status'
      );

    const chestLogo =
      document.getElementById(
        'chestLogo'
      );


    /* =====================================================
       SCENE
    ===================================================== */

    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(
        31,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
      );


    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        2
      )
    );


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      1.08;


    renderer.setClearColor(
      0x000000,
      0
    );


    stage.appendChild(
      renderer.domElement
    );


    /* =====================================================
       LIGHTING
    ===================================================== */

    const ambient =
      new THREE.HemisphereLight(
        0xe7f7ff,
        0x020304,
        0.86
      );


    scene.add(
      ambient
    );


    /*
      Soft front light.
    */
    const faceLight =
      new THREE.DirectionalLight(
        0xfffbf3,
        2.65
      );


    faceLight.position.set(
      1.5,
      4.1,
      5.8
    );


    scene.add(
      faceLight
    );


    /*
      Strong cyan holographic edge.
    */
    const cyanLeft =
      new THREE.DirectionalLight(
        0x20dcff,
        5.2
      );


    cyanLeft.position.set(
      -4.5,
      3.8,
      -3.8
    );


    scene.add(
      cyanLeft
    );


    const cyanRight =
      new THREE.DirectionalLight(
        0x6cecff,
        3.1
      );


    cyanRight.position.set(
      4,
      3.2,
      -3
    );


    scene.add(
      cyanRight
    );


    /*
      Gold Prime accent.
    */
    const goldLight =
      new THREE.DirectionalLight(
        0xd9aa48,
        1.45
      );


    goldLight.position.set(
      4,
      2.6,
      -2
    );


    scene.add(
      goldLight
    );


    /*
      Projection glow from below.
    */
    const lowerGlow =
      new THREE.PointLight(
        0x20dfff,
        10,
        8
      );


    lowerGlow.position.set(
      0,
      -1.5,
      1.5
    );


    scene.add(
      lowerGlow
    );


    /* =====================================================
       CHARACTER MATERIALS
    ===================================================== */

    /*
      Solid synthetic pearl body.

      Important:
      NOT transparent.
    */
    const bodyMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xbccbd0
          ),

        emissive:
          new THREE.Color(
            0x042a32
          ),

        emissiveIntensity:
          0.11,

        metalness:
          0.25,

        roughness:
          0.36,

        clearcoat:
          0.35,

        clearcoatRoughness:
          0.25,

        sheen:
          0.18,

        sheenColor:
          new THREE.Color(
            0x5addf0
          )

      });


    /*
      Face remains softer.
    */
    const faceMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xd9e0e1
          ),

        emissive:
          new THREE.Color(
            0x031b20
          ),

        emissiveIntensity:
          0.06,

        metalness:
          0.08,

        roughness:
          0.42,

        clearcoat:
          0.22,

        clearcoatRoughness:
          0.29,

        sheen:
          0.08,

        sheenColor:
          new THREE.Color(
            0x87e8f2
          )

      });


    /*
      Pearl-white futuristic shirt.
    */
    const shirtMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xe0e8e9
          ),

        emissive:
          new THREE.Color(
            0x07343d
          ),

        emissiveIntensity:
          0.12,

        metalness:
          0.26,

        roughness:
          0.30,

        clearcoat:
          0.44,

        clearcoatRoughness:
          0.21,

        sheen:
          0.24,

        sheenColor:
          new THREE.Color(
            0x54e6f8
          )

      });


    /*
      Matching lower garment.

      Again: solid.
    */
    const leggingsMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xcbd8dc
          ),

        emissive:
          new THREE.Color(
            0x052d35
          ),

        emissiveIntensity:
          0.10,

        metalness:
          0.29,

        roughness:
          0.31,

        clearcoat:
          0.40,

        clearcoatRoughness:
          0.24,

        sheen:
          0.18,

        sheenColor:
          new THREE.Color(
            0x46ddef
          )

      });


    const hairMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0x03070a
          ),

        emissive:
          new THREE.Color(
            0x00171e
          ),

        emissiveIntensity:
          0.13,

        metalness:
          0.20,

        roughness:
          0.38,

        clearcoat:
          0.28,

        clearcoatRoughness:
          0.27

      });


    const eyeMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(
            0xe7fcff
          ),

        emissive:
          new THREE.Color(
            0x21ddf9
          ),

        emissiveIntensity:
          0.95,

        metalness:
          0.01,

        roughness:
          0.12,

        clearcoat:
          1,

        clearcoatRoughness:
          0.05

      });


    const eyeShellMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          0xd6fbff,

        emissive:
          0x075c6b,

        emissiveIntensity:
          0.26,

        transparent:
          true,

        opacity:
          0.35,

        roughness:
          0.08,

        clearcoat:
          1

      });


    const darkDetailMaterial =
      new THREE.MeshStandardMaterial({

        color:
          0x010203,

        metalness:
          0.08,

        roughness:
          0.46

      });


    const teethMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          0xf5f7f7,

        roughness:
          0.30

      });


    const goldMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          0xd3a447,

        emissive:
          0x291900,

        emissiveIntensity:
          0.12,

        metalness:
          0.75,

        roughness:
          0.26

      });


    function forceCleanMaterial(
      object,
      material
    ) {

      object.material =
        material;


      material.map =
        null;


      material.normalMap =
        null;


      material.roughnessMap =
        null;


      material.metalnessMap =
        null;


      material.aoMap =
        null;


      material.emissiveMap =
        null;


      material.alphaMap =
        null;


      material.lightMap =
        null;


      material.displacementMap =
        null;


      material.vertexColors =
        false;


      material.needsUpdate =
        true;

    }


    /* =====================================================
       CHARACTER REFERENCES
    ===================================================== */

    let model =
      null;


    let modelSize =
      null;


    let headBone =
      null;


    let neck01 =
      null;


    let neck02 =
      null;


    let chestBone =
      null;


    let eyeLObject =
      null;


    let eyeRObject =
      null;


    let baseHeadRotation =
      null;


    let baseNeck01Rotation =
      null;


    let baseNeck02Rotation =
      null;


    let baseEyeLRotation =
      null;


    let baseEyeRRotation =
      null;


    const blinkMeshes =
      [];


    /* =====================================================
       POINTER
    ===================================================== */

    const pointer =
      new THREE.Vector2(
        0,
        0
      );


    const targetPointer =
      new THREE.Vector2(
        0,
        0
      );


    window.addEventListener(

      'pointermove',

      function (
        event
      ) {

        let x =
          (
            event.clientX /
            window.innerWidth
          ) * 2 - 1;


        let y =
          -(
            (
              event.clientY /
              window.innerHeight
            ) * 2 - 1
          );


        const deadZone =
          0.055;


        if (
          Math.abs(x) <
          deadZone
        ) {

          x = 0;

        }


        if (
          Math.abs(y) <
          deadZone
        ) {

          y = 0;

        }


        x =
          Math.sign(x) *
          Math.pow(
            Math.abs(x),
            1.15
          );


        y =
          Math.sign(y) *
          Math.pow(
            Math.abs(y),
            1.15
          );


        targetPointer.set(

          THREE.MathUtils.clamp(
            x,
            -1,
            1
          ),

          THREE.MathUtils.clamp(
            y,
            -1,
            1
          )

        );

      }

    );


    document.documentElement.addEventListener(

      'mouseleave',

      function () {

        targetPointer.set(
          0,
          0
        );

      }

    );


    /* =====================================================
       BACKGROUND PARTICLES
    ===================================================== */

    let backgroundParticles =
      null;


    function createBackgroundParticles(
      size
    ) {

      const count =
        330;


      const positions =
        new Float32Array(
          count * 3
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const i3 =
          i * 3;


        positions[i3] =
          (
            Math.random() -
            0.5
          ) *
          size.x *
          3;


        positions[i3 + 1] =
          (
            Math.random() -
            0.45
          ) *
          size.y *
          1.4;


        positions[i3 + 2] =
          (
            Math.random() -
            0.5
          ) *
          Math.max(
            size.x * 3,
            size.z * 5
          );

      }


      const geometry =
        new THREE.BufferGeometry();


      geometry.setAttribute(

        'position',

        new THREE.BufferAttribute(
          positions,
          3
        )

      );


      const material =
        new THREE.PointsMaterial({

          color:
            0x37dfff,

          size:
            Math.max(
              size.y *
              0.0025,
              0.002
            ),

          transparent:
            true,

          opacity:
            0.26,

          depthWrite:
            false,

          blending:
            THREE.AdditiveBlending

        });


      backgroundParticles =
        new THREE.Points(
          geometry,
          material
        );


      scene.add(
        backgroundParticles
      );

    }


    /* =====================================================
       WATER / HOLOGRAM PROJECTOR
    ===================================================== */

    const projectorGroup =
      new THREE.Group();


    scene.add(
      projectorGroup
    );


    let waterMaterial =
      null;


    let projectorY =
      0;


    function createWaterSurface(
      size
    ) {

      /*
        This is deliberately below the torso.

        We are NOT cutting the mesh.
        Camera framing hides most of the lower body naturally.
      */
      projectorY =
        -size.y *
        0.37;


      const radius =
        size.x *
        0.70;


      const geometry =
        new THREE.CircleGeometry(
          radius,
          128
        );


      waterMaterial =
        new THREE.ShaderMaterial({

          transparent:
            true,

          depthWrite:
            false,

          side:
            THREE.DoubleSide,

          blending:
            THREE.AdditiveBlending,

          uniforms: {

            uTime: {
              value: 0
            }

          },


          vertexShader: `

            varying vec2 vUv;

            void main() {

              vUv =
                uv;

              gl_Position =
                projectionMatrix *
                modelViewMatrix *
                vec4(
                  position,
                  1.0
                );

            }

          `,


          fragmentShader: `

            uniform float uTime;

            varying vec2 vUv;

            void main() {

              vec2 p =
                vUv -
                vec2(0.5);


              float distanceFromCenter =
                length(p) *
                2.0;


              float mask =
                1.0 -
                smoothstep(
                  0.72,
                  1.0,
                  distanceFromCenter
                );


              float rippleA =
                sin(
                  distanceFromCenter *
                  70.0 -
                  uTime *
                  4.8
                );


              float rippleB =
                sin(
                  distanceFromCenter *
                  112.0 -
                  uTime *
                  7.0
                );


              float ripple =
                max(
                  rippleA,
                  rippleB *
                  0.52
                );


              ripple =
                smoothstep(
                  0.60,
                  1.0,
                  ripple
                );


              float centerGlow =
                1.0 -
                smoothstep(
                  0.0,
                  0.72,
                  distanceFromCenter
                );


              float alpha =
                (
                  ripple *
                  0.46
                  +
                  centerGlow *
                  0.13
                ) *
                mask;


              gl_FragColor =
                vec4(
                  0.05,
                  0.82,
                  1.0,
                  alpha
                );

            }

          `

        });


      const water =
        new THREE.Mesh(
          geometry,
          waterMaterial
        );


      water.rotation.x =
        -Math.PI / 2;


      water.position.y =
        projectorY;


      projectorGroup.add(
        water
      );


      /*
        Crisp concentric rings.
      */

      const ringSettings = [

        [0.72, 0.010, 0.85],

        [0.88, 0.006, 0.55],

        [1.04, 0.004, 0.35],

        [1.24, 0.003, 0.22]

      ];


      for (
        const setting
        of ringSettings
      ) {

        const radiusMultiplier =
          setting[0];


        const thickness =
          setting[1];


        const opacity =
          setting[2];


        const ringMaterial =
          new THREE.MeshBasicMaterial({

            color:
              0x35e2ff,

            transparent:
              true,

            opacity:
              opacity,

            depthWrite:
              false,

            blending:
              THREE.AdditiveBlending

          });


        const ring =
          new THREE.Mesh(

            new THREE.TorusGeometry(

              radius *
              radiusMultiplier,

              radius *
              thickness,

              10,

              128

            ),

            ringMaterial

          );


        ring.rotation.x =
          Math.PI / 2;


        ring.position.y =
          projectorY +
          0.001;


        ring.userData.phase =
          Math.random() *
          Math.PI *
          2;


        projectorGroup.add(
          ring
        );

      }

    }


    /* =====================================================
       LOWER DIGITAL PARTICLES
    ===================================================== */

    let lowerParticles =
      null;


    let lowerParticlePositions =
      null;


    const lowerParticleSpeeds =
      [];


    function createLowerParticles(
      size
    ) {

      const count =
        620;


      lowerParticlePositions =
        new Float32Array(
          count * 3
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const i3 =
          i * 3;


        const radius =
          Math.sqrt(
            Math.random()
          ) *
          size.x *
          0.46;


        const angle =
          Math.random() *
          Math.PI *
          2;


        lowerParticlePositions[i3] =
          Math.cos(angle) *
          radius;


        lowerParticlePositions[i3 + 1] =
          projectorY +
          Math.random() *
          size.y *
          0.20;


        lowerParticlePositions[i3 + 2] =
          Math.sin(angle) *
          radius *
          0.40;


        lowerParticleSpeeds.push(

          0.0013 +
          Math.random() *
          0.005

        );

      }


      const geometry =
        new THREE.BufferGeometry();


      geometry.setAttribute(

        'position',

        new THREE.BufferAttribute(
          lowerParticlePositions,
          3
        )

      );


      const material =
        new THREE.PointsMaterial({

          color:
            0x3ce8ff,

          size:
            Math.max(
              size.y *
              0.0033,
              0.003
            ),

          transparent:
            true,

          opacity:
            0.58,

          depthWrite:
            false,

          blending:
            THREE.AdditiveBlending

        });


      lowerParticles =
        new THREE.Points(
          geometry,
          material
        );


      scene.add(
        lowerParticles
      );

    }


    function updateLowerParticles(
      size,
      now
    ) {

      if (
        !lowerParticles ||
        !lowerParticlePositions
      ) {

        return;

      }


      const maxY =
        projectorY +
        size.y *
        0.20;


      for (
        let i = 0;
        i < lowerParticleSpeeds.length;
        i++
      ) {

        const i3 =
          i * 3;


        lowerParticlePositions[
          i3 + 1
        ] +=
          lowerParticleSpeeds[i];


        lowerParticlePositions[
          i3
        ] +=
          Math.sin(
            now *
            2 +
            i *
            0.7
          ) *
          0.000025;


        if (
          lowerParticlePositions[
            i3 + 1
          ] >
          maxY
        ) {

          lowerParticlePositions[
            i3 + 1
          ] =
            projectorY;

        }

      }


      lowerParticles
        .geometry
        .attributes
        .position
        .needsUpdate =
          true;

    }


    /* =====================================================
       MODEL LOADING
    ===================================================== */

    const loader =
      new GLTFLoader();


    loader.load(

      './PrimeReceptionAI_Test01.glb',


      function (
        gltf
      ) {

        model =
          gltf.scene;


        scene.add(
          model
        );


        model.traverse(

          function (
            object
          ) {

            if (
              object.isMesh
            ) {

              const name =
                object.name;


              /*
                Blink targets.
              */
              if (
                object.morphTargetDictionary &&
                object.morphTargetInfluences
              ) {

                const dictionary =
                  object.morphTargetDictionary;


                if (
                  dictionary.eyeBlinkLeft !==
                    undefined
                  ||
                  dictionary.eyeBlinkRight !==
                    undefined
                ) {

                  blinkMeshes.push(
                    object
                  );

                }

              }


              /*
                Hide only known unwanted auxiliary layers.
              */
              if (
                name ===
                  'SK_FemBase2_Censored_Torso'
                ||
                name ===
                  'SK_FemBase2_UnderWear'
              ) {

                object.visible =
                  false;


                return;

              }


              /*
                Body.
              */
              if (
                name ===
                  'Mesh010'
                ||
                name ===
                  'SK_FemBase2_Torso'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  bodyMaterial
                );


                return;

              }


              /*
                Face.
              */
              if (
                name ===
                  'Mesh010_1'
                ||
                name ===
                  'SK_FemBase2_Head_52ArKit'
                ||
                name ===
                  'SK_FemBase2_Head_52ARKit'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  faceMaterial
                );


                return;

              }


              /*
                Shirt.
              */
              if (
                name ===
                  'SK_FemBase2_TShirt'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  shirtMaterial
                );


                return;

              }


              /*
                Restore leggings normally.

                This is the critical rollback.
              */
              if (
                name ===
                  'SK_FemBase2_Leggings'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  leggingsMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Hair'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  hairMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_EyeL'
              ) {

                eyeLObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_EyeR'
              ) {

                eyeRObject =
                  object;


                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_EyeShell'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  eyeShellMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Lashes'
                ||
                name ===
                  'SK_FemBase2_EyeEdge'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  darkDetailMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Teeth'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  teethMaterial
                );


                return;

              }


              if (
                name ===
                  'SK_FemBase2_Nails'
              ) {

                object.visible =
                  true;


                forceCleanMaterial(
                  object,
                  goldMaterial
                );


                return;

              }

            }


            /* =============================================
               BONES
            ============================================= */

            if (
              object.isBone
            ) {

              const lowerName =
                object
                  .name
                  .toLowerCase();


              if (
                lowerName ===
                  'head'
                ||
                lowerName.endsWith(
                  '_head'
                )
              ) {

                headBone =
                  object;

              }


              if (
                lowerName.includes(
                  'neck_01'
                )
              ) {

                neck01 =
                  object;

              }


              if (
                lowerName.includes(
                  'neck_02'
                )
              ) {

                neck02 =
                  object;

              }


              if (
                !chestBone &&
                (
                  lowerName.includes(
                    'upperchest'
                  )
                  ||
                  lowerName.includes(
                    'upper_chest'
                  )
                  ||
                  lowerName.includes(
                    'chest'
                  )
                  ||
                  lowerName.includes(
                    'spine_03'
                  )
                  ||
                  lowerName.includes(
                    'spine03'
                  )
                )
              ) {

                chestBone =
                  object;

              }

            }

          }

        );


        /* =================================================
           BASE ROTATIONS
        ================================================= */

        if (
          headBone
        ) {

          baseHeadRotation =
            headBone
              .rotation
              .clone();

        }


        if (
          neck01
        ) {

          baseNeck01Rotation =
            neck01
              .rotation
              .clone();

        }


        if (
          neck02
        ) {

          baseNeck02Rotation =
            neck02
              .rotation
              .clone();

        }


        if (
          eyeLObject
        ) {

          baseEyeLRotation =
            eyeLObject
              .rotation
              .clone();

        }


        if (
          eyeRObject
        ) {

          baseEyeRRotation =
            eyeRObject
              .rotation
              .clone();

        }


        /* =================================================
           MODEL SIZE / CENTER
        ================================================= */

        const box =
          new THREE.Box3()
            .setFromObject(
              model
            );


        modelSize =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        model.position.set(

          -center.x,

          -center.y,

          -center.z

        );


        /* =================================================
           CAMERA

           Deliberately closer than full-body.

           We are using framing instead of destroying
           the lower-body geometry.
        ================================================= */

        const verticalFOV =
          THREE.MathUtils.degToRad(
            camera.fov
          );


        const visibleHeight =
          modelSize.y *
          0.70;


        let distance =
          visibleHeight /
          (
            2 *
            Math.tan(
              verticalFOV /
              2
            )
          );


        distance *=
          1.03;


        const targetHeight =
          modelSize.y *
          0.15;


        camera.position.set(
          0,
          targetHeight,
          distance
        );


        camera.lookAt(
          0,
          targetHeight,
          0
        );


        camera.near =
          Math.max(
            distance /
            100,
            0.01
          );


        camera.far =
          distance *
          100;


        camera.updateProjectionMatrix();


        /* =================================================
           EFFECTS
        ================================================= */

        createBackgroundParticles(
          modelSize
        );


        createWaterSurface(
          modelSize
        );


        createLowerParticles(
          modelSize
        );


        chestLogo.style.opacity =
          '1';


        status.style.display =
          'none';


        scheduleNextBlink();

      },


      function (
        xhr
      ) {

        if (
          xhr.total
        ) {

          const percent =
            Math.round(

              xhr.loaded /
              xhr.total *
              100

            );


          status.textContent =
            'INITIALIZING PRIME RECEPTION AI… ' +
            percent +
            '%';

        }

      },


      function (
        error
      ) {

        console.error(
          'GLB ERROR:',
          error
        );


        status.textContent =
          'MODEL FAILED TO LOAD';

      }

    );


    /* =====================================================
       BLINK SYSTEM
    ===================================================== */

    function setBlinkAmount(
      amount
    ) {

      const safe =
        THREE.MathUtils.clamp(
          amount,
          0,
          1
        );


      for (
        const mesh
        of blinkMeshes
      ) {

        const dictionary =
          mesh
            .morphTargetDictionary;


        const influences =
          mesh
            .morphTargetInfluences;


        if (
          dictionary.eyeBlinkLeft !==
          undefined
        ) {

          influences[
            dictionary.eyeBlinkLeft
          ] =
            safe;

        }


        if (
          dictionary.eyeBlinkRight !==
          undefined
        ) {

          influences[
            dictionary.eyeBlinkRight
          ] =
            safe;

        }

      }

    }


    let blinkActive =
      false;


    let blinkStart =
      0;


    let blinkDuration =
      0.15;


    let nextBlink =
      Infinity;


    let doubleBlink =
      false;


    let secondBlinkAt =
      Infinity;


    function scheduleNextBlink() {

      nextBlink =
        performance.now() /
        1000 +
        2.3 +
        Math.random() *
        3.7;

    }


    function beginBlink() {

      blinkActive =
        true;


      blinkStart =
        performance.now() /
        1000;


      blinkDuration =
        0.12 +
        Math.random() *
        0.055;


      doubleBlink =
        Math.random() <
        0.12;

    }


    function updateBlink(
      now
    ) {

      if (
        !blinkActive &&
        now >= nextBlink
      ) {

        beginBlink();

      }


      if (
        !blinkActive &&
        doubleBlink &&
        now >= secondBlinkAt
      ) {

        doubleBlink =
          false;


        beginBlink();


        return;

      }


      if (
        !blinkActive
      ) {

        setBlinkAmount(
          0
        );


        return;

      }


      const progress =
        (
          now -
          blinkStart
        ) /
        blinkDuration;


      if (
        progress <= 1
      ) {

        setBlinkAmount(

          Math.sin(
            progress *
            Math.PI
          )

        );

      }

      else {

        setBlinkAmount(
          0
        );


        blinkActive =
          false;


        if (
          doubleBlink
        ) {

          secondBlinkAt =
            now +
            0.15 +
            Math.random() *
            0.08;

        }

        else {

          scheduleNextBlink();

        }

      }

    }


    /* =====================================================
       TRACKING — PRESERVING YOUR CONFIRMED AXES
    ===================================================== */

    const eyeHorizontalMax =
      THREE.MathUtils.degToRad(
        10
      );


    const eyeVerticalMax =
      THREE.MathUtils.degToRad(
        6
      );


    const headHorizontalMax =
      THREE.MathUtils.degToRad(
        4.2
      );


    const headVerticalMax =
      THREE.MathUtils.degToRad(
        2.2
      );


    const neckHorizontalMax =
      THREE.MathUtils.degToRad(
        1.25
      );


    const neckVerticalMax =
      THREE.MathUtils.degToRad(
        0.7
      );


    let eyeHorizontal =
      0;


    let eyeVertical =
      0;


    let headHorizontal =
      0;


    let headVertical =
      0;


    let neckHorizontal =
      0;


    let neckVertical =
      0;


    function damp(
      current,
      target,
      speed,
      delta
    ) {

      return THREE.MathUtils.lerp(

        current,

        target,

        1 -
        Math.exp(
          -speed *
          delta
        )

      );

    }


    /* =====================================================
       CHEST LOGO
    ===================================================== */

    const chestWorld =
      new THREE.Vector3();


    const chestScreen =
      new THREE.Vector3();


    function updateChestLogo() {

      if (
        !model ||
        !modelSize
      ) {

        return;

      }


      if (
        chestBone
      ) {

        chestBone.getWorldPosition(
          chestWorld
        );


        /*
          Upper right chest from viewer perspective.
        */
        chestWorld.x +=
          modelSize.x *
          0.105;


        chestWorld.y +=
          modelSize.y *
          0.078;

      }

      else {

        chestWorld.set(

          modelSize.x *
          0.10,

          modelSize.y *
          0.24,

          0

        );

      }


      chestScreen.copy(
        chestWorld
      );


      chestScreen.project(
        camera
      );


      const x =
        (
          chestScreen.x *
          0.5 +
          0.5
        ) *
        window.innerWidth;


      const y =
        (
          -chestScreen.y *
          0.5 +
          0.5
        ) *
        window.innerHeight;


      chestLogo.style.left =
        x +
        'px';


      chestLogo.style.top =
        y +
        'px';


      const width =
        THREE.MathUtils.clamp(

          window.innerHeight *
          0.054,

          40,

          62

        );


      chestLogo.style.width =
        width +
        'px';

    }


    /* =====================================================
       ANIMATION
    ===================================================== */

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(
          clock.getDelta(),
          0.05
        );


      const now =
        performance.now() /
        1000;


      /* =========================================
         POINTER SMOOTHING
      ========================================= */

      pointer.x =
        damp(

          pointer.x,

          targetPointer.x,

          7,

          delta

        );


      pointer.y =
        damp(

          pointer.y,

          targetPointer.y,

          7,

          delta

        );


      /* =========================================
         EYES
      ========================================= */

      eyeHorizontal =
        damp(

          eyeHorizontal,

          pointer.x *
          eyeHorizontalMax,

          14,

          delta

        );


      eyeVertical =
        damp(

          eyeVertical,

          pointer.y *
          eyeVerticalMax,

          14,

          delta

        );


      /* =========================================
         HEAD
      ========================================= */

      headHorizontal =
        damp(

          headHorizontal,

          pointer.x *
          headHorizontalMax,

          2.7,

          delta

        );


      headVertical =
        damp(

          headVertical,

          pointer.y *
          headVerticalMax,

          2.5,

          delta

        );


      /* =========================================
         NECK
      ========================================= */

      neckHorizontal =
        damp(

          neckHorizontal,

          pointer.x *
          neckHorizontalMax,

          1.65,

          delta

        );


      neckVertical =
        damp(

          neckVertical,

          pointer.y *
          neckVerticalMax,

          1.5,

          delta

        );


      /* =========================================
         APPLY EYE ROTATIONS
      ========================================= */

      if (
        eyeLObject &&
        baseEyeLRotation
      ) {

        eyeLObject.rotation.copy(
          baseEyeLRotation
        );


        eyeLObject.rotation.y +=
          eyeHorizontal;


        eyeLObject.rotation.x -=
          eyeVertical;

      }


      if (
        eyeRObject &&
        baseEyeRRotation
      ) {

        eyeRObject.rotation.copy(
          baseEyeRRotation
        );


        eyeRObject.rotation.y +=
          eyeHorizontal;


        eyeRObject.rotation.x -=
          eyeVertical;

      }


      /* =========================================
         APPLY HEAD

         Confirmed rig mapping:

         X = left/right
         Z = up/down
      ========================================= */

      if (
        headBone &&
        baseHeadRotation
      ) {

        headBone.rotation.copy(
          baseHeadRotation
        );


        headBone.rotation.x +=
          headHorizontal;


        headBone.rotation.z +=
          headVertical;


        headBone.rotation.y =
          baseHeadRotation.y;

      }


      /* =========================================
         NECK 02
      ========================================= */

      if (
        neck02 &&
        baseNeck02Rotation
      ) {

        neck02.rotation.copy(
          baseNeck02Rotation
        );


        neck02.rotation.x +=
          neckHorizontal;


        neck02.rotation.z +=
          neckVertical;


        neck02.rotation.y =
          baseNeck02Rotation.y;

      }


      /* =========================================
         NECK 01
      ========================================= */

      if (
        neck01 &&
        baseNeck01Rotation
      ) {

        neck01.rotation.copy(
          baseNeck01Rotation
        );


        neck01.rotation.x +=
          neckHorizontal *
          0.30;


        neck01.rotation.z +=
          neckVertical *
          0.22;


        neck01.rotation.y =
          baseNeck01Rotation.y;

      }


      /* =========================================
         BLINK
      ========================================= */

      updateBlink(
        now
      );


      /* =========================================
         SUBTLE HOLOGRAPHIC LIGHT PULSE
      ========================================= */

      const pulse =
        0.5 +
        Math.sin(
          now *
          1.25
        ) *
        0.5;


      lowerGlow.intensity =
        8.4 +
        pulse *
        2.1;


      bodyMaterial.emissiveIntensity =
        0.085 +
        pulse *
        0.05;


      shirtMaterial.emissiveIntensity =
        0.10 +
        pulse *
        0.05;


      leggingsMaterial.emissiveIntensity =
        0.08 +
        pulse *
        0.04;


      eyeMaterial.emissiveIntensity =
        0.88 +
        pulse *
        0.20;


      /* =========================================
         WATER
      ========================================= */

      if (
        waterMaterial
      ) {

        waterMaterial
          .uniforms
          .uTime
          .value =
            now;

      }


      /*
        Slight independent ripple-ring breathing.
      */
      for (
        let i = 1;
        i < projectorGroup.children.length;
        i++
      ) {

        const ring =
          projectorGroup.children[i];


        if (
          !ring.userData.phase
        ) {

          continue;

        }


        const ringScale =
          1 +
          Math.sin(
            now *
            1.25 +
            ring.userData.phase
          ) *
          0.018;


        ring.scale.set(
          ringScale,
          ringScale,
          ringScale
        );

      }


      /* =========================================
         LOWER DIGITAL FRAGMENTS
      ========================================= */

      if (
        modelSize
      ) {

        updateLowerParticles(
          modelSize,
          now
        );

      }


      /* =========================================
         BACKGROUND PARTICLES
      ========================================= */

      if (
        backgroundParticles
      ) {

        backgroundParticles.rotation.y +=
          0.00018;

      }


      /* =========================================
         LOGO
      ========================================= */

      updateChestLogo();


      /* =========================================
         RENDER
      ========================================= */

      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );

      }

    );

  </script>

</body>
</html>
