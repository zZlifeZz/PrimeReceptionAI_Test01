<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prime Reception AI — 3D Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02060a;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

      background:
        radial-gradient(
          circle at 50% 38%,
          #0b1820 0%,
          #040a0f 44%,
          #010305 72%,
          #000000 100%
        );
    }

    #stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 42%,
          rgba(0, 0, 0, 0.62) 100%
        );
    }

    #stage canvas {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      z-index: 10;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: #73e8ff;
      font-family: Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-align: center;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="stage">
    <div id="status">
      Loading Prime Reception AI…
    </div>
  </div>


  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <script type="module">

    import * as THREE from 'three';

    import {
      GLTFLoader
    } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


    const stage =
      document.getElementById('stage');

    const status =
      document.getElementById('status');


    /* =====================================================
       SCENE
    ===================================================== */

    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(
        32,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
      );


    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        2
      )
    );


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
      1.0;


    renderer.setClearColor(
      0x000000,
      0
    );


    stage.appendChild(
      renderer.domElement
    );


    /* =====================================================
       LIGHTING
    ===================================================== */

    const ambient =
      new THREE.HemisphereLight(
        0xdbeff4,
        0x06080a,
        0.95
      );

    scene.add(ambient);


    const faceLight =
      new THREE.DirectionalLight(
        0xfff8ee,
        2.5
      );

    faceLight.position.set(
      1.3,
      3.8,
      5.5
    );

    scene.add(faceLight);


    const cyanRim =
      new THREE.DirectionalLight(
        0x2edfff,
        3.6
      );

    cyanRim.position.set(
      -4,
      3,
      -3
    );

    scene.add(cyanRim);


    const goldRim =
      new THREE.DirectionalLight(
        0xd6a13f,
        2.0
      );

    goldRim.position.set(
      4,
      2,
      -2
    );

    scene.add(goldRim);


    const lowerFill =
      new THREE.PointLight(
        0x1498b4,
        6,
        8
      );

    lowerFill.position.set(
      0,
      -1.2,
      2.5
    );

    scene.add(lowerFill);


    /* =====================================================
       MATERIALS
    ===================================================== */

    const bodyMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xb9c4c8),

        metalness:
          0.34,

        roughness:
          0.40,

        clearcoat:
          0.30,

        clearcoatRoughness:
          0.30,

        sheen:
          0.10,

        sheenColor:
          new THREE.Color(0x55d7eb)

      });


    const faceMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xd7dee0),

        metalness:
          0.18,

        roughness:
          0.44,

        clearcoat:
          0.22,

        clearcoatRoughness:
          0.32

      });


    const shirtMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0x07090c),

        metalness:
          0.48,

        roughness:
          0.38,

        clearcoat:
          0.28,

        clearcoatRoughness:
          0.30

      });


    const leggingsMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0x07090c),

        metalness:
          0.44,

        roughness:
          0.40,

        clearcoat:
          0.24,

        clearcoatRoughness:
          0.32

      });


    const hairMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0x06090d),

        metalness:
          0.22,

        roughness:
          0.42,

        clearcoat:
          0.22,

        clearcoatRoughness:
          0.30

      });


    const eyeMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xd9fbff),

        emissive:
          new THREE.Color(0x29dfff),

        emissiveIntensity:
          0.6,

        metalness:
          0.04,

        roughness:
          0.16,

        clearcoat:
          0.9,

        clearcoatRoughness:
          0.08

      });


    const darkDetailMaterial =
      new THREE.MeshStandardMaterial({

        color:
          new THREE.Color(0x020304),

        metalness:
          0.10,

        roughness:
          0.48

      });


    const teethMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xf3f5f5),

        metalness:
          0,

        roughness:
          0.30,

        clearcoat:
          0.18

      });


    const goldMaterial =
      new THREE.MeshPhysicalMaterial({

        color:
          new THREE.Color(0xc99a3d),

        metalness:
          0.70,

        roughness:
          0.30,

        clearcoat:
          0.30

      });


    function forceCleanMaterial(
      object,
      material
    ) {

      object.material =
        material;

      material.map =
        null;

      material.normalMap =
        null;

      material.roughnessMap =
        null;

      material.metalnessMap =
        null;

      material.aoMap =
        null;

      material.emissiveMap =
        null;

      material.alphaMap =
        null;

      material.lightMap =
        null;

      material.displacementMap =
        null;

      material.vertexColors =
        false;

      material.needsUpdate =
        true;

    }


    /* =====================================================
       CHARACTER REFERENCES
    ===================================================== */

    let model =
      null;

    let headBone =
      null;

    let neck01 =
      null;

    let neck02 =
      null;


    /*
      Any mesh containing ARKit blink targets
      will be added here automatically.
    */

    const blinkMeshes = [];


    /*
      Store the original rig rotations.

      Important: we do NOT force the skeleton
      to rotation 0 anymore.
    */

    let baseHeadRotation =
      null;

    let baseNeck01Rotation =
      null;

    let baseNeck02Rotation =
      null;


    /* =====================================================
       LOAD CHARACTER
    ===================================================== */

    const loader =
      new GLTFLoader();


    loader.load(

      './PrimeReceptionAI_Test01.glb',


      function (gltf) {

        model =
          gltf.scene;


        scene.add(
          model
        );


        /* =================================================
           FIND + STYLE EVERYTHING
        ================================================= */

        model.traverse(

          function (object) {


            /* =============================================
               MESHES
            ============================================= */

            if (
              object.isMesh
            ) {

              const name =
                object.name;


              /* ------------------------------------------
                 Find ARKit blink targets automatically
              ------------------------------------------ */

              if (
                object.morphTargetDictionary &&
                object.morphTargetInfluences
              ) {

                const dictionary =
                  object.morphTargetDictionary;


                if (
                  dictionary.eyeBlinkLeft !== undefined ||
                  dictionary.eyeBlinkRight !== undefined
                ) {

                  blinkMeshes.push(
                    object
                  );


                  console.log(
                    'BLINK MESH FOUND:',
                    name,
                    dictionary
                  );

                }

              }


              /* ------------------------------------------
                 Hide unwanted layers
              ------------------------------------------ */

              if (
                name ===
                  'SK_FemBase2_Censored_Torso'
                ||
                name ===
                  'SK_FemBase2_UnderWear'
              ) {

                object.visible =
                  false;

                return;

              }


              /* ------------------------------------------
                 BODY
              ------------------------------------------ */

              if (
                name === 'Mesh010' ||
                name === 'SK_FemBase2_Torso'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  bodyMaterial
                );

                return;

              }


              /* ------------------------------------------
                 FACE
              ------------------------------------------ */

              if (
                name === 'Mesh010_1' ||
                name === 'SK_FemBase2_Head_52ArKit' ||
                name === 'SK_FemBase2_Head_52ARKit'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  faceMaterial
                );

                return;

              }


              /* ------------------------------------------
                 SHIRT
              ------------------------------------------ */

              if (
                name ===
                'SK_FemBase2_TShirt'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  shirtMaterial
                );

                return;

              }


              /* ------------------------------------------
                 LEGGINGS
              ------------------------------------------ */

              if (
                name ===
                'SK_FemBase2_Leggings'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  leggingsMaterial
                );

                return;

              }


              /* ------------------------------------------
                 HAIR
              ------------------------------------------ */

              if (
                name ===
                'SK_FemBase2_Hair'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  hairMaterial
                );

                return;

              }


              /* ------------------------------------------
                 EYES
              ------------------------------------------ */

              if (
                name ===
                  'SK_FemBase2_EyeL'
                ||
                name ===
                  'SK_FemBase2_EyeR'
                ||
                name ===
                  'SK_FemBase2_EyeShell'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  eyeMaterial
                );

                return;

              }


              /* ------------------------------------------
                 EYE DETAILS
              ------------------------------------------ */

              if (
                name ===
                  'SK_FemBase2_Lashes'
                ||
                name ===
                  'SK_FemBase2_EyeEdge'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  darkDetailMaterial
                );

                return;

              }


              /* ------------------------------------------
                 TEETH
              ------------------------------------------ */

              if (
                name ===
                'SK_FemBase2_Teeth'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  teethMaterial
                );

                return;

              }


              /* ------------------------------------------
                 NAILS
              ------------------------------------------ */

              if (
                name ===
                'SK_FemBase2_Nails'
              ) {

                object.visible =
                  true;

                forceCleanMaterial(
                  object,
                  goldMaterial
                );

                return;

              }

            }


            /* =============================================
               BONES
            ============================================= */

            if (
              object.isBone
            ) {

              const lowerName =
                object.name.toLowerCase();


              /*
                Prefer a real head bone,
                not a random helper.
              */

              if (
                lowerName === 'head' ||
                lowerName.endsWith('_head')
              ) {

                headBone =
                  object;

              }


              if (
                lowerName.includes(
                  'neck_01'
                )
              ) {

                neck01 =
                  object;

              }


              if (
                lowerName.includes(
                  'neck_02'
                )
              ) {

                neck02 =
                  object;

              }

            }

          }

        );


        /* =================================================
           SAVE ORIGINAL RIG POSE
        ================================================= */

        if (
          headBone
        ) {

          baseHeadRotation =
            headBone.rotation.clone();

        }


        if (
          neck01
        ) {

          baseNeck01Rotation =
            neck01.rotation.clone();

        }


        if (
          neck02
        ) {

          baseNeck02Rotation =
            neck02.rotation.clone();

        }


        console.log(
          'HEAD BONE:',
          headBone
        );


        console.log(
          'BLINK MESH COUNT:',
          blinkMeshes.length
        );


        /* =================================================
           CENTER MODEL
        ================================================= */

        const box =
          new THREE.Box3()
            .setFromObject(
              model
            );


        const size =
          box.getSize(
            new THREE.Vector3()
          );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        model.position.set(
          -center.x,
          -center.y,
          -center.z
        );


        /* =================================================
           CAMERA
        ================================================= */

        const verticalFOV =
          THREE.MathUtils.degToRad(
            camera.fov
          );


        const upperBodyHeight =
          size.y * 0.78;


        let distance =
          upperBodyHeight /
          (
            2 *
            Math.tan(
              verticalFOV / 2
            )
          );


        distance *=
          1.05;


        const cameraTargetHeight =
          size.y * 0.17;


        camera.position.set(
          0,
          cameraTargetHeight,
          distance
        );


        camera.lookAt(
          0,
          cameraTargetHeight,
          0
        );


        camera.near =
          Math.max(
            distance / 100,
            0.01
          );


        camera.far =
          distance * 100;


        camera.updateProjectionMatrix();


        /* =================================================
           HEAD RESTING CORRECTION
        ================================================= */


        /*
          Small correction from the ORIGINAL
          purchased rig pose.

          We are no longer replacing the rig's
          original orientation with rotation 0.
        */

        if (
          headBone &&
          baseHeadRotation
        ) {

          headBone.rotation.copy(
            baseHeadRotation
          );


          /*
            Small downward pitch.

            If this particular skeleton interprets
            pitch in the opposite direction, we can
            simply reverse this number next.
          */

          headBone.rotation.x +=
            0.055;

        }


        status.style.display =
          'none';


        /*
          Schedule first natural blink.
        */

        scheduleNextBlink();

      },


      /* ===================================================
         LOADING
      =================================================== */

      function (xhr) {

        if (
          xhr.total
        ) {

          const percent =
            Math.round(
              xhr.loaded /
              xhr.total *
              100
            );


          status.textContent =
            'Loading Prime Reception AI… ' +
            percent +
            '%';

        }

      },


      /* ===================================================
         ERROR
      =================================================== */

      function (error) {

        console.error(
          'GLB ERROR:',
          error
        );


        status.innerHTML =
          'MODEL FAILED TO LOAD<br>' +
          '<small>Check browser console</small>';

      }

    );


    /* =====================================================
       ARKIT BLINK SYSTEM
    ===================================================== */

    function setBlinkAmount(
      amount
    ) {

      const safeAmount =
        THREE.MathUtils.clamp(
          amount,
          0,
          1
        );


      for (
        const mesh of blinkMeshes
      ) {

        const dictionary =
          mesh.morphTargetDictionary;


        const influences =
          mesh.morphTargetInfluences;


        const leftIndex =
          dictionary.eyeBlinkLeft;


        const rightIndex =
          dictionary.eyeBlinkRight;


        if (
          leftIndex !== undefined
        ) {

          influences[leftIndex] =
            safeAmount;

        }


        if (
          rightIndex !== undefined
        ) {

          influences[rightIndex] =
            safeAmount;

        }

      }

    }


    /*
      Blink state
    */

    let blinkActive =
      false;

    let blinkStartTime =
      0;

    let blinkDuration =
      0.15;

    let nextBlinkTime =
      Infinity;

    let pendingDoubleBlink =
      false;

    let doubleBlinkTime =
      Infinity;


    function randomBlinkDelay() {

      /*
        Random delay between roughly
        2.2 and 5.8 seconds.
      */

      return (
        2.2 +
        Math.random() * 3.6
      );

    }


    function scheduleNextBlink() {

      nextBlinkTime =
        performance.now() / 1000 +
        randomBlinkDelay();

    }


    function startBlink() {

      blinkActive =
        true;


      blinkStartTime =
        performance.now() / 1000;


      /*
        Slightly varied blink speed.
      */

      blinkDuration =
        0.12 +
        Math.random() * 0.055;


      /*
        Occasionally perform a natural
        second blink shortly afterward.
      */

      pendingDoubleBlink =
        Math.random() < 0.13;

    }


    function updateBlink(
      now
    ) {

      /*
        Begin scheduled blink
      */

      if (
        !blinkActive &&
        now >= nextBlinkTime
      ) {

        startBlink();

      }


      /*
        Handle second blink
      */

      if (
        !blinkActive &&
        pendingDoubleBlink &&
        now >= doubleBlinkTime
      ) {

        pendingDoubleBlink =
          false;

        startBlink();

        return;

      }


      if (
        !blinkActive
      ) {

        setBlinkAmount(0);

        return;

      }


      const elapsed =
        now - blinkStartTime;


      const progress =
        elapsed /
        blinkDuration;


      /*
        Smooth close → open curve.

        0 = eyes open
        1 = eyes fully closed
      */

      if (
        progress <= 1
      ) {

        const blinkAmount =
          Math.sin(
            progress *
            Math.PI
          );


        setBlinkAmount(
          blinkAmount
        );

      }

      else {

        setBlinkAmount(0);


        blinkActive =
          false;


        if (
          pendingDoubleBlink
        ) {

          doubleBlinkTime =
            now +
            0.14 +
            Math.random() * 0.09;

        }

        else {

          scheduleNextBlink();

        }

      }

    }


    /* =====================================================
       ANIMATION
    ===================================================== */

    function animate() {

      requestAnimationFrame(
        animate
      );


      const now =
        performance.now() /
        1000;


      /*
        Keep model physically anchored.
        No vertical bobbing.
      */

      if (
        model
      ) {

        model.rotation.x =
          0;

        model.rotation.y =
          0;

        model.rotation.z =
          0;

      }


      /*
        Preserve the corrected resting pose.

        No idle head wandering yet.
        Mouse tracking comes next.
      */

      if (
        headBone &&
        baseHeadRotation
      ) {

        headBone.rotation.copy(
          baseHeadRotation
        );


        headBone.rotation.x +=
          0.055;

      }


      if (
        neck01 &&
        baseNeck01Rotation
      ) {

        neck01.rotation.copy(
          baseNeck01Rotation
        );

      }


      if (
        neck02 &&
        baseNeck02Rotation
      ) {

        neck02.rotation.copy(
          baseNeck02Rotation
        );

      }


      /*
        Natural ARKit blinking
      */

      updateBlink(
        now
      );


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }

    );

  </script>

</body>
</html>
