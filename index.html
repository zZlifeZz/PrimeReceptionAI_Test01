<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prime Reception AI — 3D Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02060a;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

      background:
        radial-gradient(
          circle at 50% 40%,
          #0a1720 0%,
          #03090e 45%,
          #010305 75%,
          #000000 100%
        );
    }

    #stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 42%,
          rgba(0, 0, 0, 0.58) 100%
        );
    }

    #stage canvas {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      z-index: 10;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #6eeaff;
      font-family: Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="stage">
    <div id="status">
      Loading Prime Reception AI…
    </div>
  </div>


  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>


  <script type="module">

    import * as THREE from 'three';

    import {
      GLTFLoader
    } from
    'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


    const stage =
      document.getElementById('stage');

    const status =
      document.getElementById('status');


    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(
        32,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
      );


    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
      1.1;

    renderer.setClearColor(
      0x000000,
      0
    );

    stage.appendChild(
      renderer.domElement
    );


    /* =========================
       LIGHTS
    ========================= */

    const ambient =
      new THREE.HemisphereLight(
        0xdff9ff,
        0x050608,
        1.25
      );

    scene.add(ambient);


    const faceLight =
      new THREE.DirectionalLight(
        0xffffff,
        3.0
      );

    faceLight.position.set(
      1.5,
      3.5,
      5
    );

    scene.add(faceLight);


    const cyanRim =
      new THREE.DirectionalLight(
        0x39ddff,
        4.0
      );

    cyanRim.position.set(
      -4,
      3,
      -3
    );

    scene.add(cyanRim);


    const goldRim =
      new THREE.DirectionalLight(
        0xd9a441,
        2.6
      );

    goldRim.position.set(
      4,
      1.5,
      -2
    );

    scene.add(goldRim);


    const lowerFill =
      new THREE.PointLight(
        0x1eaac7,
        10,
        8
      );

    lowerFill.position.set(
      0,
      -1.5,
      2
    );

    scene.add(lowerFill);


    /* =========================
       MATERIALS
    ========================= */

    const bodyMaterial =
      new THREE.MeshPhysicalMaterial({

        color: new THREE.Color(0xc7d3d8),
        metalness: 0.52,
        roughness: 0.31,
        clearcoat: 0.48,
        clearcoatRoughness: 0.22

      });


    const faceMaterial =
      new THREE.MeshPhysicalMaterial({

        color: new THREE.Color(0xd6e1e4),
        metalness: 0.30,
        roughness: 0.38,
        clearcoat: 0.35,
        clearcoatRoughness: 0.28

      });


    const shirtMaterial =
      new THREE.MeshPhysicalMaterial({

        color: new THREE.Color(0x05070a),
        metalness: 0.70,
        roughness: 0.25,
        clearcoat: 0.58,
        clearcoatRoughness: 0.17

      });


    const leggingsMaterial =
      new THREE.MeshPhysicalMaterial({

        color: new THREE.Color(0x05070a),
        metalness: 0.67,
        roughness: 0.27,
        clearcoat: 0.52,
        clearcoatRoughness: 0.19

      });


    const hairMaterial =
      new THREE.MeshPhysicalMaterial({

        color: new THREE.Color(0x05090d),
        metalness: 0.35,
        roughness: 0.32,
        clearcoat: 0.32,
        clearcoatRoughness: 0.28

      });


    const eyeMaterial =
      new THREE.MeshPhysicalMaterial({

        color: new THREE.Color(0xbffaff),
        emissive: new THREE.Color(0x28dfff),
        emissiveIntensity: 0.8,
        metalness: 0.05,
        roughness: 0.15,
        clearcoat: 1,
        clearcoatRoughness: 0.08

      });


    const darkDetailMaterial =
      new THREE.MeshStandardMaterial({

        color: new THREE.Color(0x020304),
        metalness: 0.15,
        roughness: 0.42

      });


    const teethMaterial =
      new THREE.MeshPhysicalMaterial({

        color: new THREE.Color(0xf1f4f4),
        metalness: 0,
        roughness: 0.28,
        clearcoat: 0.25

      });


    const goldMaterial =
      new THREE.MeshPhysicalMaterial({

        color: new THREE.Color(0xc99a3d),
        metalness: 0.78,
        roughness: 0.25,
        clearcoat: 0.5

      });


    /* Diagnostic colors */
    const mesh010Material =
      new THREE.MeshStandardMaterial({
        color: new THREE.Color(0xff3b3b),
        roughness: 0.4,
        metalness: 0.1
      });

    const mesh010_1Material =
      new THREE.MeshStandardMaterial({
        color: new THREE.Color(0x35ff75),
        roughness: 0.4,
        metalness: 0.1
      });


    /* =========================
       LOAD CHARACTER
    ========================= */

    const loader =
      new GLTFLoader();


    loader.load(

      './PrimeReceptionAI_Test01.glb',


      function (gltf) {

        const model =
          gltf.scene;

        scene.add(model);


        model.traverse(

          function (object) {

            if (!object.isMesh) {
              return;
            }


            const name =
              object.name;


            console.log(
              'MESH:',
              name
            );


            /* Hide unwanted layers */

            if (
              name === 'SK_FemBase2_Censored_Torso' ||
              name === 'SK_FemBase2_UnderWear'
            ) {

              object.visible = false;
              return;

            }


            /* Main body */

            if (
              name === 'SK_FemBase2_Torso'
            ) {

              object.visible = true;
              object.material = bodyMaterial;
              return;

            }


            /* Face */

            if (
              name === 'SK_FemBase2_Head_52ArKit' ||
              name === 'SK_FemBase2_Head_52ARKit'
            ) {

              object.visible = true;
              object.material = faceMaterial;
              return;

            }


            /* Shirt */

            if (
              name === 'SK_FemBase2_TShirt'
            ) {

              object.visible = true;
              object.material = shirtMaterial;
              return;

            }


            /* Leggings */

            if (
              name === 'SK_FemBase2_Leggings'
            ) {

              object.visible = true;
              object.material = leggingsMaterial;
              return;

            }


            /* Hair */

            if (
              name === 'SK_FemBase2_Hair'
            ) {

              object.visible = true;
              object.material = hairMaterial;
              return;

            }


            /* Eyes */

            if (
              name === 'SK_FemBase2_EyeL' ||
              name === 'SK_FemBase2_EyeR'
            ) {

              object.visible = true;
              object.material = eyeMaterial;
              return;

            }


            if (
              name === 'SK_FemBase2_EyeShell'
            ) {

              object.visible = true;
              object.material = eyeMaterial;
              return;

            }


            if (
              name === 'SK_FemBase2_Lashes' ||
              name === 'SK_FemBase2_EyeEdge'
            ) {

              object.visible = true;
              object.material = darkDetailMaterial;
              return;

            }


            if (
              name === 'SK_FemBase2_Teeth'
            ) {

              object.visible = true;
              object.material = teethMaterial;
              return;

            }


            if (
              name === 'SK_FemBase2_Nails'
            ) {

              object.visible = true;
              object.material = goldMaterial;
              return;

            }


            /* =========================
               DIAGNOSTIC TEST
            ========================= */

            if (
              name === 'Mesh010'
            ) {

              object.visible = true;
              object.material = mesh010Material;

              console.log(
                'Mesh010 painted RED'
              );

              return;

            }


            if (
              name === 'Mesh010_1'
            ) {

              object.visible = true;
              object.material = mesh010_1Material;

              console.log(
                'Mesh010_1 painted GREEN'
              );

              return;

            }


            console.log(
              'UNMAPPED PRIME MESH:',
              name
            );

          }

        );


        /* =========================
           CENTER + CAMERA
        ========================= */

        const box =
          new THREE.Box3()
            .setFromObject(model);

        const size =
          box.getSize(
            new THREE.Vector3()
          );

        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        model.position.set(
          -center.x,
          -center.y,
          -center.z
        );


        const verticalFOV =
          THREE.MathUtils.degToRad(
            camera.fov
          );


        const upperBodyHeight =
          size.y * 0.78;


        let distance =
          upperBodyHeight /
          (
            2 *
            Math.tan(
              verticalFOV / 2
            )
          );


        distance *= 1.05;


        const cameraTargetHeight =
          size.y * 0.17;


        camera.position.set(
          0,
          cameraTargetHeight,
          distance
        );


        camera.lookAt(
          0,
          cameraTargetHeight,
          0
        );


        camera.near =
          Math.max(
            distance / 100,
            0.01
          );

        camera.far =
          distance * 100;

        camera.updateProjectionMatrix();


        status.style.display =
          'none';

      },


      function (xhr) {

        if (xhr.total) {

          const percent =
            Math.round(
              xhr.loaded /
              xhr.total *
              100
            );

          status.textContent =
            'Loading Prime Reception AI… ' +
            percent +
            '%';

        }

      },


      function (error) {

        console.error(
          'GLB ERROR:',
          error
        );

        status.innerHTML =
          'MODEL FAILED TO LOAD<br>' +
          '<small>Check browser console</small>';

      }

    );


    function animate() {

      requestAnimationFrame(
        animate
      );

      renderer.render(
        scene,
        camera
      );

    }


    animate();


    window.addEventListener(

      'resize',

      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }

    );

  </script>

</body>
</html>
